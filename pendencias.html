<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pendências CD - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .timeline-bar { height: 8px; background: #e2e8f0; border-radius: 20px; position: relative; }
        .timeline-fill { height: 100%; background: linear-gradient(90deg, #6366f1 0%, #3b82f6 100%); border-radius: 20px; transition: width 0.8s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto">
                
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-xl font-black uppercase tracking-tighter text-gray-800 tracking-widest">Controle de Ocorrências</h1>
                    <button onclick="abrirDashboard()" class="bg-gray-800 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center gap-2 hover:bg-black transition-all shadow-lg">
                        <span class="material-symbols-outlined text-sm">analytics</span> Dashboard
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Andamento (Geral)</p>
                        <h3 id="cardAndamento" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Atraso (Geral)</p>
                        <h3 id="cardAtraso" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Concluídos (Geral)</p>
                        <h3 id="cardResolvido" class="text-3xl font-black">0</h3>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex flex-wrap gap-4 w-full md:w-auto">
                        <div class="w-full md:w-44">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">ID Ticket</label>
                            <input type="text" id="inputBuscaID" onkeyup="filtrarGeral()" placeholder="Buscar ID..." class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                        </div>
                        <div class="w-full md:w-40">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Status</label>
                            <select id="selectStatus" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos</option>
                                <option value="Em andamento">Em Andamento</option>
                                <option value="Atrasado">Atrasado</option>
                                <option value="Resolvido">Resolvido</option>
                            </select>
                        </div>
                        <div class="w-full md:w-64">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Motivo</label>
                            <select id="selectMotivo" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos os Motivos</option>
                                <option value="Quebra fábrica">Quebra fábrica</option>
                                <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                                <option value="Quebra de produto na embalagem(Externa)">Quebra produto embalagem (Externa)</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="abrirModal()" class="w-full md:w-auto bg-primary text-white px-8 py-2.5 rounded-xl font-bold uppercase text-[10px] shadow-lg hover:bg-red-700 transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-sm">add_circle</span> Abrir Ticket
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-[10px] font-black text-gray-400 uppercase">
                                    <th class="p-4">ID Ticket</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Produto / Fornecedor</th>
                                    <th class="p-4">Referência</th>
                                    <th class="p-4 text-center">Abertura</th>
                                    <th class="p-4 text-center">Previsão</th>
                                    <th class="p-4 text-center">Conclusão</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaChamados" class="divide-y divide-gray-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script>
        // URL ATUALIZADA ABAIXO
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbznCForFxpY6CAU6W3UgglusC8oqyfDz0dqM-l_95xtr9CK9TcFvbw_V7LJQk8jTZH-/exec';
        
        let dadosGlobais = [];
        let ticketAbertoAtual = null;
        let meuGrafico = null;

        function abrirModal() { document.getElementById('modalChamado').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalChamado').classList.add('hidden'); }
        function fecharModalDetalhes() { document.getElementById('modalDetalhes').classList.add('hidden'); }
        function toggleOutros(v) { document.getElementById('divOutros').classList.toggle('hidden', v !== 'Outros'); }

        function abrirDashboard() { 
            const hoje = new Date();
            const primeiroDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split('T')[0];
            const ultimoDia = hoje.toISOString().split('T')[0];
            
            document.getElementById('dashDataInicio').value = primeiroDia;
            document.getElementById('dashDataFim').value = ultimoDia;
            
            document.getElementById('modalDashboard').classList.remove('hidden'); 
            processarDadosDash();
        }
        function fecharDashboard() { document.getElementById('modalDashboard').classList.add('hidden'); }

        function formatarDataBR(dataStr) {
            if (!dataStr || dataStr === "" || dataStr === "---") return "---";
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dataStr)) return dataStr;
            try { const data = new Date(dataStr); return isNaN(data.getTime()) ? dataStr : `${String(data.getUTCDate()).padStart(2, '0')}/${String(data.getUTCMonth() + 1).padStart(2, '0')}/${data.getUTCFullYear()}`; } catch (e) { return dataStr; }
        }

        async function carregarTickets() {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = `<tr><td colspan="7" class="p-10 text-center text-gray-400 italic font-bold">Acessando banco de dados...</td></tr>`;
            try {
                const r = await fetch(WEB_APP_URL);
                dadosGlobais = await r.json();
                atualizarCardsGerais(dadosGlobais);
                renderizarTabela(dadosGlobais);
            } catch (e) { tbody.innerHTML = `<tr><td colspan="7" class="p-10 text-center text-red-500 font-bold">Falha ao carregar dados.</td></tr>`; }
        }

        function atualizarCardsGerais(dados) {
            let and = 0, atr = 0, con = 0;
            const hoje = new Date().setHours(0,0,0,0);
            dados.forEach(d => {
                const status = d[9];
                let dPrevRaw = d[12];
                if(dPrevRaw && dPrevRaw.includes('/')) { const p = dPrevRaw.split('/'); dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`; }
                const isAtrasado = status !== 'Resolvido' && dPrevRaw && new Date(dPrevRaw).getTime() < hoje;
                if(status === 'Resolvido') con++; else if(isAtrasado) atr++; else and++;
            });
            document.getElementById('cardAndamento').innerText = and;
            document.getElementById('cardAtraso').innerText = atr;
            document.getElementById('cardResolvido').innerText = con;
        }

        function filtrarGeral() {
            const idBusca = document.getElementById('inputBuscaID').value.toLowerCase();
            const statusFiltro = document.getElementById('selectStatus').value;
            const motivoFiltro = document.getElementById('selectMotivo').value;
            const hoje = new Date().setHours(0,0,0,0);

            const filtrados = dadosGlobais.filter(d => {
                const idTicket = String(d[0]).toLowerCase();
                const statusTicket = d[9];
                const motivoTicket = d[7] || "";
                
                let dPrevRaw = d[12];
                if(dPrevRaw && dPrevRaw.includes('/')) { const p = dPrevRaw.split('/'); dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`; }
                const isAtrasado = statusTicket !== 'Resolvido' && dPrevRaw && new Date(dPrevRaw).getTime() < hoje;
                const statusFinal = isAtrasado ? 'Atrasado' : statusTicket;

                const motivosPadrao = ["Quebra fábrica", "Quebra depósito/Loja", "Quebra de produto na embalagem(Externa)"];
                const catMotivo = motivosPadrao.includes(motivoTicket) ? motivoTicket : "Outros";

                return idTicket.includes(idBusca) && (statusFiltro === 'todos' || statusFinal === statusFiltro) && (motivoFiltro === 'todos' || catMotivo === motivoFiltro);
            });
            renderizarTabela(filtrados);
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = '';
            const hoje = new Date().setHours(0,0,0,0);
            dados.forEach((linha) => {
                const indexOriginal = dadosGlobais.findIndex(dg => dg[0] === linha[0]);
                const [id, seac, forn, ref, cli, qtd, lote, motivo, obs, status, abertura, resolucao, prevista] = linha;
                const rowId = indexOriginal + 2;
                let dPrevRaw = prevista;
                if(prevista && prevista.includes('/')) { const p = prevista.split('/'); dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`; }
                const isAtrasado = status !== 'Resolvido' && dPrevRaw && new Date(dPrevRaw).getTime() < hoje;
                const statusColor = status === 'Resolvido' ? 'bg-emerald-100 text-emerald-700' : isAtrasado ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 font-black text-primary"><button onclick="verDetalhes(${indexOriginal})" class="hover:underline decoration-2 underline-offset-4">${id}</button></td>
                        <td class="p-4"><span class="px-2 py-1 rounded-md text-[9px] font-black uppercase ${statusColor}">${isAtrasado ? 'Atrasado' : status}</span></td>
                        <td class="p-4"><div class="font-bold">${seac}</div><div class="text-[9px] text-gray-400 uppercase font-black">${forn}</div></td>
                        <td class="p-4 font-bold text-gray-600">${ref}</td>
                        <td class="p-4 text-center text-xs text-gray-500 font-bold">${formatarDataBR(abertura)}</td>
                        <td class="p-4 text-center">${status === 'Resolvido' ? `<span class="text-xs text-gray-400 font-bold">${formatarDataBR(prevista)}</span>` : `<input type="date" value="${dPrevRaw ? dPrevRaw.split('T')[0] : ''}" onchange="atualizarCampo(${rowId}, 'previsao', this.value)" class="border rounded px-1 py-1 text-[10px] font-bold outline-primary">`}</td>
                        <td class="p-4 text-center">${status !== 'Resolvido' ? `<button onclick="finalizarTicket(${rowId})" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg hover:bg-emerald-600 hover:text-white transition-all"><span class="material-symbols-outlined text-sm">check</span></button>` : `<span class="text-emerald-600 text-xs font-black">${formatarDataBR(resolucao)}</span>`}</td>
                    </tr>`;
            });
        }

        // Funções de salvamento e eventos de formulário
        document.getElementById('formTicket').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar'); btn.disabled = true;
            const payload = Object.fromEntries(new FormData(e.target));
            if(payload.motivo === 'Outros') payload.motivo = document.getElementById('inputOutros').value;
            payload.action = 'insert';
            try { 
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); 
                fecharModal(); 
                e.target.reset(); 
                setTimeout(carregarTickets, 1000); 
            } catch (e) {
                console.error(e);
            } finally { 
                btn.disabled = false; 
            }
        });

        window.onload = carregarTickets;
    </script>
</body>
</html>
