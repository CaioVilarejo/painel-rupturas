<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pendências CD - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .timeline-container { position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 20px 0; }
        .timeline-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: #e5e7eb; z-index: 1; transform: translateY(-50%); }
        .timeline-step { position: relative; z-index: 2; background: white; border: 2px solid #e5e7eb; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .step-active { border-color: #E30613; background: #E30613; color: white; box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.1); }
        .step-label { position: absolute; top: 40px; white-space: nowrap; font-size: 10px; font-weight: 800; color: #9ca3af; text-transform: uppercase; }
        .label-active { color: #E30613; }

        /* Estilo para destacar campos novos */
        .field-highlight { border: 1px solid #fee2e2; background-color: #fffafb; }
    </style>
</head>
<body class="flex min-h-screen">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-4 md:p-8 ml-0 md:ml-64 transition-all duration-300">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-black text-gray-900 tracking-tight">CENTRAL DE OCORRÊNCIAS CD</h1>
                <p class="text-sm text-gray-500 font-medium">Gestão e Tratativa de Pendências de Logística</p>
            </div>
            <div class="flex gap-3">
                <button onclick="abrirModal()" class="bg-primary text-white px-6 py-3 rounded-2xl font-black text-sm shadow-lg shadow-red-100 hover:scale-105 transition-transform flex items-center gap-2">
                    <span class="material-symbols-outlined">add_circle</span> NOVO TICKET
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-red-50 rounded-2xl text-primary">
                        <span class="material-symbols-outlined">confirmation_number</span>
                    </div>
                    <span class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Total Mês</span>
                </div>
                <h2 id="totalMesDash" class="text-3xl font-black text-gray-900">0</h2>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 md:col-span-2">
                <div class="flex gap-6 h-full items-center">
                    <div class="w-24 h-24">
                        <canvas id="graficoMotivos"></canvas>
                    </div>
                    <div id="listaLegendaDash" class="flex-1 grid grid-cols-2 gap-2"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <p class="text-[10px] font-black text-gray-400 uppercase mb-2">Filtro Rápido</p>
                <input type="month" id="filtroMesDash" onchange="atualizarDash()" class="w-full bg-gray-50 border-none rounded-xl p-2 text-xs font-bold outline-none">
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-50 flex flex-col md:flex-row justify-between gap-4">
                <div class="relative flex-1 max-w-md">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">search</span>
                    <input type="text" id="inputBusca" onkeyup="filtrarTabela()" placeholder="Buscar por Ticket, Produto ou Fornecedor..." class="w-full pl-12 pr-4 py-3 bg-gray-50 border-none rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-primary/10">
                </div>
                <div class="flex gap-2">
                    <select id="filtroStatus" onchange="filtrarTabela()" class="bg-gray-50 border-none rounded-2xl px-4 py-3 text-[10px] font-black uppercase outline-none">
                        <option value="">Status: Todos</option>
                        <option value="Em Análise">Em Análise</option>
                        <option value="Resolvido">Resolvido</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] font-black text-gray-400 uppercase tracking-widest border-b border-gray-50">
                            <th class="px-6 py-4">Protocolo</th>
                            <th class="px-6 py-4">Informações do Produto</th>
                            <th class="px-6 py-4">Ocorrência</th>
                            <th class="px-6 py-4">Status / Tratativa</th>
                            <th class="px-6 py-4">Responsável</th>
                            <th class="px-6 py-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modalNovoTicket" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-black text-secondary uppercase italic">Abrir Nova Ocorrência</h2>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined text-3xl">cancel</span>
                </button>
            </div>

            <form id="formTicket" class="p-8 overflow-y-auto space-y-5 modal-scroll">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 p-4 bg-red-50/50 rounded-2xl border border-red-100">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-primary uppercase ml-1 tracking-wider">Pendência comunicada a loja?</label>
                        <select id="comunicadoLoja" name="comunicadoLoja" onchange="verificarComunicado(this.value)" required class="w-full bg-white border border-red-200 rounded-xl p-3 text-sm font-bold outline-none focus:ring-2 focus:ring-primary/20">
                            <option value="">Selecione...</option>
                            <option value="Sim">Sim</option>
                            <option value="Não">Não</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-500 uppercase ml-1">Tipo de Solicitação</label>
                        <select name="tipoTicket" required class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm font-bold outline-none">
                            <option value="Complemento">Complemento</option>
                            <option value="Compra nova">Compra nova</option>
                        </select>
                    </div>
                </div>

                <div id="campoResumo" class="hidden space-y-1 border-l-4 border-green-500 pl-4 bg-green-50 p-4 rounded-xl">
                    <label class="text-[10px] font-black text-green-700 uppercase ml-1">Resumo do acordado com a loja</label>
                    <textarea name="resumoAcordo" id="resumoAcordoInput" placeholder="Ex: Alinhado com o gerente que será enviado o lote X..." class="w-full bg-transparent border-none p-0 text-sm font-bold outline-none resize-none" rows="2"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Cód. SEAC</label>
                        <input type="text" name="cod_seac" required class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Fornecedor</label>
                        <input type="text" name="fornecedor" required class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Referência</label>
                        <input type="text" name="referencia" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Cliente / Pedido</label>
                        <input type="text" name="cod_cliente" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-5">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Quantidade</label>
                        <input type="text" name="quantidade" required class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">UM</label>
                        <select name="um" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none">
                            <option value="M2">M2</option>
                            <option value="PC">PC</option>
                            <option value="CX">CX</option>
                        </select>
                    </div>
                    <div class="space-y-1 md:col-span-1 col-span-2">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Motivo</label>
                        <select name="motivo" required class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none">
                            <option value="Quebra">Quebra</option>
                            <option value="Defeito">Defeito</option>
                            <option value="Erro de Separação">Erro de Separação</option>
                            <option value="Tonalidade">Tonalidade</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Lote / Tonalidade (Opcional)</label>
                    <input type="text" name="lote" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none">
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Observações Iniciais</label>
                    <textarea name="observacao" class="w-full bg-gray-100 border-none rounded-xl p-3 text-sm font-bold outline-none" rows="2"></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" id="btnSubmitTicket" class="w-full bg-primary text-white font-black py-4 rounded-2xl shadow-lg shadow-red-200 hover:scale-[1.02] transition-transform uppercase tracking-widest">
                        Gerar Ticket Protocolo
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="menu.js"></script>

    <script>
        // CONFIGURAÇÕES E VARIÁVEIS GLOBAIS
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzf4_37N3n7_07LhUuH8R7M8m-Wn1mXN-eM1G-T-f-T-T-T-T-T-T/exec"; 
        let dadosGlobais = [];
        let chartMotivos = null;

        // 1. LÓGICA DE COMUNICADO (NOVO)
        function verificarComunicado(valor) {
            const campoResumo = document.getElementById('campoResumo');
            const inputResumo = document.getElementById('resumoAcordoInput');
            
            if (valor === "Não") {
                alert("⚠️ INSTRUÇÃO IMPORTANTE:\n\nAntes da abertura do ticket, é necessário comunicar a loja do ocorrido. Verifique a possibilidade de resolução direta com o cliente (oferecendo outro produto, desconto, etc) para evitar a abertura de um ticket desnecessário.");
                campoResumo.classList.add('hidden');
                inputResumo.required = false;
            } else if (valor === "Sim") {
                campoResumo.classList.remove('hidden');
                inputResumo.required = true;
                inputResumo.focus();
            } else {
                campoResumo.classList.add('hidden');
                inputResumo.required = false;
            }
        }

        // 2. FUNÇÕES DO MODAL
        function abrirModal() { document.getElementById('modalNovoTicket').classList.remove('hidden'); }
        function fecharModal() { 
            document.getElementById('modalNovoTicket').classList.add('hidden');
            document.getElementById('formTicket').reset();
            document.getElementById('campoResumo').classList.add('hidden');
        }

        // 3. CARREGAMENTO E RENDERIZAÇÃO
        async function carregarDados() {
            try {
                const resp = await fetch(`${SCRIPT_URL}?action=getPendenciasCD`);
                const data = await resp.json();
                dadosGlobais = data;
                renderizarTabela(data);
                atualizarDash();
            } catch (err) { console.error("Erro ao carregar:", err); }
        }

        function renderizarTabela(dados) {
            const corpo = document.getElementById('tabelaCorpo');
            corpo.innerHTML = '';
            
            // Reverte para mostrar os mais novos primeiro
            [...dados].reverse().forEach((row, index) => {
                const totalRows = dados.length;
                const realIdx = totalRows - index + 1; // Ajuste para o índice da linha no Sheets
                const status = row[9];
                const isResolvido = status === 'Resolvido';

                corpo.innerHTML += `
                    <tr class="hover:bg-gray-50/50 transition-colors">
                        <td class="px-6 py-4">
                            <span class="text-xs font-black text-gray-900 block">${row[0]}</span>
                            <span class="text-[9px] font-bold text-gray-400 uppercase">${row[10]}</span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex flex-col">
                                <span class="text-[11px] font-black text-gray-800">${row[1]} - ${row[3]}</span>
                                <span class="text-[10px] font-medium text-gray-400 uppercase">${row[2]}</span>
                                <span class="text-[9px] font-black text-primary mt-1 italic">TIPO: ${row[19] || 'N/A'}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-1 bg-gray-100 rounded text-[9px] font-black text-gray-600 uppercase">${row[7]}</span>
                                <span class="text-xs font-bold text-gray-900">${row[5]} ${row[16] || 'UN'}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 min-w-[200px]">
                            <div class="flex flex-col gap-2">
                                <span class="px-2 py-1 rounded-lg text-[9px] font-black uppercase w-fit ${isResolvido ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                    ${status}
                                </span>
                                <textarea onblur="atualizarCampo(${realIdx}, 'observacao', this.value)" 
                                          class="text-[10px] font-bold text-gray-500 bg-transparent border-none focus:ring-1 focus:ring-primary/20 rounded p-1 outline-none"
                                          placeholder="Tratativa de Compras..." ${isResolvido ? 'disabled' : ''}>${row[8] || ''}</textarea>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <select onchange="atualizarCampo(${realIdx}, 'responsavel', this.value)" 
                                    class="text-[10px] font-bold bg-transparent border-none outline-none ${isResolvido ? 'text-gray-400' : 'text-primary'}"
                                    ${isResolvido ? 'disabled' : ''}>
                                <option value="">DEFINIR...</option>
                                <option value="GABRIEL" ${row[14] === 'GABRIEL' ? 'selected' : ''}>GABRIEL</option>
                                <option value="VINICIUS" ${row[14] === 'VINICIUS' ? 'selected' : ''}>VINICIUS</option>
                                <option value="LUANA" ${row[14] === 'LUANA' ? 'selected' : ''}>LUANA</option>
                            </select>
                            ${row[15] ? `<span class="text-[8px] block text-gray-400 font-bold">${row[15]}</span>` : ''}
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex justify-center gap-2">
                                ${!isResolvido ? `
                                    <button onclick="concluirTicket(${realIdx})" class="p-2 bg-green-50 text-green-600 rounded-xl hover:bg-green-600 hover:text-white transition-all shadow-sm">
                                        <span class="material-symbols-outlined text-sm">check_circle</span>
                                    </button>
                                ` : `
                                    <div class="text-right">
                                        <span class="text-[8px] font-black text-green-600 block uppercase">Resolvido em</span>
                                        <span class="text-[10px] font-bold text-gray-400">${row[11]}</span>
                                    </div>
                                `}
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        // 4. ENVIO E ATUALIZAÇÕES
        document.getElementById('formTicket').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitTicket');
            btn.disabled = true;
            btn.innerText = "PROCESSANDO...";

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.action = 'insert';
            data.criado_por = localStorage.getItem('vilarejo_user') || 'Sistema';

            try {
                const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
                if (resp.ok) {
                    fecharModal();
                    carregarDados();
                }
            } catch (err) { alert('Erro ao salvar ticket.'); }
            finally {
                btn.disabled = false;
                btn.innerText = "GERAR TICKET PROTOCOLO";
            }
        });

        async function atualizarCampo(row, field, value) {
            const body = { action: 'update_field', row, field, value };
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
                // Opcional: Feedback de salvo
            } catch (e) { console.error("Erro ao salvar campo"); }
        }

        async function concluirTicket(row) {
            if(!confirm('Deseja finalizar esta ocorrência?')) return;
            const body = { action: 'update', status: 'Resolvido', row };
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
                carregarDados();
            } catch (e) { alert('Erro ao finalizar'); }
        }

        // 5. FILTROS E DASHBOARD
        function filtrarTabela() {
            const busca = document.getElementById('inputBusca').value.toLowerCase();
            const status = document.getElementById('filtroStatus').value;
            const rows = document.querySelectorAll('#tabelaCorpo tr');

            rows.forEach(tr => {
                const txt = tr.innerText.toLowerCase();
                const matchesBusca = txt.includes(busca);
                const matchesStatus = status === "" || txt.includes(status.toLowerCase());
                tr.style.display = (matchesBusca && matchesStatus) ? "" : "none";
            });
        }

        function atualizarDash() {
            const mesSel = document.getElementById('filtroMesDash').value; 
            let total = 0;
            const cont = { "Quebra": 0, "Defeito": 0, "Erro de Separação": 0, "Tonalidade": 0, "Outros": 0 };
            
            const hoje = new Date();
            const mesAtualFiltro = mesSel || `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;

            dadosGlobais.forEach(d => {
                const dataPartes = d[10].split('/'); // dd/mm/yyyy
                if(dataPartes.length === 3) {
                    const mesAnoTicket = `${dataPartes[2]}-${dataPartes[1]}`;
                    if (mesAnoTicket === mesAtualFiltro) {
                        total++;
                        const m = d[7] || "";
                        if (cont[m] !== undefined) cont[m]++; else cont["Outros"]++;
                    }
                }
            });
            
            document.getElementById('totalMesDash').innerText = total;
            renderizarGrafico(cont);
        }

        function renderizarGrafico(cont) {
            const ctx = document.getElementById('graficoMotivos').getContext('2d');
            if(chartMotivos) chartMotivos.destroy();
            chartMotivos = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(cont),
                    datasets: [{ 
                        data: Object.values(cont), 
                        backgroundColor: ['#E30613', '#111827', '#3b82f6', '#94a3b8', '#e5e7eb'], 
                        borderWidth: 0 
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    cutout: '70%'
                }
            });
            
            const leg = document.getElementById('listaLegendaDash');
            leg.innerHTML = '';
            Object.entries(cont).forEach(([label, valor]) => {
                if(valor > 0) {
                    leg.innerHTML += `
                        <div class="flex justify-between p-2 bg-gray-50 rounded-xl font-bold text-[9px] uppercase">
                            <span class="text-gray-400">${label}</span>
                            <span class="text-gray-900">${valor}</span>
                        </div>`;
                }
            });
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
