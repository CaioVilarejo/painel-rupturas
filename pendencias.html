<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendências CD - Vilarejo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .loading { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 flex">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 h-screen overflow-y-auto">
        <div class="max-w-6xl mx-auto">
            
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-black text-gray-800">Pendências CD</h1>
                    <p class="text-gray-500">Gestão de divergências e tickets de entrada.</p>
                </div>
                <button onclick="abrirModal()" class="bg-red-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-red-700 transition-all shadow-lg">
                    <span class="material-symbols-outlined">add_circle</span> Novo Ticket
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase">ID / Status</th>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase">Fornecedor</th>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase">Motivo</th>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase">Abertura</th>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-tickets">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-ticket" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-2xl rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-black mb-6">Abrir Nova Pendência</h2>
            <form id="form-ticket" class="grid grid-cols-2 gap-4">
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Cod. SEAC</label>
                    <input type="text" name="cod_seac" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-red-600">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Cód. Cliente (Opcional)</label>
                    <input type="text" name="cod_cliente" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-red-600">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Fornecedor</label>
                    <input type="text" name="fornecedor" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-red-600">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Referência</label>
                    <input type="text" name="referencia" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-red-600">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Quantidade</label>
                    <input type="number" name="quantidade" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-red-600">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Motivo</label>
                    <select name="motivo" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-red-600">
                        <option value="Sobra">Sobra</option>
                        <option value="Falta">Falta</option>
                        <option value="Avaria">Avaria</option>
                        <option value="Troca">Troca</option>
                    </select>
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Lote</label>
                    <input type="text" name="lote" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-red-600">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Observações</label>
                    <textarea name="observacao" rows="3" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-red-600"></textarea>
                </div>
                <div class="col-span-2 flex gap-3 mt-4">
                    <button type="button" onclick="fecharModal()" class="flex-1 py-4 font-bold text-gray-500 hover:bg-gray-100 rounded-xl transition-all">Cancelar</button>
                    <button type="submit" class="flex-1 py-4 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 shadow-lg transition-all">Criar Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        const WEB_APP_URL = "SUA_URL_DO_APP_SCRIPT_AQUI";
        let ticketsCache = [];

        async function carregarTickets() {
            const lista = document.getElementById('lista-tickets');
            lista.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">Carregando pendências...</td></tr>';
            
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                ticketsCache = data;
                renderizarLista(data);
            } catch (error) {
                lista.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-red-500 font-bold">Erro ao carregar dados.</td></tr>';
            }
        }

        function renderizarLista(dados) {
            const lista = document.getElementById('lista-tickets');
            lista.innerHTML = '';

            dados.forEach((row, index) => {
                const realRowIndex = index + 2; // +1 cabeçalho, +1 base zero
                const id = row[0];
                const fornecedor = row[2];
                const motivo = row[7];
                const status = row[9];
                const dataAbertura = row[10];
                const responsavelAtual = row[14] || ""; // Coluna O

                const statusColor = status === 'Resolvido' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';

                lista.innerHTML += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition-all">
                        <td class="p-4">
                            <button onclick="toggleDetalhes(${realRowIndex})" class="text-blue-600 font-black hover:underline text-sm block">${id}</button>
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${statusColor}">${status}</span>
                        </td>
                        <td class="p-4 text-sm font-medium text-gray-700">${fornecedor}</td>
                        <td class="p-4 text-sm text-gray-500">${motivo}</td>
                        <td class="p-4 text-xs text-gray-400 font-bold">${dataAbertura}</td>
                        <td class="p-4 text-center">
                            <button onclick="resolverTicket(${realRowIndex})" class="p-2 text-green-600 hover:bg-green-50 rounded-lg" title="Resolver">
                                <span class="material-symbols-outlined">check_circle</span>
                            </button>
                        </td>
                    </tr>
                    <tr id="detalhe-${realRowIndex}" class="hidden bg-gray-50 border-b border-gray-100">
                        <td colspan="5" class="p-6">
                            <div class="grid grid-cols-3 gap-6">
                                <div>
                                    <p class="text-[10px] font-bold text-gray-400 uppercase">Observação</p>
                                    <p class="text-sm text-gray-700 mt-1">${row[8] || 'Sem obs.'}</p>
                                    
                                    <div class="mt-4">
                                        <p class="text-[10px] font-bold text-gray-400 uppercase">Criado por</p>
                                        <p class="text-sm font-bold text-gray-800">${row[13] || 'Desconhecido'}</p>
                                    </div>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-400 uppercase">Responsável pelo Ticket</label>
                                    <select onchange="atualizarCampo(${realRowIndex}, 'responsavel', this.value)" class="w-full mt-1 p-2 bg-white border border-gray-200 rounded-lg text-sm font-bold outline-none focus:border-red-600">
                                        <option value="">Selecione...</option>
                                        ${['Eduardo', 'Edson', 'Fábio', 'Leandro', 'Herialdo', 'Bruna', 'Renielle', 'Caio'].map(nome => 
                                            `<option value="${nome}" ${responsavelAtual === nome ? 'selected' : ''}>${nome}</option>`
                                        ).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-400 uppercase">Previsão</label>
                                    <input type="date" onchange="atualizarCampo(${realRowIndex}, 'previsao', this.value)" class="w-full mt-1 p-2 bg-white border border-gray-200 rounded-lg text-sm outline-none">
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function toggleDetalhes(index) {
            const el = document.getElementById(`detalhe-${index}`);
            el.classList.toggle('hidden');
        }

        async function atualizarCampo(rowIndex, campo, valor) {
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'update_field', row: rowIndex, field: campo, value: valor })
                });
                console.log("Campo atualizado com sucesso");
            } catch (e) { alert("Erro ao salvar alteração"); }
        }

        document.getElementById('form-ticket').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            // IMPORTANTE: Captura o nome de quem logou
            const usuarioLogado = localStorage.getItem('usuarioLogado') || "Usuário Offline";

            const payload = {
                action: 'insert',
                criado_por: usuarioLogado,
                ...Object.fromEntries(formData)
            };

            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Criando...";
            btn.disabled = true;

            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                fecharModal();
                carregarTickets();
                e.target.reset();
            } catch (error) { alert("Erro ao criar ticket"); }
            btn.innerText = "Criar Ticket";
            btn.disabled = false;
        };

        function abrirModal() { document.getElementById('modal-ticket').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modal-ticket').classList.add('hidden'); }

        window.onload = carregarTickets;
    </script>
</body>
</html>
