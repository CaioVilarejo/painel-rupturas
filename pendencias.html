<div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1 tracking-tighter">Status do Ticket</label>
                        <div class="relative">
                            <select onchange="filtrarTabela(this.value)" class="bg-white border border-gray-200 rounded-xl px-4 py-2.5 pr-10 text-xs font-bold text-gray-700 outline-none focus:border-primary shadow-sm cursor-pointer min-w-[200px]">
                                <option value="todos">Todos os Status</option>
                                <option value="Em andamento">Em Andamento</option>
                                <option value="Atrasado">Em Atraso</option>
                                <option value="Resolvido">Concluídos</option>
                            </select>
                            <span class="material-symbols-outlined absolute right-3 top-2.5 text-gray-400 pointer-events-none text-sm">expand_more</span>
                        </div>
                    </div>
                    
                    <button onclick="abrirModal()" class="bg-primary text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-red-700 transition-all shadow-lg shadow-red-100 uppercase text-[10px] tracking-widest">
                        <span class="material-symbols-outlined text-sm">add_circle</span> Abrir Novo Chamado
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-[10px] font-black text-gray-400 uppercase">
                                <th class="p-4">Ticket</th>
                                <th class="p-4">Status</th>
                                <th class="p-4">Produto / Fornecedor</th>
                                <th class="p-4">Abertura</th>
                                <th class="p-4">Previsão</th>
                                <th class="p-4 text-center">Concluir Chamado</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaChamados" class="divide-y divide-gray-100 text-sm text-gray-700">
                            </tbody>
                    </table>
                </div>

<div id="modalChamado" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-black text-gray-800 uppercase tracking-tighter">Novo Chamado</h2>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button>
            </div>
            
            <form id="formTicket" class="p-6 grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase">Cód Produto Seac</label>
                    <input type="text" name="cod_seac" required class="w-full border rounded-xl p-3 text-sm focus:border-primary outline-none bg-gray-50">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase">Fornecedor</label>
                    <input type="text" name="fornecedor" required class="w-full border rounded-xl p-3 text-sm focus:border-primary outline-none bg-gray-50">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase">Referência</label>
                    <input type="text" name="referencia" required class="w-full border rounded-xl p-3 text-sm focus:border-primary outline-none bg-gray-50">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase">Cód Cliente</label>
                    <input type="text" name="cod_cliente" class="w-full border rounded-xl p-3 text-sm focus:border-primary outline-none bg-gray-50">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase">Quantidade</label>
                    <input type="number" name="quantidade" required class="w-full border rounded-xl p-3 text-sm focus:border-primary outline-none bg-gray-50">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase">Tonalidade / Lote</label>
                    <input type="text" name="lote" class="w-full border rounded-xl p-3 text-sm focus:border-primary outline-none bg-gray-50">
                </div>
                <div class="col-span-2 space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase">Motivo</label>
                    <select name="motivo" id="selectMotivo" onchange="toggleOutros(this.value)" class="w-full border rounded-xl p-3 text-sm focus:border-primary outline-none bg-gray-50">
                        <option value="Quebra fábrica">Quebra fábrica</option>
                        <option value="Quebra de produto na embalagem(Externa)">Quebra de produto na embalagem(Externa)</option>
                        <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div id="divOutros" class="col-span-2 hidden">
                    <input type="text" id="inputOutros" placeholder="Especifique o motivo..." class="w-full border rounded-xl p-3 text-sm border-primary outline-none">
                </div>
                <div class="col-span-2 space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 uppercase">Observações</label>
                    <textarea name="observacao" rows="2" class="w-full border rounded-xl p-3 text-sm focus:border-primary outline-none resize-none bg-gray-50"></textarea>
                </div>
                
                <div class="col-span-2 pt-4 flex gap-3">
                    <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-100 text-gray-500 font-bold py-3 rounded-xl hover:bg-gray-200 uppercase text-xs">Descartar</button>
                    <button type="submit" id="btnSalvar" class="flex-1 bg-primary text-white font-bold py-3 rounded-xl hover:bg-red-700 shadow-lg shadow-red-100 uppercase text-xs">Registrar</button>
                </div>
            </form>
        </div>
    </div>

<script>
    // ... (Mantendo as funções carregarTickets e filtrarTabela iguais ao código anterior) ...

    function renderizarTabela(dados) {
        const tbody = document.getElementById('tabelaChamados');
        let and = 0, atr = 0, con = 0;
        tbody.innerHTML = '';

        dados.forEach((linha, index) => {
            const [id, seac, forn, ref, cli, qtd, lote, motivo, obs, status, abertura, resolucao, prevista] = linha;
            const rowId = index + 2;

            // Lógica de Atrasado (Trata data no formato BR ou ISO)
            let dataComparacao = prevista;
            if(prevista && prevista.includes('/')) {
                const p = prevista.split('/');
                dataComparacao = `${p[2]}-${p[1]}-${p[0]}`;
            }
            const dPrev = dataComparacao ? new Date(dataComparacao).getTime() : 0;
            const hoje = new Date().setHours(0,0,0,0);
            const isAtrasado = status !== 'Resolvido' && dPrev > 0 && dPrev < hoje;

            if(status === 'Resolvido') con++; else if(isAtrasado) atr++; else and++;

            const statusColor = status === 'Resolvido' ? 'bg-emerald-100 text-emerald-700' : 
                               isAtrasado ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700';

            // Input de Data de Previsão
            const dataPrevInput = status === 'Resolvido' ? 
                `<span class="text-gray-400 text-xs">${prevista || '---'}</span>` :
                `<input type="date" onchange="atualizarCampo(${rowId}, 'previsao', this.value)" 
                    class="bg-gray-50 border border-gray-200 rounded px-2 py-1 text-xs focus:border-primary outline-none">`;

            tbody.innerHTML += `
                <tr class="hover:bg-gray-50/50 transition-colors">
                    <td class="p-4 font-black text-gray-900">${id}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded-md text-[9px] font-black uppercase ${statusColor}">${isAtrasado ? 'Em Atraso' : status}</span>
                    </td>
                    <td class="p-4">
                        <div class="font-bold text-gray-800">${ref}</div>
                        <div class="text-[10px] text-gray-400 uppercase font-medium">${forn} (SEAC: ${seac})</div>
                    </td>
                    <td class="p-4 text-xs text-gray-500 font-medium">${abertura || '---'}</td>
                    <td class="p-4">${dataPrevInput}</td>
                    <td class="p-4 text-center">
                        ${status !== 'Resolvido' ? `
                            <button onclick="finalizarTicket(${rowId})" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white p-2 rounded-lg transition-all" title="Concluir">
                                <span class="material-symbols-outlined text-sm">check</span>
                            </button>` : `<span class="text-emerald-500 text-xs font-bold">${resolucao}</span>`}
                    </td>
                </tr>`;
        });

        // Atualiza Cards
        document.getElementById('cardAndamento').innerText = and;
        document.getElementById('cardAtraso').innerText = atr;
        document.getElementById('cardResolvido').innerText = con;
    }
</script>
