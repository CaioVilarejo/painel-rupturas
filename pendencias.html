<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pendências CD - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-scroll::-webkit-scrollbar { width: 8px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #d1d1d1; border-radius: 10px; }
        
        /* Estilo da Linha do Tempo */
        .timeline-bar { height: 8px; background: #e5e7eb; border-radius: 20px; position: relative; }
        .timeline-fill { height: 100%; background: linear-gradient(90deg, #6366f1 0%, #3b82f6 100%); border-radius: 20px; transition: width 0.7s ease; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-7xl mx-auto">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Andamento</p>
                        <h3 id="cardAndamento" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Atraso</p>
                        <h3 id="cardAtraso" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Concluídos</p>
                        <h3 id="cardResolvido" class="text-3xl font-black">0</h3>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6">
                    <div class="w-full md:w-auto">
                        <label class="text-[10px] font-black text-gray-400 uppercase">Filtrar</label>
                        <select onchange="filtrarTabela(this.value)" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-xs font-bold outline-none">
                            <option value="todos">Todos os Status</option>
                            <option value="Em andamento">Em Andamento</option>
                            <option value="Atrasado">Atrasados</option>
                            <option value="Resolvido">Resolvidos</option>
                        </select>
                    </div>
                    <button onclick="abrirModal()" class="w-full md:w-auto bg-primary text-white px-8 py-3 rounded-xl font-bold uppercase text-[10px] shadow-lg hover:bg-red-700 transition-all">
                        <span class="material-symbols-outlined align-middle mr-1 text-sm">add_circle</span> Abrir Novo Chamado
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-[10px] font-black text-gray-400 uppercase">
                                    <th class="p-4">ID Ticket</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Produto / Fornecedor</th>
                                    <th class="p-4">Referência</th>
                                    <th class="p-4 text-center">Abertura</th>
                                    <th class="p-4 text-center">Previsão</th>
                                    <th class="p-4 text-center">Conclusão</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaChamados" class="divide-y divide-gray-100 text-sm">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalDetalhes" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-3xl">
                <div>
                    <h2 id="detalheID" class="text-3xl font-black text-gray-800 tracking-tighter"></h2>
                    <span id="detalheStatusBadge" class="text-[10px] font-black uppercase"></span>
                </div>
                <button onclick="fecharModalDetalhes()" class="text-gray-400 hover:text-primary"><span class="material-symbols-outlined text-3xl">close</span></button>
            </div>

            <div class="p-8 overflow-y-auto modal-scroll space-y-8">
                <div class="space-y-4">
                    <h3 class="text-[11px] font-black text-gray-400 uppercase tracking-widest text-center">Linha do Tempo de Resolução</h3>
                    <div class="pt-2 pb-6 px-4">
                        <div class="timeline-bar">
                            <div id="timelineFill" class="timeline-fill" style="width: 0%;"></div>
                            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-indigo-600 border-2 border-white rounded-full"></div>
                            <div id="nodePrev" class="absolute left-1/2 top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-gray-300 border-2 border-white rounded-full shadow transition-colors"></div>
                            <div id="nodeConc" class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-gray-200 border-2 border-white rounded-full transition-colors"></div>
                        </div>
                        <div class="flex justify-between mt-4">
                            <div class="text-center w-1/3">
                                <p class="text-[10px] font-bold text-gray-800 uppercase">Data Inicial</p>
                                <p id="timeAbertura" class="text-[10px] text-gray-500 font-medium"></p>
                            </div>
                            <div class="text-center w-1/3">
                                <p class="text-[10px] font-bold text-gray-800 uppercase">Previsão</p>
                                <p id="timePrevisaoModal" class="text-[10px] text-gray-500 font-medium"></p>
                            </div>
                            <div class="text-center w-1/3">
                                <p class="text-[10px] font-bold text-gray-800 uppercase">Conclusão</p>
                                <p id="timeConclusao" class="text-[10px] text-gray-500 font-medium"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-6 pt-6 border-t border-gray-100">
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">Cód. SEAC</label><p id="detalheSeac" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">Fornecedor</label><p id="detalheForn" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">Referência</label><p id="detalheRef" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">Cód. Cliente</label><p id="detalheCli" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">Quantidade</label><p id="detalheQtd" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">Lote</label><p id="detalheLote" class="font-bold text-gray-800"></p></div>
                    <div class="col-span-full"><label class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">Motivo</label><p id="detalheMotivo" class="text-xs font-medium text-gray-700 italic bg-gray-50 p-3 rounded-lg border border-dashed"></p></div>
                </div>

                <div class="space-y-3 pt-6 border-t border-gray-100">
                    <label class="text-[10px] font-black text-gray-400 uppercase flex items-center gap-2">Histórico de Tratativas</label>
                    <textarea id="detalheObs" rows="4" class="w-full border-2 border-gray-100 rounded-2xl p-4 text-sm outline-none focus:border-primary bg-gray-50 transition-all resize-none shadow-inner" placeholder="Andamento da resolução..."></textarea>
                </div>
            </div>
            
            <div class="p-6 bg-gray-50 rounded-b-3xl">
                <button id="btnSalvarObs" onclick="salvarObservacao()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-black transition-all shadow-xl">
                    Atualizar Informações do Ticket
                </button>
            </div>
        </div>
    </div>

    <div id="modalChamado" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="text-xl font-black text-primary uppercase">Novo Registro</h2>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button>
            </div>
            <form id="formTicket" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="cod_seac" placeholder="Cód Produto Seac" required class="p-3 border rounded-xl outline-none focus:border-primary">
                <input type="text" name="fornecedor" placeholder="Fornecedor" required class="p-3 border rounded-xl outline-none focus:border-primary">
                <input type="text" name="referencia" placeholder="Referência" required class="p-3 border rounded-xl outline-none focus:border-primary">
                <input type="text" name="cod_cliente" placeholder="Cód Cliente" class="p-3 border rounded-xl outline-none focus:border-primary">
                <input type="number" name="quantidade" placeholder="Quantidade" required class="p-3 border rounded-xl outline-none focus:border-primary">
                <input type="text" name="lote" placeholder="Tonalidade / Lote" class="p-3 border rounded-xl outline-none focus:border-primary">
                <div class="col-span-full">
                    <select name="motivo" onchange="toggleOutros(this.value)" class="w-full p-3 border rounded-xl outline-none focus:border-primary bg-white">
                        <option value="Quebra fábrica">Quebra fábrica</option>
                        <option value="Quebra de produto na embalagem(Externa)">Quebra de produto na embalagem(Externa)</option>
                        <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div id="divOutros" class="col-span-full hidden"><input type="text" id="inputOutros" placeholder="Especifique..." class="w-full p-3 border border-primary rounded-xl outline-none"></div>
                <textarea name="observacao" placeholder="Observações Iniciais" rows="2" class="col-span-full p-3 border rounded-xl outline-none focus:border-primary"></textarea>
                <div class="col-span-full flex gap-3 pt-4">
                    <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold uppercase text-[10px]">Cancelar</button>
                    <button type="submit" id="btnSalvar" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold uppercase text-[10px] shadow-lg">Registrar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyMh4zjTsm5TJ1M4HWRyh8fX5_EOeR942DmUim8ZPPHFO3EkRdLga6Yxf3KosmS19tV/exec';
        let dadosGlobais = [];
        let ticketAbertoAtual = null;

        function abrirModal() { document.getElementById('modalChamado').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalChamado').classList.add('hidden'); }
        function fecharModalDetalhes() { document.getElementById('modalDetalhes').classList.add('hidden'); }
        function toggleOutros(v) { document.getElementById('divOutros').classList.toggle('hidden', v !== 'Outros'); }

        function formatarDataBR(dataStr) {
            if (!dataStr || dataStr === "") return "---";
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dataStr)) return dataStr;
            try {
                const data = new Date(dataStr);
                return isNaN(data.getTime()) ? dataStr : `${String(data.getUTCDate()).padStart(2, '0')}/${String(data.getUTCMonth() + 1).padStart(2, '0')}/${data.getUTCFullYear()}`;
            } catch (e) { return dataStr; }
        }

        async function carregarTickets() {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = `<tr><td colspan="7" class="p-10 text-center text-gray-400 italic font-bold">Sincronizando com a planilha...</td></tr>`;
            try {
                const r = await fetch(WEB_APP_URL);
                dadosGlobais = await r.json();
                renderizarTabela(dadosGlobais);
            } catch (e) { tbody.innerHTML = `<tr><td colspan="7" class="p-10 text-center text-red-500 font-bold">Erro de conexão.</td></tr>`; }
        }

        function verDetalhes(index) {
            const t = dadosGlobais[index];
            ticketAbertoAtual = { index: index, row: index + 2 };

            document.getElementById('detalheID').innerText = t[0];
            document.getElementById('detalheSeac').innerText = t[1];
            document.getElementById('detalheForn').innerText = t[2];
            document.getElementById('detalheRef').innerText = t[3];
            document.getElementById('detalheCli').innerText = t[4] || "---";
            document.getElementById('detalheQtd').innerText = t[5];
            document.getElementById('detalheLote').innerText = t[6] || "---";
            document.getElementById('detalheMotivo').innerText = t[7];
            document.getElementById('detalheObs').value = t[8] || "";

            const badge = document.getElementById('detalheStatusBadge');
            badge.innerText = t[9];
            badge.className = t[9] === 'Resolvido' ? 'text-emerald-500' : 'text-blue-500';

            // TIMELINE 3 PONTOS
            document.getElementById('timeAbertura').innerText = formatarDataBR(t[10]);
            document.getElementById('timePrevisaoModal').innerText = formatarDataBR(t[12]);
            document.getElementById('timeConclusao').innerText = t[11] ? formatarDataBR(t[11]) : "Pendente";

            const fill = document.getElementById('timelineFill');
            const nPrev = document.getElementById('nodePrev');
            const nConc = document.getElementById('nodeConc');

            if (t[9] === 'Resolvido') {
                fill.style.width = '100%';
                nPrev.classList.replace('bg-gray-300', 'bg-indigo-600');
                nConc.classList.replace('bg-gray-200', 'bg-indigo-600');
            } else if (t[12]) {
                fill.style.width = '50%';
                nPrev.classList.replace('bg-gray-300', 'bg-indigo-600');
                nConc.classList.add('bg-gray-200');
            } else {
                fill.style.width = '0%';
                nPrev.classList.add('bg-gray-300');
                nConc.classList.add('bg-gray-200');
            }

            document.getElementById('modalDetalhes').classList.remove('hidden');
        }

        async function salvarObservacao() {
            const btn = document.getElementById('btnSalvarObs');
            const novaObs = document.getElementById('detalheObs').value;
            btn.disabled = true; btn.innerText = "Salvando...";
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update_field', row: ticketAbertoAtual.row, field: 'observacao', value: novaObs }) });
                dadosGlobais[ticketAbertoAtual.index][8] = novaObs;
                fecharModalDetalhes();
                alert("Atualizado com sucesso!");
            } catch (e) { alert("Erro ao salvar."); }
            finally { btn.disabled = false; btn.innerText = "Atualizar Informações do Ticket"; }
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabelaChamados');
            let and = 0, atr = 0, con = 0;
            tbody.innerHTML = '';

            dados.forEach((linha, index) => {
                const [id, seac, forn, ref, cli, qtd, lote, motivo, obs, status, abertura, resolucao, prevista] = linha;
                const rowId = index + 2;
                
                let dPrevRaw = prevista;
                if(prevista && prevista.includes('/')) {
                    const p = prevista.split('/');
                    dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`;
                }
                const isAtrasado = status !== 'Resolvido' && dPrevRaw && new Date(dPrevRaw).getTime() < new Date().setHours(0,0,0,0);
                if(status === 'Resolvido') con++; else if(isAtrasado) atr++; else and++;

                const statusColor = status === 'Resolvido' ? 'bg-emerald-100 text-emerald-700' : 
                                   isAtrasado ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 font-black text-primary"><button onclick="verDetalhes(${index})" class="hover:underline">${id}</button></td>
                        <td class="p-4"><span class="px-2 py-1 rounded-md text-[9px] font-black uppercase ${statusColor}">${isAtrasado ? 'Atrasado' : status}</span></td>
                        <td class="p-4"><div class="font-bold">${seac}</div><div class="text-[9px] text-gray-400 uppercase font-black">${forn}</div></td>
                        <td class="p-4 font-bold text-gray-600">${ref}</td>
                        <td class="p-4 text-center text-xs text-gray-500 font-bold">${formatarDataBR(abertura)}</td>
                        <td class="p-4 text-center">
                            ${status === 'Resolvido' ? `<span class="text-xs text-gray-400">${formatarDataBR(prevista)}</span>` : 
                            `<input type="date" value="${dPrevRaw ? dPrevRaw.split('T')[0] : ''}" onchange="atualizarCampo(${rowId}, 'previsao', this.value)" class="border rounded px-1 py-1 text-[10px] font-bold">`}
                        </td>
                        <td class="p-4 text-center">
                            ${status !== 'Resolvido' ? `<button onclick="finalizarTicket(${rowId})" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg hover:bg-emerald-600 hover:text-white"><span class="material-symbols-outlined text-sm">check</span></button>` : 
                            `<span class="text-emerald-600 text-xs font-black">${formatarDataBR(resolucao)}</span>`}
                        </td>
                    </tr>`;
            });

            document.getElementById('cardAndamento').innerText = and;
            document.getElementById('cardAtraso').innerText = atr;
            document.getElementById('cardResolvido').innerText = con;
        }

        async function atualizarCampo(row, campo, valor) {
            try { await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update_field', row: row, field: campo, value: valor }) }); setTimeout(carregarTickets, 1000); } catch (e) {}
        }

        async function finalizarTicket(row) {
            if(!confirm("Concluir chamado?")) return;
            try { await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', row: row, status: 'Resolvido' }) }); setTimeout(carregarTickets, 1000); } catch (e) {}
        }

        document.getElementById('formTicket').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar'); btn.disabled = true; btn.innerText = "Aguarde...";
            const payload = Object.fromEntries(new FormData(e.target));
            if(payload.motivo === 'Outros') payload.motivo = document.getElementById('inputOutros').value;
            payload.action = 'insert';
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                fecharModal(); e.target.reset(); setTimeout(carregarTickets, 1000);
            } catch (e) { alert("Erro ao salvar."); }
            finally { btn.innerText = "Registrar"; btn.disabled = false; }
        });

        window.onload = carregarTickets;
    </script>
</body>
</html>
