<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pendências CD - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .timeline-bar { height: 8px; background: #e2e8f0; border-radius: 20px; position: relative; }
        .timeline-fill { height: 100%; background: linear-gradient(90deg, #6366f1 0%, #3b82f6 100%); border-radius: 20px; transition: width 0.8s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto">
                
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-xl font-black uppercase tracking-widest text-gray-800">Controle de Ocorrências</h1>
                    <button onclick="abrirDashboard()" class="bg-gray-800 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center gap-2 hover:bg-black transition-all shadow-lg">
                        <span class="material-symbols-outlined text-sm">analytics</span> Dashboard
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Andamento</p>
                        <h3 id="cardAndamento" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Atraso</p>
                        <h3 id="cardAtraso" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Concluídos</p>
                        <h3 id="cardResolvido" class="text-3xl font-black">0</h3>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex flex-wrap gap-4 w-full md:w-auto">
                        <div class="w-full md:w-44">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">ID Ticket</label>
                            <input type="text" id="inputBuscaID" onkeyup="filtrarGeral()" placeholder="Buscar ID..." class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                        </div>
                        <div class="w-full md:w-40">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Status</label>
                            <select id="selectStatus" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos</option>
                                <option value="Em andamento">Em Andamento</option>
                                <option value="Atrasado">Atrasado</option>
                                <option value="Resolvido">Resolvido</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="abrirModal()" class="w-full md:w-auto bg-primary text-white px-8 py-2.5 rounded-xl font-bold uppercase text-[10px] shadow-lg hover:bg-red-700 transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-sm">add_circle</span> Abrir Ticket
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-[10px] font-black text-gray-400 uppercase">
                                    <th class="p-4">ID Ticket</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Produto / Fornecedor</th>
                                    <th class="p-4">Responsável</th>
                                    <th class="p-4 text-center">Abertura</th>
                                    <th class="p-4 text-center">Previsão</th>
                                    <th class="p-4 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaChamados" class="divide-y divide-gray-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalDetalhes" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-3xl">
                <div><h2 id="detalheID" class="text-3xl font-black text-gray-800 tracking-tighter"></h2><span id="detalheStatusBadge" class="text-[10px] font-black uppercase"></span></div>
                <button onclick="fecharModalDetalhes()" class="text-gray-400 hover:text-primary"><span class="material-symbols-outlined text-3xl">close</span></button>
            </div>
            <div class="p-8 overflow-y-auto modal-scroll space-y-8">
                <div class="grid grid-cols-2 md:grid-cols-3 gap-6 text-sm">
                    <div><label class="text-[9px] font-black text-gray-400 uppercase">Cód. SEAC</label><p id="detalheSeac" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase">Fornecedor</label><p id="detalheForn" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase">Criado por</label><p id="detalheCriadoPor" class="font-bold text-red-600"></p></div>
                    
                    <div class="col-span-full">
                        <label class="text-[9px] font-black text-gray-400 uppercase">Responsável pelo Ticket</label>
                        <select id="selectResponsavel" onchange="atualizarResponsavelTicket(this.value)" class="w-full mt-1 p-2 border rounded-lg font-bold text-sm bg-gray-50 outline-none focus:border-primary">
                            <option value="">Selecione...</option>
                            <option value="Eduardo">Eduardo</option>
                            <option value="Edson">Edson</option>
                            <option value="Fábio">Fábio</option>
                            <option value="Leandro">Leandro</option>
                            <option value="Herialdo">Herialdo</option>
                            <option value="Bruna">Bruna</option>
                            <option value="Renielle">Renielle</option>
                            <option value="Caio">Caio</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-3 pt-6 border-t">
                    <label class="text-[10px] font-black text-gray-400 uppercase">Acompanhamento / Histórico</label>
                    <textarea id="detalheObs" rows="4" class="w-full border-2 border-gray-100 rounded-2xl p-4 text-sm outline-none focus:border-primary bg-gray-50 transition-all resize-none shadow-inner"></textarea>
                </div>
            </div>
            <div class="p-6 bg-gray-50 rounded-b-3xl">
                <button id="btnSalvarObs" onclick="salvarObservacao()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-black transition-all">Salvar Tratativa</button>
            </div>
        </div>
    </div>

    <div id="modalChamado" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-gray-50 flex justify-between items-center"><h2 class="text-xl font-black text-primary uppercase">Registrar Pendência</h2><button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button></div>
            <form id="formTicket" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="cod_seac" placeholder="Cód Produto Seac" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm">
                <input type="text" name="fornecedor" placeholder="Fornecedor" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm">
                <input type="text" name="referencia" placeholder="Referência" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm">
                <input type="text" name="cod_cliente" placeholder="Cód Cliente" class="p-3 border rounded-xl outline-none focus:border-primary text-sm">
                <input type="number" name="quantidade" placeholder="Quantidade" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm">
                <input type="text" name="lote" placeholder="Tonalidade / Lote" class="p-3 border rounded-xl outline-none focus:border-primary text-sm">
                <div class="col-span-full">
                    <select name="motivo" class="w-full p-3 border rounded-xl outline-none bg-white text-sm">
                        <option value="Quebra fábrica">Quebra fábrica</option>
                        <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                        <option value="Quebra produto embalagem (Externa)">Quebra produto embalagem (Externa)</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <textarea name="observacao" placeholder="Informações iniciais..." rows="2" class="col-span-full p-3 border rounded-xl outline-none focus:border-primary text-sm"></textarea>
                <div class="col-span-full flex gap-3 pt-4">
                    <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold uppercase text-[10px]">Cancelar</button>
                    <button type="submit" id="btnSalvar" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold uppercase text-[10px] shadow-lg">Salvar Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyMh4zjTsm5TJ1M4HWRyh8fX5_EOeR942DmUim8ZPPHFO3EkRdLga6Yxf3KosmS19tV/exec';
        let dadosGlobais = [];
        let ticketAbertoAtual = null;

        function abrirModal() { document.getElementById('modalChamado').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalChamado').classList.add('hidden'); }
        function fecharModalDetalhes() { document.getElementById('modalDetalhes').classList.add('hidden'); }

        function formatarDataBR(dataStr) {
            if (!dataStr || dataStr === "" || dataStr === "---") return "---";
            try { 
                const data = new Date(dataStr); 
                return isNaN(data.getTime()) ? dataStr : data.toLocaleDateString('pt-BR'); 
            } catch (e) { return dataStr; }
        }

        async function carregarTickets() {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = `<tr><td colspan="7" class="p-10 text-center text-gray-400 italic font-bold">Acessando banco de dados...</td></tr>`;
            try {
                const r = await fetch(WEB_APP_URL);
                dadosGlobais = await r.json();
                renderizarTabela(dadosGlobais);
                atualizarCardsGerais(dadosGlobais);
            } catch (e) { 
                tbody.innerHTML = `<tr><td colspan="7" class="p-10 text-center text-red-500 font-bold">Falha ao carregar dados.</td></tr>`; 
            }
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = '';
            const hoje = new Date().setHours(0,0,0,0);

            dados.forEach((linha, index) => {
                // Mapeamento: 0:ID, 2:Forn, 7:Motivo, 9:Status, 10:Abertura, 12:Prevista, 14:Responsável (Col O)
                const [id, seac, forn, ref, cli, qtd, lote, motivo, obs, status, abertura, resolucao, prevista, criado, responsavel] = linha;
                const rowId = index + 2;

                let dPrevRaw = prevista;
                const isAtrasado = status !== 'Resolvido' && prevista && new Date(prevista).getTime() < hoje;
                const statusColor = status === 'Resolvido' ? 'bg-emerald-100 text-emerald-700' : isAtrasado ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 font-black text-primary"><button onclick="verDetalhes(${index})" class="hover:underline">${id}</button></td>
                        <td class="p-4"><span class="px-2 py-1 rounded-md text-[9px] font-black uppercase ${statusColor}">${isAtrasado ? 'Atrasado' : status}</span></td>
                        <td class="p-4"><div class="font-bold">${seac}</div><div class="text-[9px] text-gray-400 font-black uppercase">${forn}</div></td>
                        <td class="p-4 text-xs font-bold text-gray-600">${responsavel || "---"}</td>
                        <td class="p-4 text-center text-xs text-gray-500 font-bold">${formatarDataBR(abertura)}</td>
                        <td class="p-4 text-center text-xs text-gray-500 font-bold">${formatarDataBR(prevista)}</td>
                        <td class="p-4 text-center">
                            <button onclick="verDetalhes(${index})" class="text-gray-400 hover:text-primary"><span class="material-symbols-outlined">visibility</span></button>
                        </td>
                    </tr>`;
            });
        }

        function verDetalhes(index) {
            const t = dadosGlobais[index];
            ticketAbertoAtual = { index: index, row: index + 2 };
            
            document.getElementById('detalheID').innerText = t[0];
            document.getElementById('detalheSeac').innerText = t[1];
            document.getElementById('detalheForn').innerText = t[2];
            document.getElementById('detalheCriadoPor').innerText = t[13] || "Não registrado";
            document.getElementById('detalheObs').value = t[8] || "";
            document.getElementById('selectResponsavel').value = t[14] || "";
            
            const badge = document.getElementById('detalheStatusBadge');
            badge.innerText = t[9];
            badge.className = `text-[10px] font-black uppercase tracking-widest ${t[9] === 'Resolvido' ? 'text-emerald-500' : 'text-blue-500'}`;
            
            document.getElementById('modalDetalhes').classList.remove('hidden');
        }

        async function atualizarResponsavelTicket(nome) {
            if (!ticketAbertoAtual) return;
            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: 'update_field', row: ticketAbertoAtual.row, field: 'responsavel', value: nome }) 
                });
                dadosGlobais[ticketAbertoAtual.index][14] = nome; // Atualiza cache local
            } catch (e) { alert("Erro ao salvar responsável"); }
        }

        async function salvarObservacao() {
            const btn = document.getElementById('btnSalvarObs');
            const novaObs = document.getElementById('detalheObs').value;
            btn.disabled = true; btn.innerText = "Salvando...";
            try { 
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update_field', row: ticketAbertoAtual.row, field: 'observacao', value: novaObs }) }); 
                dadosGlobais[ticketAbertoAtual.index][8] = novaObs;
                alert("Tratativa atualizada!");
                fecharModalDetalhes();
                carregarTickets();
            } catch (e) { alert("Erro ao salvar."); } 
            finally { btn.disabled = false; btn.innerText = "Salvar Tratativa"; }
        }

        document.getElementById('formTicket').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar'); btn.disabled = true;
            
            const payload = Object.fromEntries(new FormData(e.target));
            payload.action = 'insert';
            // Pega o nome do usuário que logou
            payload.criado_por = localStorage.getItem('usuarioLogado') || "Usuário Sistema";

            try { 
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); 
                fecharModal();
                alert("Ticket criado com sucesso!");
                setTimeout(carregarTickets, 1500);
            } catch (e) { alert("Erro ao criar ticket."); } 
            finally { btn.disabled = false; }
        });

        function atualizarCardsGerais(dados) {
            let and = 0, atr = 0, con = 0;
            const hoje = new Date().setHours(0,0,0,0);
            dados.forEach(d => {
                if(d[9] === 'Resolvido') con++;
                else if(d[12] && new Date(d[12]).getTime() < hoje) atr++;
                else and++;
            });
            document.getElementById('cardAndamento').innerText = and;
            document.getElementById('cardAtraso').innerText = atr;
            document.getElementById('cardResolvido').innerText = con;
        }

        window.onload = carregarTickets;
    </script>
</body>
</html>
