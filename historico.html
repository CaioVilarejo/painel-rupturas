<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Histórico - Vilarejo Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#E30613", "sheets-green": "#1ea362", "background-dark": "#121212", "blue-custom": "#3B82F6", "gray-custom": "#6B7280" } } }
        }
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r border-gray-200 p-6 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="flex items-center gap-3 mb-10 pb-4 border-b border-gray-100">
                    <img src="https://i.ibb.co/tPcWfmjT/VI-logo-novo-sem-fundo.png" alt="Logo Vilarejo" class="h-8 w-auto object-contain"/>
                    <span class="text-xl font-bold">Monitor</span>
                </div>
                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg font-medium">
                        <span class="material-symbols-outlined">analytics</span> Rupturas
                    </a>
                    <a href="historico.html" class="flex items-center gap-3 p-3 bg-primary text-white rounded-lg font-medium shadow-md">
                        <span class="material-symbols-outlined">timeline</span> Histórico
                    </a>
                </nav>
            </div>
            <button onclick="window.location.href='index.html'" class="flex items-center gap-3 p-3 text-gray-500 hover:text-red-600 transition-colors border-t pt-4">
                <span class="material-symbols-outlined">logout</span> Sair
            </button>
        </aside>

        <main class="flex-1 overflow-y-auto p-6 lg:p-10">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b pb-6">
                <div>
                    <h1 class="text-3xl font-black">Histórico de Rupturas</h1>
                    <div class="flex items-center gap-2 text-gray-500 text-sm mt-1">
                        <span class="relative flex h-2 w-2">
                            <span class="relative rounded-full h-2 w-2 bg-blue-500"></span>
                        </span>
                        <span id="lastUpdate">Aguardando dados...</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="carregarDados()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg font-bold text-sm text-gray-700 hover:bg-gray-50">
                        <span class="material-symbols-outlined text-sm">refresh</span> Recarregar Histórico
                    </button>
                </div>
            </header>
            
            <div class="mb-8 flex items-center gap-4">
                <label class="font-bold text-gray-700">Visualizar Categoria:</label>
                <select id="hbtSelector" onchange="mudarGrafico()" class="border-gray-300 rounded-lg text-lg px-4 py-2 font-bold">
                    <option value="H">Item H</option>
                    <option value="B">Item B</option>
                    <option value="TH">Item TH</option>
                </select>
            </div>

            <div class="bg-white rounded-xl border shadow-lg p-6 mb-10">
                <h3 class="font-black text-2xl mb-4 text-gray-800" id="chartTitle">Tendência Mensal - Item H</h3>
                <div class="relative h-96 w-full">
                    <canvas id="historicoChart"></canvas>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFrtHpxDu4l00gW7WtoY_WnPHtBukuZwecJAI9UKo6ajc5BWKUT07vfqK5MDXHpWsWQ4T8UygDWcwG/pub?gid=291718870&single=true&output=csv';
        let historicoChart;
        let dadosHistorico = {}; 

        const itemColors = {
            'H': { atual: 'rgba(227, 6, 19, 1)', futuro: 'rgba(227, 6, 19, 0.4)' },
            'B': { atual: 'rgba(59, 130, 246, 1)', futuro: 'rgba(59, 130, 246, 0.4)' },
            'TH': { atual: 'rgba(107, 114, 128, 1)', futuro: 'rgba(107, 114, 128, 0.4)' }
        };

        async function carregarDados() {
            document.getElementById('lastUpdate').innerText = "Processando banco de dados...";
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    processarHistorico(results.data);
                },
                error: function(error) {
                    console.error("Erro ao carregar histórico:", error);
                    document.getElementById('lastUpdate').innerText = "Erro ao carregar dados do histórico. Verifique o GID no CSV_URL.";
                }
            });
        }

        function processarHistorico(dados) {
            
            const labels = [];
            const dataH = { atual: [], futuro: [] };
            const dataB = { atual: [], futuro: [] };
            const dataTH = { atual: [], futuro: [] };
            
            const cols = {
                'H': { atual: 'Romp.Atual (H)', futuro: 'Romp.Futuro (H)' },
                'B': { atual: 'Romp.Atual (B)', futuro: 'Romp.Futuro (B)' },
                'TH': { atual: 'Romp.Atual (TH)', futuro: 'Romp.Futuro (TH)' }
            };


            dados.forEach(item => {
                if (item['Data']) {
                    labels.push(item['Data']);
                    
                    dataH.atual.push(parseInt(item[cols.H.atual]) || 0);
                    dataH.futuro.push(parseInt(item[cols.H.futuro]) || 0);
                    
                    dataB.atual.push(parseInt(item[cols.B.atual]) || 0);
                    dataB.futuro.push(parseInt(item[cols.B.futuro]) || 0);
                    
                    dataTH.atual.push(parseInt(item[cols.TH.atual]) || 0);
                    dataTH.futuro.push(parseInt(item[cols.TH.futuro]) || 0);
                }
            });
            
            dadosHistorico = {
                labels: labels,
                H: dataH,
                B: dataB,
                TH: dataTH,
            };

            mudarGrafico();
            document.getElementById('lastUpdate').innerText = `Última atualização: ${new Date().toLocaleTimeString()}`;
        }
        
        function mudarGrafico() {
            const selector = document.getElementById('hbtSelector');
            const hbt = selector.value;
            const data = dadosHistorico[hbt];

            if (!data || !dadosHistorico.labels || dadosHistorico.labels.length === 0) {
                if (historicoChart) historicoChart.destroy();
                document.getElementById('chartTitle').innerText = `Tendência Mensal - Item ${hbt} (Sem Dados)`;
                return;
            }

            document.getElementById('chartTitle').innerText = `Tendência Mensal - Item ${hbt}`;

            const chartData = {
                labels: dadosHistorico.labels,
                datasets: [
                    {
                        label: `Ruptura ATUAL (${hbt})`,
                        data: data.atual,
                        borderColor: itemColors[hbt].atual,
                        backgroundColor: itemColors[hbt].atual,
                        tension: 0.3,
                        borderWidth: 3,
                        pointRadius: 5,
                        fill: false
                    },
                    {
                        label: `Ruptura FUTURA (${hbt}) - CRÍTICO`,
                        data: data.futuro,
                        borderColor: itemColors[hbt].futuro,
                        backgroundColor: itemColors[hbt].futuro,
                        tension: 0.3,
                        borderWidth: 3,
                        borderDash: [8, 4], 
                        pointRadius: 5,
                        fill: false
                    }
                ]
            };

            const chartConfig = {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Quantidade de Itens Rompidos' }
                        },
                        x: {
                            title: { display: true, text: 'Mês' }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    }
                }
            };

            if (historicoChart) {
                historicoChart.destroy();
            }
            historicoChart = new Chart(document.getElementById('historicoChart'), chartConfig);
        }

        carregarDados();
    </script>
</body>
</html>
