<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pendências CD - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .timeline-bar { height: 8px; background: #e2e8f0; border-radius: 20px; position: relative; }
        .timeline-fill { height: 100%; background: linear-gradient(90deg, #E30613 0%, #ff4d4d 100%); border-radius: 20px; transition: width 0.8s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto">
                
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-xl font-black uppercase tracking-tighter text-gray-800 tracking-widest">Controle de Ocorrências</h1>
                    <button onclick="abrirDashboard()" class="bg-gray-800 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center gap-2 hover:bg-black transition-all shadow-lg">
                        <span class="material-symbols-outlined text-sm">analytics</span> Dashboard
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Andamento</p>
                        <h3 id="cardAndamento" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Atraso</p>
                        <h3 id="cardAtraso" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Concluídos</p>
                        <h3 id="cardResolvido" class="text-3xl font-black">0</h3>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Buscar ID</label>
                            <input type="text" id="inputBuscaID" onkeyup="filtrarGeral()" placeholder="TKT-..." class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Status</label>
                            <select id="selectStatus" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos os Status</option>
                                <option value="Em andamento">Em Andamento</option>
                                <option value="Atrasado">Atrasado</option>
                                <option value="Resolvido">Resolvido</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="abrirModal()" class="w-full bg-primary text-white px-4 py-2.5 rounded-xl font-bold uppercase text-[10px] shadow-lg hover:bg-red-700 transition-all flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined text-sm">add_circle</span> Novo Ticket
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-[10px] font-black text-gray-400 uppercase">
                                    <th class="p-4">ID Ticket</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Produto / Fornecedor</th>
                                    <th class="p-4 text-center">Abertura</th>
                                    <th class="p-4 text-center">Responsável</th>
                                    <th class="p-4 text-center">Previsão</th>
                                    <th class="p-4 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaChamados" class="divide-y divide-gray-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalDashboard" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden flex items-center justify-center z-[10000] p-4">
        <div class="bg-gray-50 w-full max-w-5xl h-full max-h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-6 bg-white border-b flex justify-between items-center">
                <h2 class="text-xl font-black text-gray-800 uppercase flex items-center gap-2">
                    <span class="material-symbols-outlined text-red-600">leaderboard</span> Dashboard de Ocorrências
                </h2>
                <button onclick="fecharDashboard()" class="text-gray-400 hover:text-black transition-all"><span class="material-symbols-outlined text-3xl">close</span></button>
            </div>
            
            <div class="p-6 bg-white border-b flex flex-wrap gap-4 items-end justify-center">
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase ml-1">Data Início</label>
                    <input type="date" id="dashDataInicio" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                </div>
                <div>
                    <label class="text-[9px] font-black text-gray-400 uppercase ml-1">Data Fim</label>
                    <input type="date" id="dashDataFim" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                </div>
                <button onclick="processarDadosDash()" class="bg-gray-800 text-white px-6 py-2 rounded-xl font-bold uppercase text-[10px] hover:bg-black transition-all">Filtrar Período</button>
            </div>

            <div class="p-8 overflow-y-auto modal-scroll">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 min-h-[350px]">
                        <h3 class="text-[11px] font-black text-gray-400 uppercase mb-6 tracking-widest text-center">Motivos das Ocorrências</h3>
                        <div class="relative h-64"><canvas id="graficoMotivos"></canvas></div>
                    </div>
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
                        <h3 class="text-[11px] font-black text-gray-400 uppercase mb-6 tracking-widest">Resumo Quantitativo</h3>
                        <div id="listaLegendaDash" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modalChamado" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="text-xl font-black text-primary uppercase">Registrar Pendência</h2>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button>
            </div>
            <form id="formTicket" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="cod_seac" placeholder="Cód Produto Seac" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <input type="text" name="fornecedor" placeholder="Fornecedor" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <input type="text" name="referencia" placeholder="Referência" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <input type="number" name="quantidade" placeholder="Quantidade" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <div class="col-span-full">
                    <select name="motivo" onchange="toggleOutros(this.value)" class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold">
                        <option value="Quebra fábrica">Quebra fábrica</option>
                        <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                        <option value="Quebra de produto na embalagem(Externa)">Quebra produto embalagem (Externa)</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div id="divOutros" class="col-span-full hidden">
                    <input type="text" id="inputOutros" placeholder="Especifique o motivo..." class="w-full p-3 border border-primary rounded-xl outline-none text-sm font-bold">
                </div>
                <textarea name="observacao" placeholder="Informações iniciais..." rows="2" class="col-span-full p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold"></textarea>
                <div class="col-span-full flex gap-3 pt-4">
                    <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold uppercase text-[10px]">Cancelar</button>
                    <button type="submit" id="btnSalvar" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold uppercase text-[10px] shadow-lg">Salvar Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbznCForFxpY6CAU6W3UgglusC8oqyfDz0dqM-l_95xtr9CK9TcFvbw_V7LJQk8jTZH-/exec';
        const USUARIO_LOGADO = localStorage.getItem('vilarejo_user') || 'Visitante';
        const LISTA_RESPONSAVEIS = ["Eduardo", "Edson", "Fábio", "Leandro", "Herialdo", "Bruna", "Renielle", "Caio"];
        let dadosGlobais = [];
        let meuGrafico = null;

        function abrirModal() { document.getElementById('modalChamado').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalChamado').classList.add('hidden'); }
        
        // Funções do Dashboard
        function abrirDashboard() { 
            document.getElementById('modalDashboard').classList.remove('hidden');
            processarDadosDash();
        }
        function fecharDashboard() { document.getElementById('modalDashboard').classList.add('hidden'); }

        // Helper para converter "dd/mm/yyyy" em objeto Date
        function converterParaData(str) {
            if(!str || !str.includes('/')) return null;
            const partes = str.split('/');
            return new Date(partes[2], partes[1] - 1, partes[0]);
        }

        function processarDadosDash() {
            const dataInicio = document.getElementById('dashDataInicio').value;
            const dataFim = document.getElementById('dashDataFim').value;

            let dIni = dataInicio ? new Date(dataInicio) : null;
            let dFim = dataFim ? new Date(dataFim) : null;
            
            // Ajustar horas para comparação correta
            if(dIni) dIni.setHours(0,0,0,0);
            if(dFim) dFim.setHours(23,59,59,999);

            const contagem = { "Quebra fábrica": 0, "Quebra depósito/Loja": 0, "Quebra produto embalagem (Externa)": 0, "Outros": 0 };

            dadosGlobais.forEach(d => {
                const dataAberturaStr = d[10]; // Coluna K (Abertura)
                const dataAbertura = converterParaData(dataAberturaStr);

                let dentroDoRange = true;
                if(dIni && (!dataAbertura || dataAbertura < dIni)) dentroDoRange = false;
                if(dFim && (!dataAbertura || dataAbertura > dFim)) dentroDoRange = false;

                if(dentroDoRange) {
                    const mot = d[7] || "Outros";
                    if (contagem[mot] !== undefined) contagem[mot]++; else contagem["Outros"]++;
                }
            });
            renderizarGraficoDash(contagem);
        }

        function renderizarGraficoDash(contagem) {
            const ctx = document.getElementById('graficoMotivos').getContext('2d');
            if (meuGrafico) meuGrafico.destroy();
            meuGrafico = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(contagem),
                    datasets: [{ data: Object.values(contagem), backgroundColor: ['#E30613', '#3b82f6', '#fbbf24', '#94a3b8'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%' }
            });
            
            const lista = document.getElementById('listaLegendaDash');
            lista.innerHTML = '';
            for (const [mot, val] of Object.entries(contagem)) {
                lista.innerHTML += `<div class="flex justify-between items-center text-xs border-b pb-2 uppercase font-black text-gray-500"><span>${mot}</span><span class="text-gray-900">${val}</span></div>`;
            }
        }

        // Carregamento de Dados e Tabela (Baseado no seu original)
        async function carregarTickets() {
            try {
                const r = await fetch(`${WEB_APP_URL}?rota=pendencias`);
                dadosGlobais = await r.json();
                filtrarGeral();
            } catch (e) { console.error("Erro ao carregar tickets"); }
        }

        function formatarDataBR(dataStr) {
            if (!dataStr || dataStr === "" || dataStr === "---") return "---";
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dataStr)) return dataStr;
            try { 
                const data = new Date(dataStr);
                return isNaN(data.getTime()) ? dataStr : `${String(data.getUTCDate()).padStart(2, '0')}/${String(data.getUTCMonth() + 1).padStart(2, '0')}/${data.getUTCFullYear()}`; 
            } catch (e) { return dataStr; }
        }

        function filtrarGeral() {
            const buscaID = document.getElementById('inputBuscaID').value.toLowerCase();
            const statusFiltro = document.getElementById('selectStatus').value;
            const hoje = new Date().setHours(0,0,0,0);
            
            const dadosFiltrados = dadosGlobais.filter(linha => {
                const [id, , , , , , , , , status, , , prevista] = linha;
                let dPrevRaw = prevista;
                if(prevista && prevista.includes('/')) { const p = prevista.split('/'); dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`; }
                const isAtrasado = status !== 'Resolvido' && dPrevRaw && new Date(dPrevRaw).getTime() < hoje;
                const statusReal = isAtrasado ? "Atrasado" : status;
                
                return id.toLowerCase().includes(buscaID) && (statusFiltro === "todos" || statusReal === statusFiltro);
            });
            renderizarTabela(dadosFiltrados);
            atualizarCardsGerais(dadosGlobais);
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = '';
            const hoje = new Date().setHours(0,0,0,0);
            dados.forEach((linha) => {
                const indexOriginal = dadosGlobais.findIndex(dg => dg[0] === linha[0]);
                const [id, seac, forn, ref, , , , , , status, abertura, , prevista, , responsavel] = linha;
                const rowId = indexOriginal + 2;
                let dPrevRaw = prevista;
                if(prevista && prevista.includes('/')) { const p = prevista.split('/'); dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`; }
                const isAtrasado = status !== 'Resolvido' && dPrevRaw && new Date(dPrevRaw).getTime() < hoje;
                const statusColor = status === 'Resolvido' ? 'bg-emerald-100 text-emerald-700' : isAtrasado ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700';

                tbody.innerHTML += `<tr>
                    <td class="p-4 font-black text-primary">${id}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded-md text-[9px] font-black uppercase ${statusColor}">${isAtrasado ? 'Atrasado' : status}</span></td>
                    <td class="p-4"><div class="font-bold">${seac}</div><div class="text-[9px] text-gray-400 uppercase font-black">${forn}</div></td>
                    <td class="p-4 text-center text-xs font-bold text-gray-500">${formatarDataBR(abertura)}</td>
                    <td class="p-4 text-center font-bold">${responsavel || "---"}</td>
                    <td class="p-4 text-center text-xs font-bold">${formatarDataBR(prevista)}</td>
                    <td class="p-4 text-center">---</td>
                </tr>`;
            });
        }

        function atualizarCardsGerais(dados) {
            let and = 0, atr = 0, con = 0; const hoje = new Date().setHours(0,0,0,0);
            dados.forEach(d => {
                const status = d[9]; let dPrevRaw = d[12];
                if(dPrevRaw && dPrevRaw.includes('/')) { const p = dPrevRaw.split('/'); dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`; }
                const isAtrasado = status !== 'Resolvido' && dPrevRaw && new Date(dPrevRaw).getTime() < hoje;
                if(status === 'Resolvido') con++; else if(isAtrasado) atr++; else and++;
            });
            document.getElementById('cardAndamento').innerText = and;
            document.getElementById('cardAtraso').innerText = atr;
            document.getElementById('cardResolvido').innerText = con;
        }

        window.onload = carregarTickets;
    </script>
</body>
</html>
