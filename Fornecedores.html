<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Fornecedores 2024 x 2025 - Vilarejo Monitor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613", "secondary": "#121212" } } }
        }
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-gray-50 antialiased">

    <div class="flex h-screen overflow-hidden">
        <main class="flex-1 overflow-y-auto p-6 lg:p-10">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10 border-b pb-8">
                <div>
                    <h1 class="text-3xl font-black text-gray-900 tracking-tight text-primary">Vilarejo Monitor</h1>
                    <p class="text-gray-500 font-bold uppercase text-[10px] tracking-widest">Análise de Fornecedores 2024 vs 2025</p>
                    <p id="lastUpdate" class="text-xs text-gray-400 mt-1">Sincronizando...</p>
                </div>

                <div class="flex flex-wrap gap-3">
                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold text-gray-400 uppercase mb-1">Grupo</label>
                        <select id="filtroGrupo" onchange="processarDashboard()" class="bg-white border rounded-xl text-sm font-bold px-4 py-2 shadow-sm outline-none">
                            <option value="todos">Todos os Grupos</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="carregarDados()" class="flex items-center gap-2 px-5 py-2 bg-secondary text-white rounded-xl font-bold text-sm hover:bg-black transition-all">
                            <span class="material-symbols-outlined text-sm">refresh</span>
                        </button>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl border card-shadow">
                    <p class="text-[10px] font-black text-gray-400 uppercase mb-1">Venda Total 2025</p>
                    <h3 id="resumoVenda" class="text-2xl font-black text-gray-900">R$ 0,00</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl border card-shadow">
                    <p class="text-[10px] font-black text-gray-400 uppercase mb-1">Crescimento</p>
                    <h3 id="resumoCrescimento" class="text-2xl font-black">0%</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl border card-shadow">
                    <p class="text-[10px] font-black text-gray-400 uppercase mb-1">Custo Total 2025</p>
                    <h3 id="resumoCusto" class="text-2xl font-black text-gray-900">R$ 0,00</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl border card-shadow border-l-4 border-primary">
                    <p class="text-[10px] font-black text-gray-400 uppercase mb-1">Margem Média 2025</p>
                    <h3 id="resumoMargem" class="text-2xl font-black text-primary">0%</h3>
                </div>
            </div>

            <div class="bg-white rounded-3xl border card-shadow p-8 mb-10">
                <h3 class="font-black text-sm text-gray-800 uppercase tracking-widest mb-8">Comparativo de Vendas (Top 10 Fornecedores)</h3>
                <div class="relative h-[350px] w-full">
                    <canvas id="chartComparativo"></canvas>
                </div>
            </div>

            <div class="bg-white rounded-3xl border card-shadow overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm" id="tabelaFornecedores">
                        <thead>
                            <tr class="text-[10px] font-black text-gray-400 uppercase border-b bg-gray-50">
                                <th class="px-8 py-5">Fornecedor</th>
                                <th class="px-6 py-5 text-right">Venda 2024</th>
                                <th class="px-6 py-5 text-right">Venda 2025</th>
                                <th class="px-6 py-5 text-center">Var. Venda</th>
                                <th class="px-6 py-5 text-center">Margem 2025</th>
                                <th class="px-6 py-5 text-right">Estoque</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 font-medium text-gray-700 text-xs"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFrtHpxDu4l00gW7WtoY_WnPHtBukuZwecJAI9UKo6ajc5BWKUT07vfqK5MDXHpWsWQ4T8UygDWcwG/pub?gid=1981344719&output=csv';
        
        let dadosTratados = [];
        let meuGrafico = null;

        function formatarMoedaParaNumero(valor) {
            if (!valor || valor === "" || valor === "-") return 0;
            let limpo = valor.toString().replace(/\./g, '').replace(',', '.').replace(/[R$\s%]/g, '').trim();
            return parseFloat(limpo) || 0;
        }

        function formatarBRL(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        async function carregarDados() {
            document.getElementById('lastUpdate').innerText = "Sincronizando...";
            
            Papa.parse(CSV_URL, {
                download: true,
                header: false, // IMPORTANTE: Lemos como array simples
                skipEmptyLines: true,
                complete: function(results) {
                    // Ignora a primeira linha (cabeçalho) e mapeia por índice
                    const linhasBrutas = results.data.slice(1);
                    
                    dadosTratados = linhasBrutas.map(col => ({
                        fornecedor: col[0],    // Coluna A
                        grupo: col[1],          // Coluna B
                        custo24: col[2],        // Coluna C
                        custo25: col[3],        // Coluna D
                        varCusto: col[4],       // Coluna E
                        venda24: col[5],        // Coluna F
                        venda25: col[6],        // Coluna G
                        varVenda: col[7],       // Coluna H
                        margem24: col[8],       // Coluna I
                        margem25: col[9],       // Coluna J
                        estoque: col[10]        // Coluna K
                    }));

                    popularFiltroGrupo();
                    processarDashboard();
                    document.getElementById('lastUpdate').innerText = `Atualizado: ${new Date().toLocaleTimeString()}`;
                }
            });
        }

        function popularFiltroGrupo() {
            const select = document.getElementById('filtroGrupo');
            const grupos = [...new Set(dadosTratados.map(d => d.grupo))].filter(g => g).sort();
            select.innerHTML = '<option value="todos">Todos os Grupos</option>';
            grupos.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g; opt.textContent = g;
                select.appendChild(opt);
            });
        }

        function processarDashboard() {
            const filtro = document.getElementById('filtroGrupo').value;
            const filtrados = filtro === 'todos' ? dadosTratados : dadosTratados.filter(d => d.grupo === filtro);

            // Cálculos para Cards
            const totVenda25 = filtrados.reduce((a, b) => a + formatarMoedaParaNumero(b.venda25), 0);
            const totVenda24 = filtrados.reduce((a, b) => a + formatarMoedaParaNumero(b.venda24), 0);
            const totCusto25 = filtrados.reduce((a, b) => a + formatarMoedaParaNumero(b.custo25), 0);
            const margens = filtrados.map(d => formatarMoedaParaNumero(d.margem25)).filter(m => m > 0);
            const mediaMargem = margens.length > 0 ? (margens.reduce((a,b) => a+b, 0) / margens.length) : 0;
            const cresc = totVenda24 > 0 ? ((totVenda25 - totVenda24) / totVenda24) * 100 : 0;

            document.getElementById('resumoVenda').innerText = formatarBRL(totVenda25);
            document.getElementById('resumoCusto').innerText = formatarBRL(totCusto25);
            document.getElementById('resumoMargem').innerText = mediaMargem.toFixed(2) + '%';
            
            const crescEl = document.getElementById('resumoCrescimento');
            crescEl.innerText = (cresc > 0 ? '+' : '') + cresc.toFixed(2) + '%';
            crescEl.className = `text-2xl font-black ${cresc >= 0 ? 'text-green-600' : 'text-primary'}`;

            renderizarGrafico(filtrados);
            renderizarTabela(filtrados);
        }

        function renderizarGrafico(dados) {
            const ctx = document.getElementById('chartComparativo').getContext('2d');
            if (meuGrafico) meuGrafico.destroy();

            const top = [...dados]
                .sort((a, b) => formatarMoedaParaNumero(b.venda25) - formatarMoedaParaNumero(a.venda25))
                .slice(0, 10);

            meuGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: top.map(d => d.fornecedor),
                    datasets: [
                        { label: '2024', data: top.map(d => formatarMoedaParaNumero(d.venda24)), backgroundColor: '#E3061340', borderColor: '#E30613', borderWidth: 1, borderRadius: 5 },
                        { label: '2025', data: top.map(d => formatarMoedaParaNumero(d.venda25)), backgroundColor: '#121212', borderRadius: 5 }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top', align: 'end' } },
                    scales: { y: { beginAtZero: true, ticks: { font: { size: 9 } } }, x: { ticks: { font: { size: 9 } } } }
                }
            });
        }

        function renderizarTabela(dados) {
            const tbody = document.querySelector('#tabelaFornecedores tbody');
            tbody.innerHTML = dados.map(d => {
                const vVenda = formatarMoedaParaNumero(d.varVenda);
                return `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-8 py-4 font-bold text-gray-900">${d.fornecedor}</td>
                        <td class="px-6 py-4 text-right text-gray-500">${formatarBRL(formatarMoedaParaNumero(d.venda24))}</td>
                        <td class="px-6 py-4 text-right font-bold text-gray-900">${formatarBRL(formatarMoedaParaNumero(d.venda25))}</td>
                        <td class="px-6 py-4 text-center">
                            <span class="px-2 py-1 rounded-md text-[10px] font-black ${vVenda >= 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                ${vVenda > 0 ? '+' : ''}${vVenda.toFixed(2)}%
                            </span>
                        </td>
                        <td class="px-6 py-4 text-center font-bold text-primary">${d.margem25}%</td>
                        <td class="px-6 py-4 text-right bg-gray-50/50 font-bold">${d.estoque}</td>
                    </tr>
                `;
            }).join('');
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
