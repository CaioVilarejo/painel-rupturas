<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pendências CD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbznCForFxpY6CAU6W3UgglusC8oqyfDz0dqM-l_95xtr9CK9TcFvbw_V7LJQk8jTZH-/exec';
const USUARIO_LOGADO = localStorage.getItem('vilarejo_user') || 'Desconhecido';
let ticketAbertoAtual = null;
</script>

<h1 class="text-2xl font-bold mb-4">Pendências CD</h1>

<button onclick="document.getElementById('modalNovo').classList.remove('hidden')"
        class="bg-red-600 text-white px-4 py-2 rounded">
    Novo Ticket
</button>

<!-- MODAL NOVO TICKET -->
<div id="modalNovo" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    <form id="formTicket" class="bg-white p-6 rounded-xl w-[500px] space-y-3">

        <input name="cod_seac" placeholder="Código SEAC" class="w-full border p-2 rounded" required>
        <input name="fornecedor" placeholder="Fornecedor" class="w-full border p-2 rounded" required>
        <input name="referencia" placeholder="Referência" class="w-full border p-2 rounded" required>
        <input name="cod_cliente" placeholder="Código Cliente" class="w-full border p-2 rounded" required>
        <input name="quantidade" placeholder="Quantidade" type="number" class="w-full border p-2 rounded" required>

        <!-- PREVISÃO (COLUNA M) -->
        <input name="previsao" type="date" class="w-full border p-2 rounded" required>

        <!-- RESPONSÁVEL (COLUNA O) -->
        <select name="responsavel" class="w-full border p-2 rounded" required>
            <option value="">Responsável</option>
            <option>Eduardo</option>
            <option>Fábio</option>
            <option>Edson</option>
            <option>Leandro</option>
            <option>Herialdo</option>
            <option>Bruna</option>
            <option>Renielle</option>
            <option>Caio</option>
        </select>

        <textarea name="observacao" placeholder="Observação"
                  class="w-full border p-2 rounded"></textarea>

        <div class="flex justify-end gap-2 pt-2">
            <button type="button"
                    onclick="document.getElementById('modalNovo').classList.add('hidden')"
                    class="px-4 py-2 border rounded">
                Cancelar
            </button>
            <button type="submit"
                    class="px-4 py-2 bg-red-600 text-white rounded">
                Salvar
            </button>
        </div>
    </form>
</div>

<!-- MODAL DETALHES -->
<div id="modalDetalhes" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-xl w-[500px] space-y-3">
        <h2 class="font-bold text-lg">Detalhes do Ticket</h2>

        <textarea id="detalheObs" class="w-full border p-2 rounded"></textarea>

        <select id="detalheResponsavel" class="w-full border p-2 rounded">
            <option>Eduardo</option>
            <option>Fábio</option>
            <option>Edson</option>
            <option>Leandro</option>
            <option>Herialdo</option>
            <option>Bruna</option>
            <option>Renielle</option>
            <option>Caio</option>
        </select>

        <div class="flex justify-end gap-2">
            <button onclick="document.getElementById('modalDetalhes').classList.add('hidden')"
                    class="border px-4 py-2 rounded">
                Fechar
            </button>
            <button onclick="salvarObservacao()"
                    class="bg-red-600 text-white px-4 py-2 rounded">
                Salvar
            </button>
        </div>
    </div>
</div>

<script>
// ABERTURA DE TICKET
document.getElementById('formTicket').addEventListener('submit', async e => {
    e.preventDefault();

    const form = e.target;
    const data = Object.fromEntries(new FormData(form));

    const payload = {
        action: 'insert',
        ...data,
        criado_por: USUARIO_LOGADO
    };

    await fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
    });

    alert('Ticket criado com sucesso!');
    form.reset();
    document.getElementById('modalNovo').classList.add('hidden');
});

// SALVAR OBSERVAÇÃO + RESPONSÁVEL
async function salvarObservacao() {
    await fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'update_responsavel_obs',
            row: ticketAbertoAtual.row,
            observacao: document.getElementById('detalheObs').value,
            responsavel: document.getElementById('detalheResponsavel').value
        })
    });

    alert('Atualizado com sucesso!');
    document.getElementById('modalDetalhes').classList.add('hidden');
}
</script>

</body>
</html>
