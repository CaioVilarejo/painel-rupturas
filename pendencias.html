<div id="modalDetalhes" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 modal-z">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <div>
                    <span id="detalheStatusBadge" class="px-2 py-1 rounded text-[9px] font-black uppercase"></span>
                    <h2 id="detalheID" class="text-3xl font-black text-gray-800 tracking-tighter"></h2>
                </div>
                <button onclick="fecharModalDetalhes()" class="text-gray-400 hover:text-gray-600">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="p-6 overflow-y-auto max-h-[80vh] no-scrollbar">
                <div class="mb-8 bg-gray-50 p-6 rounded-2xl border border-gray-100">
                    <p class="text-[10px] font-black text-gray-400 uppercase mb-6 text-center tracking-widest">Linha do Tempo de Resolução</p>
                    <div class="relative flex justify-between items-center">
                        <div class="absolute h-1 bg-gray-200 w-full top-1/2 -translate-y-1/2 z-0"></div>
                        <div id="timelineProgress" class="absolute h-1 bg-primary z-0 transition-all duration-500" style="width: 0%"></div>

                        <div class="relative z-10 flex flex-col items-center bg-gray-50 px-2">
                            <div class="w-4 h-4 rounded-full bg-primary border-4 border-white shadow-sm"></div>
                            <p class="text-[9px] font-black text-gray-800 mt-2 uppercase">Abertura</p>
                            <p id="timeAbertura" class="text-[10px] text-gray-500 font-bold"></p>
                        </div>

                        <div class="relative z-10 flex flex-col items-center bg-gray-50 px-2">
                            <div id="pointPrevisao" class="w-4 h-4 rounded-full bg-gray-300 border-4 border-white shadow-sm"></div>
                            <p class="text-[9px] font-black text-gray-800 mt-2 uppercase">Previsão</p>
                            <p id="timePrevisao" class="text-[10px] text-gray-500 font-bold"></p>
                        </div>

                        <div class="relative z-10 flex flex-col items-center bg-gray-50 px-2">
                            <div id="pointConclusao" class="w-4 h-4 rounded-full bg-gray-300 border-4 border-white shadow-sm"></div>
                            <p class="text-[9px] font-black text-gray-800 mt-2 uppercase">Conclusão</p>
                            <p id="timeConclusao" class="text-[10px] text-gray-500 font-bold"></p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-6 mb-8">
                    <div><p class="text-[9px] font-black text-gray-400 uppercase">Cód. Prod SEAC</p><p id="detalheSeac" class="font-bold text-gray-800"></p></div>
                    <div><p class="text-[9px] font-black text-gray-400 uppercase">Fornecedor</p><p id="detalheForn" class="font-bold text-gray-800"></p></div>
                    <div><p class="text-[9px] font-black text-gray-400 uppercase">Referência</p><p id="detalheRef" class="font-bold text-gray-800"></p></div>
                    <div><p class="text-[9px] font-black text-gray-400 uppercase">Cód. Cliente</p><p id="detalheCli" class="font-bold text-gray-800"></p></div>
                    <div><p class="text-[9px] font-black text-gray-400 uppercase">Quantidade</p><p id="detalheQtd" class="font-bold text-gray-800"></p></div>
                    <div><p class="text-[9px] font-black text-gray-400 uppercase">Lote/Tonalidade</p><p id="detalheLote" class="font-bold text-gray-800"></p></div>
                    <div class="col-span-2 md:col-span-3"><p class="text-[9px] font-black text-gray-400 uppercase">Motivo da Ocorrência</p><p id="detalheMotivo" class="font-bold text-gray-800 italic"></p></div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase flex items-center gap-2">
                        <span class="material-symbols-outlined text-sm">edit_note</span> Histórico de Tratativas / Observações
                    </label>
                    <textarea id="detalheObs" rows="4" class="w-full border border-gray-200 rounded-2xl p-4 text-sm focus:border-primary outline-none bg-white shadow-inner resize-none transition-all focus:ring-2 focus:ring-red-50" placeholder="Digite aqui o andamento..."></textarea>
                </div>
                
                <button id="btnSalvarObs" onclick="salvarObservacao()" class="w-full mt-4 bg-gray-900 text-white py-4 rounded-2xl font-black uppercase text-xs hover:bg-black transition-all shadow-lg">
                    Atualizar Informações do Ticket
                </button>
            </div>
        </div>
    </div>

<script>
    // ... (Funções carregarTickets e filtrarTabela permanecem as mesmas)

    function verDetalhes(index) {
        const t = dadosGlobais[index];
        ticketAbertoAtual = { index: index, row: index + 2 };

        // Preencher Campos de Texto
        document.getElementById('detalheID').innerText = t[0];
        document.getElementById('detalheSeac').innerText = t[1];
        document.getElementById('detalheForn').innerText = t[2];
        document.getElementById('detalheRef').innerText = t[3];
        document.getElementById('detalheCli').innerText = t[4] || "Não Informado";
        document.getElementById('detalheQtd').innerText = t[5];
        document.getElementById('detalheLote').innerText = t[6] || "---";
        document.getElementById('detalheMotivo').innerText = t[7];
        document.getElementById('detalheObs').value = t[8] || "";
        
        // Status Badge
        const badge = document.getElementById('detalheStatusBadge');
        badge.innerText = t[9];
        badge.className = t[9] === 'Resolvido' ? 'px-2 py-1 rounded text-[9px] font-black uppercase bg-emerald-100 text-emerald-700' : 'px-2 py-1 rounded text-[9px] font-black uppercase bg-blue-100 text-blue-700';

        // LÓGICA DA LINHA DO TEMPO (PROGRESSO)
        const aberto = formatarDataBR(t[10]);
        const previsto = formatarDataBR(t[12]);
        const concluido = formatarDataBR(t[11]);

        document.getElementById('timeAbertura').innerText = aberto;
        document.getElementById('timePrevisao').innerText = previsto;
        document.getElementById('timeConclusao').innerText = concluido !== "---" ? concluido : "Pendente";

        const progress = document.getElementById('timelineProgress');
        const pPrev = document.getElementById('pointPrevisao');
        const pConc = document.getElementById('pointConclusao');

        // Reset cores
        pPrev.classList.replace('bg-primary', 'bg-gray-300');
        pConc.classList.replace('bg-primary', 'bg-gray-300');

        if(t[9] === 'Resolvido') {
            progress.style.width = '100%';
            pPrev.classList.replace('bg-gray-300', 'bg-primary');
            pConc.classList.replace('bg-gray-300', 'bg-primary');
        } else if (previsto !== "---") {
            progress.style.width = '50%';
            pPrev.classList.replace('bg-gray-300', 'bg-primary');
        } else {
            progress.style.width = '0%';
        }

        document.getElementById('modalDetalhes').classList.remove('hidden');
    }

    // Função para salvar a observação atualizada
    async function salvarObservacao() {
        const btn = document.getElementById('btnSalvarObs');
        const novaObs = document.getElementById('detalheObs').value;
        btn.disabled = true; btn.innerText = "Sincronizando...";
        
        try {
            await fetch(WEB_APP_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({ 
                    action: 'update_field', 
                    row: ticketAbertoAtual.row, 
                    field: 'observacao', 
                    value: novaObs 
                })
            });
            // Atualiza os dados locais sem recarregar tudo
            dadosGlobais[ticketAbertoAtual.index][8] = novaObs;
            alert("Tratativa salva na planilha!");
            fecharModalDetalhes();
        } catch (e) {
            alert("Erro ao salvar. Tente novamente.");
        } finally {
            btn.disabled = false; btn.innerText = "Atualizar Informações do Ticket";
        }
    }
</script>
