<div class="w-full md:w-40">
    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Status</label>
    <select id="selectStatus" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
        <option value="todos">Todos</option>
        <option value="Em Análise">Em Análise</option>
        <option value="Em Análise (Atrasado)">Em Análise (Atrasado)</option>
        <option value="Em Andamento">Em Andamento</option>
        <option value="Atrasado">Atrasado</option>
        <option value="Resolvido">Resolvido</option>
    </select>
</div>

<div id="modalDetalhes" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[95vh]">
        <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-3xl">
            <div><h2 id="detalheID" class="text-3xl font-black text-gray-800 tracking-tighter"></h2><span id="detalheStatusBadge" class="text-[10px] font-black uppercase px-2 py-0.5 rounded"></span></div>
            <button onclick="fecharModalDetalhes()" class="text-gray-400 hover:text-primary"><span class="material-symbols-outlined text-3xl">close</span></button>
        </div>
        
        <div class="p-8 overflow-y-auto modal-scroll space-y-10">
            <div class="space-y-8 bg-gray-50 p-6 rounded-2xl border border-gray-100">
                <div class="flex justify-between px-2">
                    <div class="flex flex-col items-center gap-1 w-1/4">
                        <span class="material-symbols-outlined text-blue-600">call</span>
                        <p class="text-[9px] font-black uppercase">Abertura</p>
                    </div>
                    <div class="flex flex-col items-center gap-1 w-1/4">
                        <span class="material-symbols-outlined text-gray-500" id="iconAnalise">search</span>
                        <p class="text-[9px] font-black uppercase text-center">Definição Responsável</p>
                    </div>
                    <div class="flex flex-col items-center gap-1 w-1/4">
                        <span class="material-symbols-outlined text-gray-500" id="iconPrev">calendar_month</span>
                        <p class="text-[9px] font-black uppercase">Previsão</p>
                    </div>
                    <div class="flex flex-col items-center gap-1 w-1/4">
                        <span class="material-symbols-outlined text-gray-500" id="iconConc">check_circle</span>
                        <p class="text-[9px] font-black uppercase">Concluído</p>
                    </div>
                </div>
                
                <div class="px-4">
                    <div class="timeline-bar">
                        <div id="timelineFill" class="timeline-fill" style="width: 0%;"></div>
                        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-blue-600 border-2 border-white rounded-full shadow"></div>
                        <div id="nodeResp" class="absolute left-1/3 top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-gray-300 border-2 border-white rounded-full shadow"></div>
                        <div id="nodePrev" class="absolute left-2/3 top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-gray-300 border-2 border-white rounded-full shadow"></div>
                        <div id="nodeConc" class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-gray-200 border-2 border-white rounded-full shadow"></div>
                    </div>
                    <div class="flex justify-between mt-4 text-[9px] font-bold text-gray-500">
                        <p id="timeAbertura" class="w-1/4 text-center"></p>
                        <p id="timeResponsavel" class="w-1/4 text-center"></p> <p id="timePrevisaoModal" class="w-1/4 text-center"></p>
                        <p id="timeConclusao" class="w-1/4 text-center"></p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-6 text-sm border-t pt-6">
                </div>
            
            <div class="p-4 bg-white rounded-2xl border-2 border-gray-100">
                <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block tracking-widest">Responsável Atual</label>
                <select id="selectResponsavelModal" onchange="definirResponsavel(this.value)" class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold focus:border-primary">
                    <option value="">Selecione um responsável...</option>
                </select>
            </div>

            </div>
        <div class="p-6 bg-white border-t rounded-b-3xl">
            <button onclick="salvarObservacao()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-black transition-all shadow-lg">Salvar Alterações</button>
        </div>
    </div>
</div>

<script>
    // ... (Constantes e carregarTickets mantidos) ...

    function calcularStatusEData(abertura, responsavel, prevista, statusOriginal) {
        const hoje = new Date();
        const dataAbertura = new Date(abertura);
        const diffHoras = Math.abs(hoje - dataAbertura) / 36e5;
        
        let statusFinal = statusOriginal;

        if (statusOriginal !== 'Resolvido') {
            if (!responsavel || responsavel === "") {
                statusFinal = diffHoras > 24 ? "Em Análise (Atrasado)" : "Em Análise";
            } else {
                statusFinal = "Em Andamento";
                if (prevista) {
                    const dataPrev = new Date(prevista.includes('/') ? prevista.split('/').reverse().join('-') : prevista);
                    if (hoje.setHours(0,0,0,0) > dataPrev.getTime()) {
                        statusFinal = "Atrasado";
                    }
                }
            }
        }
        return statusFinal;
    }

    async function definirResponsavel(nome) {
        if(!ticketAbertoAtual || !nome) return;
        
        const agora = new Date().toLocaleString('pt-BR');
        // Atualiza Responsável (Coluna O - assumindo ordem atual)
        await atualizarCampo(ticketAbertoAtual.row, 'responsavel', nome);
        // Atualiza Data/Hora Responsável na Coluna P
        await atualizarCampo(ticketAbertoAtual.row, 'data_responsavel', agora);
        
        alert(`Responsável ${nome} definido em ${agora}`);
        carregarTickets();
    }

    function verDetalhes(index) {
        const t = dadosGlobais[index];
        ticketAbertoAtual = { index: index, row: index + 2 };
        
        const statusAtual = calcularStatusEData(t[10], t[14], t[12], t[9]);

        // Preenchimento de campos e ícones da linha do tempo
        document.getElementById('detalheID').innerText = t[0];
        document.getElementById('timeAbertura').innerText = formatarDataBR(t[10]);
        document.getElementById('timeResponsavel').innerText = t[15] || "---"; // Coluna P
        document.getElementById('timePrevisaoModal').innerText = formatarDataBR(t[12]);
        document.getElementById('timeConclusao').innerText = t[11] ? formatarDataBR(t[11]) : "Pendente";

        // Lógica de Preenchimento da Barra (Progresso)
        const fill = document.getElementById('timelineFill');
        if (statusAtual === 'Resolvido') {
            fill.style.width = '100%';
            document.getElementById('iconConc').classList.add('text-emerald-600');
        } else if (t[12]) { // Tem previsão
            fill.style.width = '66%';
            document.getElementById('iconPrev').classList.add('text-orange-500');
        } else if (t[14]) { // Tem responsável
            fill.style.width = '33%';
            document.getElementById('iconAnalise').classList.add('text-blue-500');
        } else {
            fill.style.width = '0%';
        }

        document.getElementById('modalDetalhes').classList.remove('hidden');
    }
    // ... (restante das funções de salvamento e fechamento) ...
</script>
