<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Contas - Vilarejo Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#E30613", "blue-custom": "#3B82F6", "success": "#1ea362", "warning": "#f59e0b" } } }
        }
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .truncate-custom { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Ajustes de Largura das Colunas */
        .col-fornecedor { width: 180px; min-width: 180px; max-width: 180px; word-break: break-word; }
        .col-saldo { width: 115px; min-width: 115px; white-space: nowrap; }
        .col-texto-curto { width: 130px; min-width: 130px; max-width: 130px; }
    </style>
</head>
<body class="bg-gray-100 antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r border-gray-200 p-6 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="flex items-center gap-3 mb-10 pb-4 border-b border-gray-100">
                    <img src="https://i.ibb.co/tPcWfmjT/VI-logo-novo-sem-fundo.png" alt="Logo Vilarejo" class="h-8 w-auto object-contain"/>
                    <span class="text-xl font-bold">Monitor</span>
                </div>
                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg font-medium">
                        <span class="material-symbols-outlined">analytics</span> Rupturas
                    </a>
                    <a href="historico.html" class="flex items-center gap-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg font-medium">
                        <span class="material-symbols-outlined">timeline</span> Histórico
                    </a>
                    <a href="contas.html" class="flex items-center gap-3 p-3 bg-primary text-white rounded-lg font-medium shadow-md">
                        <span class="material-symbols-outlined">payments</span> Contas
                    </a>
                </nav>
            </div>
            <button onclick="window.location.href='index.html'" class="flex items-center gap-3 p-3 text-gray-500 hover:text-red-600 border-t pt-4">
                <span class="material-symbols-outlined">logout</span> Sair
            </button>
        </aside>

        <main class="flex-1 overflow-y-auto p-6 lg:p-10">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b pb-6">
                <div>
                    <h1 class="text-3xl font-black text-gray-800">Controle de Contas</h1>
                    <p class="text-gray-500 text-sm mt-1" id="lastUpdate">Sincronizando...</p>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border-l-8 border-primary shadow-sm">
                    <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Saldo Total a Receber</h3>
                    <div id="totalSaldoCard" class="text-3xl font-black text-gray-900 leading-none">R$ 0,00</div>
                    <p class="text-[10px] text-gray-400 mt-2 font-medium" id="itemsCount">Aguardando dados...</p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border shadow-sm mb-6 flex flex-wrap gap-4">
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-tighter">Status</label>
                    <select id="filterC" onchange="aplicarFiltros()" class="w-full border-gray-300 rounded-lg text-xs">
                        <option value="todos">Todos</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-tighter">Fornecedor</label>
                    <select id="filterD" onchange="aplicarFiltros()" class="w-full border-gray-300 rounded-lg text-xs">
                        <option value="todos">Todos</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-tighter">Grupo</label>
                    <select id="filterE" onchange="aplicarFiltros()" class="w-full border-gray-300 rounded-lg text-xs">
                        <option value="todos">Todos</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-tighter">Responsável</label>
                    <select id="filterF" onchange="aplicarFiltros()" class="w-full border-gray-300 rounded-lg text-xs">
                        <option value="todos">Todos</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm" id="tabelaContas">
                        <thead class="bg-gray-50 border-b text-gray-700">
                            <tr>
                                <th class="px-3 py-3 font-bold uppercase text-[9px]">Data Sol.</th>
                                <th class="px-3 py-3 font-bold uppercase text-[9px]">Status/Op.</th>
                                <th class="px-3 py-3 font-bold uppercase text-[9px] col-fornecedor">Fornecedor / Grupo</th>
                                <th class="px-3 py-3 font-bold uppercase text-[9px] col-texto-curto">Observação</th>
                                <th class="px-3 py-3 font-bold uppercase text-[9px] col-saldo text-center">Saldo (R$)</th>
                                <th class="px-3 py-3 font-bold uppercase text-[9px]">Descrição</th>
                                <th class="px-3 py-3 font-bold uppercase text-[9px] col-texto-curto">Comentário</th>
                                <th class="px-3 py-3 font-bold uppercase text-[9px] text-center">Controle</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="textModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[80vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h3 id="modalTitle" class="font-black text-primary uppercase text-sm tracking-widest">Detalhes</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-600 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="modalBody" class="p-8 overflow-y-auto text-gray-700 text-base leading-relaxed whitespace-pre-wrap font-medium"></div>
            <div class="p-4 border-t bg-gray-50 text-right">
                <button onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 px-6 py-2 rounded-lg font-bold text-xs uppercase transition-colors">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const GID = '186982841';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-1vTFrtHpxDu4l00gW7WtoY_WnPHtBukuZwecJAI9UKo6ajc5BWKUT07vfqK5MDXHpWsWQ4T8UygDWcwG/pub?gid=${GID}&single=true&output=csv`;

        let dadosCompletos = [];
        let dadosFiltrados = [];

        async function carregarDados() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: (results) => {
                    dadosCompletos = results.data.filter(i => i['Fornecedor'] && i['Fornecedor'].trim() !== "");
                    dadosFiltrados = [...dadosCompletos]; 
                    popularFiltros();
                    aplicarFiltros();
                    document.getElementById('lastUpdate').innerText = `Sincronizado: ${new Date().toLocaleTimeString()}`;
                }
            });
        }

        function popularFiltros() {
            const statuses = [...new Set(dadosCompletos.map(i => i['Status']))].sort();
            const suppliers = [...new Set(dadosCompletos.map(i => i['Fornecedor']))].sort();
            const groups = [...new Set(dadosCompletos.map(i => i['Grupo']))].sort();
            const buyers = [...new Set(dadosCompletos.map(i => i['Comprador Responsável']))].sort();

            const populate = (id, list) => {
                const el = document.getElementById(id);
                el.innerHTML = `<option value="todos">Todos</option>`;
                list.forEach(item => { if(item) el.innerHTML += `<option value="${item}">${item}</option>`; });
            };

            populate('filterC', statuses);
            populate('filterD', suppliers);
            populate('filterE', groups);
            populate('filterF', buyers);
        }

        function parseCurrency(str) {
            if (!str) return 0;
            const cleanValue = str.replace(/[R$\s.]/g, '').replace(',', '.');
            const num = parseFloat(cleanValue);
            return isNaN(num) ? 0 : num;
        }

        function atualizarResumoFinanceiro(dados) {
            const total = dados.reduce((acc, item) => acc + parseCurrency(item['R$ Total Saldo']), 0);
            document.getElementById('totalSaldoCard').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('itemsCount').innerText = `${dados.length} solicitações exibidas.`;
        }

        function getColorByDate(dateStr) {
            if (!dateStr || dateStr.trim() === "") return 'bg-gray-100 text-gray-400';
            const parts = dateStr.split('/');
            const dueDate = new Date(parts[2], parts[1] - 1, parts[0]);
            const today = new Date(); today.setHours(0,0,0,0);
            const diffDays = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return 'bg-red-600 text-white font-black';
            if (diffDays <= 5) return 'bg-warning text-white font-black';
            return 'bg-success text-white font-medium';
        }

        function openModalSafe(index, campo) {
            const item = dadosFiltrados[index];
            document.getElementById('modalTitle').innerText = campo === 'H' ? `Obs - ${item['Fornecedor']}` : `Comentário do Comprador`;
            document.getElementById('modalBody').innerText = (campo === 'H' ? item['Observação'] : item['Comentário Comprador']) || 'Nenhuma informação.';
            document.getElementById('textModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('textModal').classList.add('hidden'); }

        function renderizarTabela(dados) {
            const tbody = document.querySelector('#tabelaContas tbody');
            tbody.innerHTML = '';

            dados.forEach((item, index) => {
                const dateClass = getColorByDate(item['Data Definida P/ Controle']);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-3 py-4 text-gray-500 text-[10px]">${item['Data Solicitação'] || ''}</td>
                    <td class="px-3 py-4">
                        <span class="block font-bold text-gray-800 text-[11px] leading-tight">${item['Operação']}</span>
                        <span class="text-[8px] uppercase px-1 bg-gray-100 text-gray-400 rounded font-bold">${item['Status']}</span>
                    </td>
                    <td class="px-3 py-4 col-fornecedor">
                        <span class="block font-black text-blue-custom text-xs">${item['Fornecedor']}</span>
                        <span class="text-[9px] text-gray-400 italic block leading-tight">${item['Grupo']}</span>
                    </td>
                    <td class="px-3 py-4 col-texto-curto">
                        <div onclick="openModalSafe(${index}, 'H')" class="text-[10px] text-gray-600 truncate-custom cursor-pointer hover:text-primary leading-tight">
                            ${item['Observação'] || '-'}
                        </div>
                    </td>
                    <td class="px-3 py-4 col-saldo text-right">
                        <span class="font-black text-gray-900 text-xs">${item['R$ Total Saldo'] || 'R$ 0,00'}</span>
                    </td>
                    <td class="px-3 py-4 text-[10px] text-gray-500 leading-tight">${item['Descrição'] || ''}</td>
                    <td class="px-3 py-4 col-texto-curto">
                        <div onclick="openModalSafe(${index}, 'M')" class="text-[10px] text-gray-600 truncate-custom cursor-pointer hover:text-primary leading-tight">
                            ${item['Comentário Comprador'] || '-'}
                        </div>
                    </td>
                    <td class="px-3 py-4 text-center">
                        <span class="px-2 py-0.5 rounded text-[9px] uppercase font-bold ${dateClass}">
                            ${item['Data Definida P/ Controle'] || 'N/D'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function aplicarFiltros() {
            const valC = document.getElementById('filterC').value;
            const valD = document.getElementById('filterD').value;
            const valE = document.getElementById('filterE').value;
            const valF = document.getElementById('filterF').value;

            dadosFiltrados = dadosCompletos.filter(i => {
                const mC = (valC === 'todos' || i['Status'] === valC);
                const mD = (valD === 'todos' || i['Fornecedor'] === valD);
                const mE = (valE === 'todos' || i['Grupo'] === valE);
                const mF = (valF === 'todos' || i['Comprador Responsável'] === valF);
                return mC && mD && mE && mF;
            });

            renderizarTabela(dadosFiltrados);
            atualizarResumoFinanceiro(dadosFiltrados);
        }

        carregarDados();
    </script>
</body>
</html>
