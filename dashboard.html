<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard - Vilarejo Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#E30613", "sheets-green": "#1ea362", "background-dark": "#121212", "blue-custom": "#3B82F6", "gray-custom": "#6B7280" } } }
        }
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .tab-active { border-bottom: 3px solid #E30613; color: #E30613; font-weight: 900; }
        .status-pill { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-critico { background-color: #fee2e2; color: #dc2626; }
        .status-alerta { background-color: #fef3c7; color: #d97706; }
        .status-normal { background-color: #d1fae5; color: #059669; }
    </style>
</head>
<body class="bg-gray-100 antialiased text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r border-gray-200 p-6 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="flex items-center gap-3 mb-10 pb-4 border-b border-gray-100">
                    <img src="https://i.ibb.co/tPcWfmjT/VI-logo-novo-sem-fundo.png" alt="Logo Vilarejo" class="h-8 w-auto object-contain"/>
                    <span class="text-xl font-bold">Monitor</span>
                </div>
                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 p-3 bg-primary text-white rounded-lg font-medium shadow-md">
                        <span class="material-symbols-outlined">analytics</span> Rupturas
                    </a>
                    <a href="historico.html" class="flex items-center gap-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg font-medium">
                        <span class="material-symbols-outlined">timeline</span> Histórico
                    </a>
                    <a href="contas.html" class="flex items-center gap-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg font-medium">
                        <span class="material-symbols-outlined">payments</span> Contas
                    </a>
                </nav>
            </div>
            <button onclick="window.location.href='index.html'" class="flex items-center gap-3 p-3 text-gray-500 hover:text-red-600 transition-colors border-t pt-4">
                <span class="material-symbols-outlined">logout</span> Sair
            </button>
        </aside>

        <main class="flex-1 overflow-y-auto p-6 lg:p-10">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b pb-6">
                <div>
                    <div class="flex flex-col md:flex-row md:items-baseline gap-3">
                        <h1 class="text-3xl font-black text-gray-800 tracking-tight">Rupturas de Estoque</h1>
                        <span id="baseUpdateDate" class="text-xs font-bold text-gray-400 bg-gray-200 px-2 py-1 rounded-md uppercase tracking-tighter">Base: Carregando...</span>
                    </div>
                    <div class="flex items-center gap-2 text-gray-500 text-[10px] mt-1 italic uppercase tracking-widest">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                            <span class="relative rounded-full h-2 w-2 bg-blue-500"></span>
                        </span>
                        <span id="lastUpdate">Sincronizando...</span>
                    </div>
                </div>
                <button onclick="carregarDados()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg font-bold text-sm text-gray-700 hover:bg-gray-50 transition-all shadow-sm">
                    <span class="material-symbols-outlined text-sm">refresh</span> Atualizar Agora
                </button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <p class="text-sm font-bold text-gray-500 uppercase mb-1">Ruptura Atual (H)</p>
                    <div class="flex items-baseline gap-2">
                        <span id="totalH" class="text-4xl font-black text-primary">0</span>
                        <span class="text-gray-400 font-bold text-sm">itens</span>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <p class="text-sm font-bold text-gray-500 uppercase mb-1">Ruptura Atual (B)</p>
                    <div class="flex items-baseline gap-2">
                        <span id="totalB" class="text-4xl font-black text-blue-custom">0</span>
                        <span class="text-gray-400 font-bold text-sm">itens</span>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <p class="text-sm font-bold text-gray-500 uppercase mb-1">Ruptura Atual (TH)</p>
                    <div class="flex items-baseline gap-2">
                        <span id="totalTH" class="text-4xl font-black text-gray-custom">0</span>
                        <span class="text-gray-400 font-bold text-sm">itens</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-200 shadow-xl overflow-hidden">
                <div class="flex border-b overflow-x-auto bg-gray-50/50">
                    <button onclick="filtrarHBT('H')" id="tabH" class="tab-active px-8 py-5 text-sm uppercase tracking-widest transition-all">Itens H</button>
                    <button onclick="filtrarHBT('B')" id="tabB" class="px-8 py-5 text-sm text-gray-500 hover:text-primary transition-all uppercase tracking-widest">Itens B</button>
                    <button onclick="filtrarHBT('TH')" id="tabTH" class="px-8 py-5 text-sm text-gray-500 hover:text-primary transition-all uppercase tracking-widest">Itens TH</button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-400 text-[11px] uppercase tracking-tighter">
                                <th class="px-6 py-4 font-black">Produto</th>
                                <th class="px-6 py-4 font-black text-center">Saldo Atual</th>
                                <th class="px-6 py-4 font-black text-center">Status</th>
                                <th class="px-6 py-4 font-black text-center">Previsão Ruptura</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela" class="divide-y divide-gray-100 text-sm">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const GID_BASE = '0';
        const GID_AUX = '2012060533';
        const BASE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFrtHpxDu4l00gW7WtoY_WnPHtBukuZwecJAI9UKo6ajc5BWKUT07vfqK5MDXHpWsWQ4T8UygDWcwG/pub?';
        
        const CSV_URL = `${BASE_CSV_URL}gid=${GID_BASE}&single=true&output=csv`;
        const AUX_CSV_URL = `${BASE_CSV_URL}gid=${GID_AUX}&single=true&output=csv`;

        let todosDados = [];
        let filtroHBT = 'H';

        async function carregarDados() {
            document.getElementById('lastUpdate').innerText = "Sincronizando...";
            
            // 1. Busca data na aba Auxiliar (Protegido contra erro fatal)
            Papa.parse(AUX_CSV_URL, {
                download: true,
                header: false,
                complete: (results) => {
                    try {
                        if (results.data && results.data[1] && results.data[1][1]) {
                            document.getElementById('baseUpdateDate').innerText = `Base: ${results.data[1][1]}`;
                        } else {
                            document.getElementById('baseUpdateDate').innerText = "Base: S/ Data";
                        }
                    } catch (e) {
                        document.getElementById('baseUpdateDate').innerText = "Base: Erro";
                    }
                }
            });

            // 2. Busca dados principais das Rupturas
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        todosDados = results.data.filter(i => i['Descrição do produto']);
                        atualizarResumos();
                        filtrarHBT(filtroHBT);
                        document.getElementById('lastUpdate').innerText = `Sincronizado: ${new Date().toLocaleTimeString()}`;
                    } else {
                        document.getElementById('lastUpdate').innerText = "Planilha sem dados.";
                    }
                },
                error: (err) => {
                    document.getElementById('lastUpdate').innerText = "Erro na conexão.";
                    console.error(err);
                }
            });
        }

        function atualizarResumos() {
            document.getElementById('totalH').innerText = todosDados.filter(i => i.HBT === 'H' && parseFloat(i['Estoque total']) <= 0).length;
            document.getElementById('totalB').innerText = todosDados.filter(i => i.HBT === 'B' && parseFloat(i['Estoque total']) <= 0).length;
            document.getElementById('totalTH').innerText = todosDados.filter(i => i.HBT === 'TH' && parseFloat(i['Estoque total']) <= 0).length;
        }

        function filtrarHBT(hbt) {
            filtroHBT = hbt;
            
            // UI Tabs
            ['H', 'B', 'TH'].forEach(t => {
                document.getElementById(`tab${t}`).className = t === hbt ? 
                'tab-active px-8 py-5 text-sm uppercase tracking-widest transition-all' : 
                'px-8 py-5 text-sm text-gray-500 hover:text-primary transition-all uppercase tracking-widest';
            });

            const dadosFiltrados = todosDados.filter(item => item.HBT === hbt);
            renderizarTabela(dadosFiltrados);
        }

        function renderizarTabela(dados) {
            const corpo = document.getElementById('corpoTabela');
            corpo.innerHTML = '';

            dados.forEach(item => {
                const saldo = parseFloat(item['Estoque total'] || 0);
                let statusClass = 'status-normal';
                let statusTexto = 'Em Estoque';

                if (saldo <= 0) {
                    statusClass = 'status-critico';
                    statusTexto = 'Ruptura';
                } else if (saldo < 10) { // Exemplo de alerta
                    statusClass = 'status-alerta';
                    statusTexto = 'Estoque Baixo';
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-bold text-gray-800">${item['Descrição do produto']}</div>
                        <div class="text-[10px] text-gray-400 font-mono">${item['Produto'] || 'SEM SKU'}</div>
                    </td>
                    <td class="px-6 py-4 text-center font-black">${saldo}</td>
                    <td class="px-6 py-4 text-center">
                        <span class="status-pill ${statusClass}">${statusTexto}</span>
                    </td>
                    <td class="px-6 py-4 text-center font-medium text-gray-500">
                        ${item['Data da Ruptura'] || '--'}
                    </td>
                `;
                corpo.appendChild(tr);
            });
        }

        carregarDados();
    </script>
</body>
</html>
