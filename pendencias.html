<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pendências CD - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .timeline-bar { height: 8px; background: #e2e8f0; border-radius: 20px; position: relative; }
        .timeline-fill { height: 100%; background: linear-gradient(90deg, #E30613 0%, #ff4d4d 100%); border-radius: 20px; transition: width 0.8s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto">
                
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-xl font-black uppercase tracking-tighter text-gray-800 tracking-widest">Controle de Ocorrências</h1>
                    <button onclick="window.location.href='dashboard_pendencias.html'" class="bg-gray-800 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center gap-2 hover:bg-black transition-all shadow-lg">
                        <span class="material-symbols-outlined text-sm">analytics</span> Dashboard
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-orange-400">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Análise</p>
                        <h3 id="cardAnalise" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Andamento</p>
                        <h3 id="cardAndamento" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Atraso</p>
                        <h3 id="cardAtraso" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Concluídos</p>
                        <h3 id="cardResolvido" class="text-3xl font-black">0</h3>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Buscar ID</label>
                            <input type="text" id="inputBuscaID" onkeyup="filtrarGeral()" placeholder="TKT-..." class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Status</label>
                            <select id="selectStatus" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos os Status</option>
                                <option value="Em análise">Em Análise</option>
                                <option value="Em andamento">Em Andamento</option>
                                <option value="Atrasado">Atrasado</option>
                                <option value="Resolvido">Resolvido</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Motivo</label>
                            <select id="selectMotivoFiltro" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos os Motivos</option>
                                <option value="Quebra fábrica">Quebra fábrica</option>
                                <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                                <option value="Quebra de produto na embalagem(Externa)">Quebra produto embalagem</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="abrirModal()" class="w-full bg-primary text-white px-4 py-2.5 rounded-xl font-bold uppercase text-[10px] shadow-lg hover:bg-red-700 transition-all flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined text-sm">add_circle</span> Novo Ticket
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-[10px] font-black text-gray-400 uppercase">
                                    <th class="p-4">ID Ticket</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Produto / Fornecedor</th>
                                    <th class="p-4 text-center">Abertura</th>
                                    <th class="p-4 text-center">Responsável</th>
                                    <th class="p-4 text-center">Previsão</th>
                                    <th class="p-4 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaChamados" class="divide-y divide-gray-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalChamado" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="text-xl font-black text-primary uppercase">Registrar Pendência</h2>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button>
            </div>
            <form id="formTicket" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="cod_seac" placeholder="Cód Produto Seac" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <input type="text" name="fornecedor" placeholder="Fornecedor" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <input type="text" name="referencia" placeholder="Referência" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <input type="text" name="cod_cliente" placeholder="Cód Cliente" class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <input type="number" name="quantidade" placeholder="Quantidade" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <input type="text" name="lote" placeholder="Tonalidade / Lote" class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                <div class="col-span-full">
                    <select name="motivo" onchange="toggleOutros(this.value)" class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold">
                        <option value="Quebra fábrica">Quebra fábrica</option>
                        <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                        <option value="Quebra de produto na embalagem(Externa)">Quebra produto embalagem (Externa)</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div id="divOutros" class="col-span-full hidden">
                    <input type="text" id="inputOutros" placeholder="Especifique o motivo..." class="w-full p-3 border border-primary rounded-xl outline-none text-sm font-bold">
                </div>
                <textarea name="observacao" placeholder="Informações iniciais..." rows="2" class="col-span-full p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold"></textarea>
                <div class="col-span-full flex gap-3 pt-4">
                    <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold uppercase text-[10px]">Cancelar</button>
                    <button type="submit" id="btnSalvar" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold uppercase text-[10px] shadow-lg">Salvar Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalDetalhes" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[95vh]">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-3xl">
                <div>
                    <h2 id="detalheID" class="text-3xl font-black text-gray-800 tracking-tighter"></h2>
                    <span id="detalheStatusBadge" class="text-[10px] font-black uppercase px-2 py-0.5 rounded"></span>
                </div>
                <button onclick="fecharModalDetalhes()" class="text-gray-400 hover:text-primary"><span class="material-symbols-outlined text-3xl">close</span></button>
            </div>
            
            <div class="p-8 overflow-y-auto modal-scroll space-y-8">
                <div class="space-y-6 bg-gray-50 p-6 rounded-2xl border border-gray-100">
                    <div class="flex justify-between px-2 text-center">
                        <div class="w-1/4 flex flex-col items-center gap-1">
                            <span class="material-symbols-outlined text-blue-600">contact_support</span>
                            <p class="text-[8px] font-black uppercase">Abertura</p>
                        </div>
                        <div class="w-1/4 flex flex-col items-center gap-1">
                            <span id="iconDono" class="material-symbols-outlined text-gray-300">person_search</span>
                            <p class="text-[8px] font-black uppercase">Responsável</p>
                        </div>
                        <div class="w-1/4 flex flex-col items-center gap-1">
                            <span id="iconPrev" class="material-symbols-outlined text-gray-300">event_available</span>
                            <p class="text-[8px] font-black uppercase">Previsão</p>
                        </div>
                        <div class="w-1/4 flex flex-col items-center gap-1">
                            <span id="iconFim" class="material-symbols-outlined text-gray-300">task_alt</span>
                            <p class="text-[8px] font-black uppercase">Conclusão</p>
                        </div>
                    </div>

                    <div class="px-4">
                        <div class="timeline-bar">
                            <div id="timelineFill" class="timeline-fill" style="width: 0%;"></div>
                            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-primary border-2 border-white rounded-full"></div>
                            <div id="nodeDono" class="absolute left-[33%] top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-gray-200 border-2 border-white rounded-full transition-colors"></div>
                            <div id="nodePrev" class="absolute left-[66%] top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-gray-200 border-2 border-white rounded-full transition-colors"></div>
                            <div id="nodeConc" class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-gray-200 border-2 border-white rounded-full transition-colors"></div>
                        </div>
                        <div class="flex justify-between mt-4 text-[9px] font-bold text-gray-600">
                            <div class="w-1/4 text-center" id="timeAbertura"></div>
                            <div class="w-1/4 text-center border-x border-gray-200" id="timeDono"></div>
                            <div class="w-1/4 text-center border-r border-gray-200" id="timePrev"></div>
                            <div class="w-1/4 text-center" id="timeConc"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-6 text-sm">
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Cód. Prod SEAC</label><p id="detalheSeac" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Fornecedor</label><p id="detalheForn" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Referência</label><p id="detalheRef" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Cód. Cliente</label><p id="detalheCli" class="font-bold text-blue-700"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Quantidade</label><p id="detalheQtd" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Tonalidade / Lote</label><p id="detalheLote" class="font-bold text-orange-600"></p></div>
                    <div class="col-span-full md:col-span-1"><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Motivo</label><p id="detalheMotivo" class="font-black text-red-600 uppercase"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Criado por</label><p id="detalheCriadoPor" class="font-bold text-gray-600 uppercase"></p></div>
                </div>

                <div class="p-4 bg-white rounded-2xl border-2 border-gray-100">
                    <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block tracking-widest">Responsável Atual</label>
                    <select id="selectResponsavelModal" onchange="atualizarResponsavelPeloModal(this.value)" class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold focus:border-primary">
                        <option value="">Selecione um responsável...</option>
                    </select>
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Histórico de Tratativas</label>
                    <textarea id="detalheObs" rows="5" class="w-full border-2 border-gray-100 rounded-2xl p-4 text-sm outline-none focus:border-primary bg-gray-50 transition-all font-medium"></textarea>
                </div>
            </div>

            <div class="p-6 bg-white border-t rounded-b-3xl">
                <button id="btnSalvarObs" onclick="salvarObservacao()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-black transition-all shadow-lg">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbznCForFxpY6CAU6W3UgglusC8oqyfDz0dqM-l_95xtr9CK9TcFvbw_V7LJQk8jTZH-/exec';
        const USUARIO_LOGADO = localStorage.getItem('vilarejo_user') || 'Visitante';
        const LISTA_RESPONSAVEIS = ["Eduardo", "Edson", "Fábio", "Leandro", "Herialdo", "Bruna", "Renielle", "Caio"];
        
        let dadosGlobais = [];
        let ticketAbertoAtual = null;

        function abrirModal() { document.getElementById('modalChamado').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalChamado').classList.add('hidden'); }
        function fecharModalDetalhes() { document.getElementById('modalDetalhes').classList.add('hidden'); }
        function toggleOutros(v) { document.getElementById('divOutros').classList.toggle('hidden', v !== 'Outros'); }

        function formatarDataBR(dataStr) {
            if (!dataStr || dataStr === "" || dataStr === "---") return "---";
            if (/^\d{2}\/\d{2}\/\d{4}/.test(dataStr)) return dataStr;
            try { 
                const data = new Date(dataStr); 
                return isNaN(data.getTime()) ? dataStr : `${String(data.getUTCDate()).padStart(2, '0')}/${String(data.getUTCMonth() + 1).padStart(2, '0')}/${data.getUTCFullYear()}`; 
            } catch (e) { return dataStr; }
        }

        function converterParaDate(str) {
            if(!str) return null;
            if(str instanceof Date) return str;
            const partes = str.split('/');
            return new Date(partes[2], partes[1] - 1, partes[0]);
        }

        async function carregarTickets() {
            try {
                const r = await fetch(`${WEB_APP_URL}?rota=pendencias`);
                dadosGlobais = await r.json();
                filtrarGeral();
            } catch (e) { console.error("Erro ao carregar"); }
        }

        function filtrarGeral() {
            const buscaID = document.getElementById('inputBuscaID').value.toLowerCase();
            const statusF = document.getElementById('selectStatus').value;
            const motivoF = document.getElementById('selectMotivoFiltro').value;
            const hoje = new Date().setHours(0,0,0,0);

            const filtrados = dadosGlobais.filter(l => {
                const statusOriginal = l[9];
                const responsavel = l[14];
                const previsao = l[12];
                const abertura = converterParaDate(l[10]);
                const horasDesdeAbertura = (new Date() - abertura) / (1000 * 60 * 60);

                let statusVisual = statusOriginal;
                
                if (statusOriginal !== 'Resolvido') {
                    if (!responsavel || responsavel === "") {
                        statusVisual = horasDesdeAbertura > 24 ? "Em análise (Atrasado)" : "Em análise";
                    } else if (previsao) {
                        const dPrev = converterParaDate(previsao);
                        if (dPrev < hoje) statusVisual = "Atrasado";
                    }
                }

                const matchID = l[0].toLowerCase().includes(buscaID);
                const matchStatus = statusF === "todos" || statusVisual.includes(statusF);
                const matchMotivo = motivoF === "todos" || l[7] === motivoF;
                return matchID && matchStatus && matchMotivo;
            });

            renderizarTabela(filtrados);
            atualizarCardsGerais(dadosGlobais);
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = '';
            const hoje = new Date().setHours(0,0,0,0);

            dados.forEach(linha => {
                const indexOriginal = dadosGlobais.findIndex(dg => dg[0] === linha[0]);
                const [id, seac, forn, ref, cli, qtd, lote, motivo, obs, status, abertura, resolucao, prevista, criadoPor, responsavel] = linha;
                const rowId = indexOriginal + 2;

                const dataAbert = converterParaDate(abertura);
                const horas = (new Date() - dataAbert) / (1000 * 60 * 60);
                
                let statusVisual = status;
                let corStatus = 'bg-blue-100 text-blue-700';

                if(status === 'Resolvido') {
                    corStatus = 'bg-emerald-100 text-emerald-700';
                } else if(!responsavel) {
                    statusVisual = horas > 24 ? 'Em análise (Atrasado)' : 'Em análise';
                    corStatus = horas > 24 ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700';
                } else if(prevista) {
                    const dPrev = converterParaDate(prevista);
                    if(dPrev < hoje) {
                        statusVisual = 'Atrasado';
                        corStatus = 'bg-red-100 text-red-700';
                    }
                }

                let selectResp = `<select onchange="atualizarCampo(${rowId}, 'responsavel', this.value)" class="text-[10px] font-bold border rounded px-1 py-1 bg-white outline-none">
                                    <option value="">Selecione...</option>`;
                LISTA_RESPONSAVEIS.forEach(r => selectResp += `<option value="${r}" ${responsavel === r ? 'selected' : ''}>${r}</option>`);
                selectResp += `</select>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 font-black text-primary"><button onclick="verDetalhes(${indexOriginal})" class="hover:underline">${id}</button></td>
                        <td class="p-4"><span class="px-2 py-1 rounded-md text-[9px] font-black uppercase ${corStatus}">${statusVisual}</span></td>
                        <td class="p-4"><div class="font-bold">${seac}</div><div class="text-[9px] text-gray-400 uppercase font-black">${forn}</div></td>
                        <td class="p-4 text-center text-xs text-gray-500 font-bold">${formatarDataBR(abertura)}</td>
                        <td class="p-4 text-center">${status === 'Resolvido' ? `<span class="text-[10px] font-bold">${responsavel}</span>` : selectResp}</td>
                        <td class="p-4 text-center">
                            ${status === 'Resolvido' ? `<span class="text-xs text-gray-400 font-bold">${formatarDataBR(prevista)}</span>` : 
                            `<input type="date" value="${prevista ? converterParaDate(prevista).toISOString().split('T')[0] : ''}" onchange="atualizarCampo(${rowId}, 'previsao', this.value)" class="border rounded px-1 py-1 text-[10px] font-bold">`}
                        </td>
                        <td class="p-4 text-center">
                            ${status !== 'Resolvido' ? `<button onclick="finalizarTicket(${rowId})" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg hover:bg-emerald-600 hover:text-white transition-all"><span class="material-symbols-outlined text-sm">check</span></button>` : `<span class="text-emerald-600 text-[10px] font-black italic">Finalizado</span>`}
                        </td>
                    </tr>`;
            });
        }

        function verDetalhes(index) {
            const t = dadosGlobais[index];
            ticketAbertoAtual = { index: index, row: index + 2 };

            document.getElementById('detalheID').innerText = t[0];
            document.getElementById('detalheSeac').innerText = t[1];
            document.getElementById('detalheForn').innerText = t[2];
            document.getElementById('detalheRef').innerText = t[3];
            document.getElementById('detalheCli').innerText = t[4] || "---";
            document.getElementById('detalheQtd').innerText = t[5];
            document.getElementById('detalheLote').innerText = t[6] || "---";
            document.getElementById('detalheMotivo').innerText = t[7];
            document.getElementById('detalheObs').value = t[8] || "";
            document.getElementById('detalheCriadoPor').innerText = t[13] || "N/I";

            // Linha do tempo
            document.getElementById('timeAbertura').innerText = formatarDataBR(t[10]);
            document.getElementById('timeDono').innerText = t[15] || "Pendente";
            document.getElementById('timePrev').innerText = formatarDataBR(t[12]);
            document.getElementById('timeConc').innerText = formatarDataBR(t[11]);

            // Lógica Visual Timeline
            const fill = document.getElementById('timelineFill');
            const iconDono = document.getElementById('iconDono'), nodeDono = document.getElementById('nodeDono');
            const iconPrev = document.getElementById('iconPrev'), nodePrev = document.getElementById('nodePrev');
            const iconFim = document.getElementById('iconFim'), nodeConc = document.getElementById('nodeConc');

            // Reset
            [iconDono, iconPrev, iconFim].forEach(i => i.className = "material-symbols-outlined text-gray-300");
            [nodeDono, nodePrev, nodeConc].forEach(n => n.className = "absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-gray-200 border-2 border-white rounded-full transition-colors");
            if(nodeDono) nodeDono.classList.add('left-[33%]', '-translate-x-1/2');
            if(nodePrev) nodePrev.classList.add('left-[66%]', '-translate-x-1/2');
            if(nodeConc) nodeConc.classList.add('right-0');

            if(t[9] === 'Resolvido') {
                fill.style.width = '100%';
                iconDono.classList.replace('text-gray-300', 'text-blue-600');
                iconPrev.classList.replace('text-gray-300', 'text-orange-500');
                iconFim.classList.replace('text-gray-300', 'text-emerald-500');
                [nodeDono, nodePrev, nodeConc].forEach(n => n.classList.replace('bg-gray-200', 'bg-primary'));
            } else if(t[12]) {
                fill.style.width = '66%';
                iconDono.classList.replace('text-gray-300', 'text-blue-600');
                iconPrev.classList.replace('text-gray-300', 'text-orange-500');
                [nodeDono, nodePrev].forEach(n => n.classList.replace('bg-gray-200', 'bg-primary'));
            } else if(t[14]) {
                fill.style.width = '33%';
                iconDono.classList.replace('text-gray-300', 'text-blue-600');
                nodeDono.classList.replace('bg-gray-200', 'bg-primary');
            } else {
                fill.style.width = '0%';
            }

            const selectM = document.getElementById('selectResponsavelModal');
            selectM.innerHTML = '<option value="">Selecione um responsável...</option>';
            LISTA_RESPONSAVEIS.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r; opt.textContent = r;
                if(t[14] === r) opt.selected = true;
                selectM.appendChild(opt);
            });

            document.getElementById('modalDetalhes').classList.remove('hidden');
        }

        async function atualizarResponsavelPeloModal(val) {
            if(!ticketAbertoAtual) return;
            await atualizarCampo(ticketAbertoAtual.row, 'responsavel', val);
        }

        async function salvarObservacao() {
            const btn = document.getElementById('btnSalvarObs');
            const novaObs = document.getElementById('detalheObs').value;
            btn.disabled = true; btn.innerText = "Salvando...";
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: ticketAbertoAtual.row, field: 'observacao', value: novaObs }) });
                fecharModalDetalhes();
                setTimeout(carregarTickets, 800);
            } catch (e) { alert("Erro ao salvar."); }
            finally { btn.disabled = false; btn.innerText = "Salvar Alterações"; }
        }

        async function atualizarCampo(row, campo, valor) {
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: row, field: campo, value: valor }) });
                setTimeout(carregarTickets, 1000);
            } catch (e) { }
        }

        async function finalizarTicket(row) {
            if(!confirm("Concluir chamado?")) return;
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update', row: row, status: 'Resolvido' }) });
                setTimeout(carregarTickets, 1000);
            } catch (e) { }
        }

        function atualizarCardsGerais(dados) {
            let analise = 0, andamento = 0, atraso = 0, resolvido = 0;
            const hoje = new Date().setHours(0,0,0,0);

            dados.forEach(l => {
                const status = l[9];
                const resp = l[14];
                const prev = l[12];
                if(status === 'Resolvido') { resolvido++; }
                else if(!resp) { analise++; }
                else {
                    let isAtr = false;
                    if(prev) {
                        const dP = converterParaDate(prev);
                        if(dP < hoje) isAtr = true;
                    }
                    if(isAtr) atraso++; else andamento++;
                }
            });

            document.getElementById('cardAnalise').innerText = analise;
            document.getElementById('cardAndamento').innerText = andamento;
            document.getElementById('cardAtraso').innerText = atraso;
            document.getElementById('cardResolvido').innerText = resolvido;
        }

        document.getElementById('formTicket').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar'); btn.disabled = true;
            const payload = Object.fromEntries(new FormData(e.target));
            if (payload.motivo === 'Outros') payload.motivo = document.getElementById('inputOutros').value;
            payload.rota = 'pendencias'; payload.action = 'insert'; payload.criado_por = USUARIO_LOGADO;

            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                fecharModal(); e.target.reset();
                setTimeout(carregarTickets, 1500);
            } catch (e) { alert("Erro ao salvar."); }
            finally { btn.disabled = false; }
        });

        window.onload = carregarTickets;
    </script>
</body>
</html>
