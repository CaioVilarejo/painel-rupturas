<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pendências CD - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Estilo para os botões de ação na tabela */
        .btn-acao { transition: all 0.2s; width: 100px; text-transform: uppercase; font-weight: 900; font-size: 8px; padding: 6px 4px; border-radius: 6px; border: none; cursor: pointer; }

        .timeline-container { position: relative; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 10px; margin-top: 20px; margin-bottom: 30px; }
        .timeline-line { position: absolute; top: 10px; left: 0; height: 4px; background: #e2e8f0; width: 100%; z-index: 1; border-radius: 10px; }
        .timeline-progress { position: absolute; top: 10px; left: 0; height: 4px; background: #E30613; width: 0%; z-index: 2; transition: width 0.8s ease; border-radius: 10px; }
        .timeline-step { position: relative; z-index: 3; background: #fff; border: 3px solid #e2e8f0; width: 20px; height: 20px; border-radius: 50%; transition: all 0.4s; margin-bottom: 12px; }
        .timeline-step.active { border-color: #E30613; background: #E30613; box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.2); }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="flex h-screen overflow-hidden">
        
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto">
                
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-xl font-black uppercase tracking-widest text-gray-800 italic">Controle de Pendências CD</h1>
                    <button onclick="abrirDashboard()" class="bg-gray-800 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center gap-2 hover:bg-black transition-all shadow-lg">
                        <span class="material-symbols-outlined text-sm">analytics</span> Dashboard
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-yellow-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Aguardando Prazo</p>
                        <h3 id="cardAnalise" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-orange-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Aguardando Aceite</p>
                        <h3 id="cardAndamento" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Andamento</p>
                        <h3 id="cardAtraso" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Concluídos</p>
                        <h3 id="cardResolvido" class="text-3xl font-black">0</h3>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Buscar ID / Fornecedor</label>
                            <input type="text" id="inputBuscaID" onkeyup="filtrarGeral()" placeholder="TKT-..." class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Status</label>
                            <select id="selectStatus" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos os Status</option>
                                <option value="Aguardando Prazo">Aguardando Prazo</option>
                                <option value="Aguardando Aceite CD">Aguardando Aceite CD</option>
                                <option value="Em andamento">Em Andamento</option>
                                <option value="Resolvido">Resolvido</option>
                                <option value="Prazo Recusado">Prazo Recusado</option>
                                <option value="Cancelado">Cancelado</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Motivo</label>
                            <select id="selectMotivoFiltro" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos os Motivos</option>
                                <option value="Quebra fábrica">Quebra fábrica</option>
                                <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                                <option value="Quebra de produto na embalagem(Externa)">Quebra produto embalagem</option>
                                <option value="Divergência de Estoque">Divergência de Estoque</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="abrirModal()" class="w-full bg-primary text-white px-4 py-2.5 rounded-xl font-bold uppercase text-[10px] shadow-lg hover:bg-red-700 transition-all flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined text-sm">add_circle</span> Novo Ticket
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-[10px] font-black text-gray-400 uppercase">
                                    <th class="p-4">ID Ticket</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Produto / Fornecedor</th>
                                    <th class="p-4 text-center">Abertura</th>
                                    <th class="p-4 text-center">Responsável</th>
                                    <th class="p-4 text-center">Previsão</th>
                                    <th class="p-4 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaChamados" class="divide-y divide-gray-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalChamado" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[95vh]">
            <div class="p-6 border-b bg-gray-50 flex justify-between items-center rounded-t-3xl">
                <h2 class="text-xl font-black text-primary uppercase">Registrar Pendência</h2>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="overflow-y-auto modal-scroll p-6 pb-20"> 
                <form id="formTicket" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" name="cod_seac" placeholder="Cód Produto Seac" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <input type="text" name="fornecedor" placeholder="Fornecedor" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <input type="text" name="referencia" placeholder="Referência" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <input type="text" name="cod_cliente" placeholder="Cód Cliente" class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <input type="number" name="quantidade" step="0.01" lang="pt-BR" placeholder="Quantidade" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <select name="um" required class="p-3 border rounded-xl outline-none bg-white text-sm font-bold focus:border-primary">
                        <option value="" disabled selected>Unidade</option>
                        <option value="UN">UN</option><option value="M2">M²</option><option value="SC">SC</option>
                    </select>
                    <input type="text" name="lote" placeholder="Tonalidade / Lote" class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <select name="tipo_solicitacao" required class="p-3 border rounded-xl outline-none bg-white text-sm font-bold focus:border-primary">
                        <option value="" disabled selected>Tipo de Solicitação</option>
                        <option value="Complemento">Complemento</option><option value="Compra Nova">Compra Nova</option>
                    </select>
                    <div class="col-span-full">
                        <select name="motivo" onchange="toggleOutros(this.value)" class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold">
                            <option value="Quebra fábrica">Quebra fábrica</option>
                            <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                            <option value="Quebra de produto na embalagem(Externa)">Quebra produto embalagem</option>
                            <option value="Divergência de Estoque">Divergência de Estoque</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div id="divOutros" class="col-span-full hidden">
                        <input type="text" id="inputOutros" placeholder="Especifique o motivo..." class="w-full p-3 border border-primary rounded-xl outline-none text-sm font-bold">
                    </div>
                    <div class="col-span-full border-t pt-4">
                        <label class="text-[10px] font-black text-gray-400 uppercase block mb-2">Foi comunicado à loja?</label>
                        <select name="comunicado_loja" id="selectComunicado" onchange="toggleAcordo(this.value, true)" required class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Sim">Sim</option><option value="Não">Não</option>
                        </select>
                    </div>
                    <div id="divAcordo" class="col-span-full hidden">
                        <textarea name="resumo_acordo" placeholder="Resumo do acordo feito com a loja..." rows="2" class="w-full p-3 border border-emerald-500 rounded-xl outline-none text-sm font-bold"></textarea>
                    </div>
                    <textarea name="observacao" placeholder="Informações iniciais/Observações..." rows="3" class="col-span-full p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold"></textarea>
                    <div class="col-span-full flex gap-3 pt-6">
                        <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold uppercase text-[10px]">Cancelar</button>
                        <button type="submit" id="btnSalvar" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold uppercase text-[10px] shadow-lg">Salvar Ticket</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="modalDetalhes" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[95vh]">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-3xl">
                <h2 id="detalheID" class="text-3xl font-black text-gray-800 tracking-tighter"></h2>
                <button onclick="fecharModalDetalhes()" class="text-gray-400 hover:text-primary"><span class="material-symbols-outlined text-3xl">close</span></button>
            </div>
            <div class="p-8 overflow-y-auto modal-scroll space-y-8">
                <div class="grid grid-cols-2 md:grid-cols-3 gap-6 text-sm">
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Cód. Prod SEAC</label><p id="detalheSeac" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Fornecedor</label><p id="detalheForn" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest text-red-500">Motivo</label><p id="detalheMotivo" class="font-bold text-red-600 uppercase"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Referência</label><p id="detalheRef" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Cód. Cliente</label><p id="detalheCodCli" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Tonalidade/Lote</label><p id="detalheLote" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Qtd / UM</label><p class="font-bold text-gray-800"><span id="detalheQtd"></span> <span id="detalheUM" class="text-primary"></span></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Tipo Solicitação</label><p id="detalheTipo" class="font-bold text-blue-700"></p></div>
                    <div><label class="text-[9px] font-black text-primary uppercase tracking-widest">Criado por</label><p id="detalheAutor" class="font-bold text-gray-800 uppercase italic"></p></div>
                </div>

                <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                    <label class="text-[10px] font-black text-blue-400 uppercase mb-1 block tracking-widest">Comunicado à Loja / Acordo</label>
                    <p class="text-sm font-bold text-blue-900"><span id="detalheComunicado"></span> — <span id="detalheAcordo"></span></p>
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Histórico de Tratativas</label>
                    <textarea id="detalheObs" rows="5" class="w-full border-2 border-gray-100 rounded-2xl p-4 text-sm outline-none focus:border-primary bg-gray-50 font-medium"></textarea>
                </div>
            </div>
            <div class="p-6 bg-white border-t rounded-b-3xl">
                <button id="btnSalvarObs" onclick="salvarAlteracoesNoModal()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-black transition-all">Salvar Observações</button>
            </div>
        </div>
    </div>

    <div id="modalDashboard" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden flex items-center justify-center z-[10000] p-4">
        <div class="bg-white w-full max-w-4xl h-[85vh] rounded-3xl shadow-2xl flex flex-col p-8 overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <div><h2 class="text-2xl font-black italic uppercase">Dashboard Geral</h2></div>
                <button onclick="fecharDashboard()" class="text-gray-400 hover:text-black"><span class="material-symbols-outlined text-3xl">close</span></button>
            </div>
            <div id="graficoArea" class="flex-1">
                <canvas id="graficoMotivos"></canvas>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbznCForFxpY6CAU6W3UgglusC8oqyfDz0dqM-l_95xtr9CK9TcFvbw_V7LJQk8jTZH-/exec';
        const LISTA_RESPONSAVEIS = ["Eduardo", "Edson", "Fábio", "Leandro", "Herialdo", "Bruna", "Renielle", "Caio"];
        
        let dadosGlobais = [];
        let ticketAbertoAtual = null;

        document.addEventListener('DOMContentLoaded', carregarTickets);

        async function carregarTickets() {
            try {
                const response = await fetch(`${WEB_APP_URL}?rota=pendencias`);
                dadosGlobais = await response.json();
                filtrarGeral();
            } catch (e) { console.error("Erro ao carregar dados."); }
        }

        function abrirModal() { document.getElementById('modalChamado').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalChamado').classList.add('hidden'); document.getElementById('formTicket').reset(); }
        function fecharModalDetalhes() { document.getElementById('modalDetalhes').classList.add('hidden'); }

        function toggleOutros(v) { document.getElementById('divOutros').classList.toggle('hidden', v !== 'Outros'); }
        function toggleAcordo(v, alertar) {
            const div = document.getElementById('divAcordo');
            if(v === 'Sim') div.classList.remove('hidden'); 
            else { div.classList.add('hidden'); if(v === 'Não' && alertar) Swal.fire('Atenção', 'Comunique a loja antes de prosseguir.', 'warning'); }
        }

        document.getElementById('formTicket').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true; btn.innerText = "Enviando...";
            const data = Object.fromEntries(new FormData(e.target));
            const user = localStorage.getItem('vilarejo_user') || "Desconhecido";
            data.criado_por = user; data.rota = 'pendencias'; data.action = 'insert';
            if (data.motivo === 'Outros') data.motivo = document.getElementById('inputOutros').value;

            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                fecharModal();
                Swal.fire('Sucesso!', 'Ticket registrado com sucesso.', 'success');
                setTimeout(carregarTickets, 1000);
            } catch (err) { Swal.fire('Erro', 'Não foi possível salvar o ticket.', 'error'); }
            finally { btn.disabled = false; btn.innerText = "Salvar Ticket"; }
        };

        function formatarDataBR(str) {
            if (!str || str === "---") return "---";
            const d = new Date(str);
            return isNaN(d.getTime()) ? str : `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`;
        }

        function calcularStatusReal(l) {
            const s = l[9], p = l[12];
            if (['Resolvido', 'Cancelado', 'Prazo Recusado', 'Em andamento', 'Aguardando Aceite CD'].includes(s)) return s;
            return (!p || p === "" || p === "---") ? 'Aguardando Prazo' : 'Aguardando Aceite CD';
        }

        function filtrarGeral() {
            const busca = document.getElementById('inputBuscaID').value.toLowerCase();
            const statusF = document.getElementById('selectStatus').value;
            const fil = dadosGlobais.filter(l => {
                const s = calcularStatusReal(l);
                return (l[0] + l[2]).toLowerCase().includes(busca) && (statusF === "todos" || s === statusF);
            });
            renderizarTabela(fil);
            atualizarCards(dadosGlobais);
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = '';
            dados.forEach(l => {
                const idx = dadosGlobais.findIndex(dg => dg[0] === l[0]), row = idx + 2, s = calcularStatusReal(l);
                let badge = 'bg-gray-100 text-gray-700';
                if(s === 'Resolvido') badge = 'bg-emerald-100 text-emerald-700';
                else if(s === 'Aguardando Prazo') badge = 'bg-yellow-100 text-yellow-700';
                else if(s === 'Aguardando Aceite CD') badge = 'bg-orange-100 text-orange-700';
                else if(s === 'Em andamento') badge = 'bg-blue-100 text-blue-700';
                else if(s === 'Prazo Recusado') badge = 'bg-red-100 text-red-700';
                else if(s === 'Cancelado') badge = 'bg-gray-400 text-white';

                let acao = '';
                if (s === 'Aguardando Aceite CD') {
                    acao = `
                        <div class="flex flex-col gap-1 items-center">
                            <button onclick="mudarStatusComConfirmação(${row}, 'Em andamento', 'Aceitar Prazo')" class="btn-acao bg-emerald-600 text-white hover:bg-emerald-700">Aceitar Prazo</button>
                            <button onclick="mudarStatusComConfirmação(${row}, 'Prazo Recusado', 'Rejeitar')" class="btn-acao bg-red-600 text-white hover:bg-red-700">Rejeitar</button>
                        </div>`;
                } else if (s === 'Em andamento') {
                    acao = `
                        <div class="flex flex-col gap-1 items-center">
                            <button onclick="mudarStatusComConfirmação(${row}, 'Resolvido', 'Resolver')" class="btn-acao bg-emerald-600 text-white hover:bg-emerald-700">Resolvido</button>
                            <button onclick="mudarStatusComConfirmação(${row}, 'Cancelado', 'Cancelar')" class="btn-acao bg-gray-500 text-white hover:bg-gray-600">Cancelado</button>
                        </div>`;
                } else if (s === 'Resolvido' || s === 'Cancelado') {
                    acao = `<span class="text-[9px] font-black uppercase text-gray-400">${s}</span>`;
                }

                let dP = l[12] && l[12] !== "---" ? (l[12].includes('/') ? l[12].split('/').reverse().join('-') : l[12].split('T')[0]) : "";
                const destaqueYellow = (s === 'Aguardando Prazo' || s === 'Aguardando Aceite CD') ? 'bg-yellow-200 border-yellow-400 font-black' : 'bg-white';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100">
                        <td class="p-4 font-black text-primary italic"><button onclick="verDetalhes(${idx})">${l[0]}</button></td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-[9px] font-black uppercase ${badge}">${s}</span></td>
                        <td class="p-4 font-bold text-xs">${l[2]}</td>
                        <td class="p-4 text-center text-[10px] font-bold">${formatarDataBR(l[10])}</td>
                        <td class="p-4 text-center">
                            <select onchange="atualizarCampo(${row}, 'responsavel', this.value)" class="text-[10px] border rounded p-1 font-bold">
                                <option value="">---</option>
                                ${LISTA_RESPONSAVEIS.map(r => `<option value="${r}" ${l[14] === r ? 'selected' : ''}>${r}</option>`).join('')}
                            </select>
                        </td>
                        <td class="p-4 text-center">
                            <input type="date" value="${dP}" onchange="confirmarPrevisao(${row}, this.value)" class="text-[10px] border rounded p-1.5 transition-colors ${destaqueYellow}">
                        </td>
                        <td class="p-4 text-center">${acao}</td>
                    </tr>`;
            });
        }

        // FUNÇÃO DE MUDANÇA DE STATUS COM CONFIRMAÇÃO VISUAL
        async function mudarStatusComConfirmação(row, status, label) {
            const result = await Swal.fire({
                title: `Deseja ${label}?`,
                text: `O ticket passará para o status: ${status}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: status.includes('Resolvido') || status.includes('andamento') ? '#059669' : '#dc2626',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Sim, confirmar!',
                cancelButtonText: 'Cancelar'
            });

            if (result.isConfirmed) {
                Swal.fire({ title: 'Aguarde...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: row, field: 'status', value: status }) });
                
                if(status === 'Resolvido' || status === 'Cancelado') {
                    await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: row, field: 'data_conclusao', value: new Date().toLocaleDateString('pt-BR') }) });
                }

                await carregarTickets(); // Recarrega a tabela automaticamente
                Swal.fire('Atualizado!', `Ticket movido para ${status}.`, 'success');
            }
        }

        async function confirmarPrevisao(row, data) {
            if(!data) return;
            const result = await Swal.fire({
                title: 'Definir Previsão?',
                text: `Nova data: ${formatarDataBR(data)}`,
                icon: 'calendar_month',
                showCancelButton: true,
                confirmButtonText: 'Confirmar data'
            });

            if(result.isConfirmed) {
                await atualizarCampo(row, 'previsao', data);
                await atualizarCampo(row, 'data_definicao', new Date().toLocaleDateString('pt-BR'));
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: row, field: 'status', value: 'Aguardando Aceite CD' }) });
                await carregarTickets();
                Swal.fire('Pronto!', 'Previsão enviada para aceite.', 'success');
            }
        }

        async function atualizarCampo(r, f, v) {
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: r, field: f, value: v }) });
        }

        function verDetalhes(idx) {
            const t = dadosGlobais[idx];
            ticketAbertoAtual = { index: idx, row: idx + 2 };
            document.getElementById('detalheID').innerText = t[0];
            document.getElementById('detalheSeac').innerText = t[1];
            document.getElementById('detalheForn').innerText = t[2];
            document.getElementById('detalheRef').innerText = t[3];
            document.getElementById('detalheCodCli').innerText = t[4] || "---";
            document.getElementById('detalheLote').innerText = t[6] || "---";
            document.getElementById('detalheQtd').innerText = String(t[5] || 0).replace('.', ',');
            document.getElementById('detalheUM').innerText = t[16] || "";
            document.getElementById('detalheMotivo').innerText = t[7] || "---";
            document.getElementById('detalheObs').value = t[8] || "";
            document.getElementById('detalheTipo').innerText = t[19] || "---";
            document.getElementById('detalheAutor').innerText = t[13] || "---";
            document.getElementById('detalheComunicado').innerText = t[17] || "---";
            document.getElementById('detalheAcordo').innerText = t[18] || "---";
            document.getElementById('modalDetalhes').classList.remove('hidden');
        }

        async function salvarAlteracoesNoModal() {
            const btn = document.getElementById('btnSalvarObs');
            btn.disabled = true; btn.innerText = "Salvando...";
            await atualizarCampo(ticketAbertoAtual.row, 'observacao', document.getElementById('detalheObs').value);
            fecharModalDetalhes();
            Swal.fire('Salvo', 'Observações atualizadas.', 'success');
            btn.disabled = false; btn.innerText = "Salvar Observações";
            carregarTickets();
        }

        function atualizarCards(dados) {
            let a=0,b=0,c=0,d=0;
            dados.forEach(l => {
                const s = calcularStatusReal(l);
                if(s==='Aguardando Prazo') a++; else if(s==='Aguardando Aceite CD') b++; else if(s==='Em andamento') c++; else if(s==='Resolvido') d++;
            });
            document.getElementById('cardAnalise').innerText = a;
            document.getElementById('cardAndamento').innerText = b;
            document.getElementById('cardAtraso').innerText = c;
            document.getElementById('cardResolvido').innerText = d;
        }

        function abrirDashboard() { document.getElementById('modalDashboard').classList.remove('hidden'); }
        function fecharDashboard() { document.getElementById('modalDashboard').classList.add('hidden'); }
    </script>
    <script src="menu.js"></script>
</body>
</html>
