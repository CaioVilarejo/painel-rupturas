<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugestão de Compras - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; scroll-behavior: smooth; overflow: hidden; }
        
        /* REMOVER SCROLLBAR PADRÃO */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }

        /* BARRA DE SCROLL MINIMALISTA */
        .custom-scroll-container { position: fixed; right: 10px; top: 20px; bottom: 20px; width: 30px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; z-index: 100; padding: 10px 0; }
        .scroll-track { flex: 1; width: 6px; background: #f1f1f1; border-radius: 10px; position: relative; margin: 10px 0; }
        .scroll-thumb { width: 100%; background: #a1a1a1; border-radius: 10px; position: absolute; top: 0; transition: height 0.1s ease-out; cursor: pointer; }
        .scroll-arrow { color: #a1a1a1; font-size: 20px; cursor: pointer; transition: color 0.2s; user-select: none; }
        .scroll-arrow:hover { color: #E30613; }

        /* CABEÇALHO FIXO (STICKY HEADER) */
        .sticky-header th { position: sticky; top: 0; background-color: #f9fafb; z-index: 20; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .table-container { max-height: 65vh; overflow-y: auto; position: relative; border: 1px solid #e5e7eb; border-radius: 12px; }
        .table-container::-webkit-scrollbar { display: none; }

        /* ESTILOS ESPECÍFICOS DA TABELA */
        .sticky-col { position: sticky; z-index: 21; background-color: white; }
        .sticky-col-1 { left: 0; min-width: 300px; }
        thead .sticky-col { z-index: 41; background-color: #f9fafb; }

        /* DROPDOWN FILTRO MULTISELEÇÃO */
        .filter-dropdown { position: relative; display: inline-block; width: 100%; }
        .filter-content { display: none; position: absolute; background-color: white; min-width: 200px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1); z-index: 50; border-radius: 12px; padding: 12px; border: 1px solid #e5e7eb; margin-top: 4px; max-height: 300px; overflow-y: auto; }
        .filter-dropdown:hover .filter-content { display: block; }
        .filter-option { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; font-size: 11px; font-weight: 600; color: #4b5563; }
        .filter-option input { cursor: pointer; accent-color: #E30613; }

        .btn-primary { background-color: #E30613; color: white; font-weight: 800; text-transform: uppercase; font-size: 10px; padding: 10px 20px; border-radius: 12px; transition: all 0.2s; }
        .btn-primary:hover { background-color: #c40510; transform: translateY(-1px); }
        
        .alvo-input { width: 80px; padding: 4px 8px; font-size: 11px; font-weight: 800; border: 1px solid #e2e8f0; border-radius: 6px; background-color: #fffbeb; text-align: right; outline: none; }
        .alvo-input:focus { border-color: #E30613; ring: 2px solid rgba(227, 6, 19, 0.1); }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- BARRA DE SCROLL MINIMALISTA -->
    <div class="custom-scroll-container">
        <span class="material-symbols-outlined scroll-arrow" onclick="rolarParaTopo()">expand_less</span>
        <div class="scroll-track">
            <div id="scrollThumb" class="scroll-thumb" style="height: 20%;"></div>
        </div>
        <span class="material-symbols-outlined scroll-arrow" onclick="rolarParaFim()">expand_more</span>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- CONTAINER PARA O MENU LATERAL -->
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar" id="main-scroll-container">
            <div class="max-w-full mx-auto">
                
                <header class="flex justify-between items-center mb-8 border-b pb-6">
                    <div>
                        <h1 class="text-2xl font-black uppercase tracking-widest text-gray-800 italic">Sugestão de Compras</h1>
                        <div id="preHeaderInfo" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">
                            Carregue o arquivo de Giro de Estoque para iniciar
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <button id="reset-btn" class="bg-gray-200 text-gray-600 px-4 py-2 rounded-xl font-bold text-[10px] uppercase hover:bg-gray-300 transition-all">
                            Limpar Dados
                        </button>
                        <button onclick="document.getElementById('file-input').click()" class="btn-primary flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">upload_file</span> Carregar Planilha
                        </button>
                        <input type="file" id="file-input" class="hidden" accept=".csv, .xls, .xlsx">
                    </div>
                </header>

                <!-- ÁREA DE UPLOAD (INICIAL) -->
                <div id="upload-area" class="bg-white border-4 border-dashed border-gray-200 rounded-3xl p-16 text-center mb-8 transition-all hover:border-primary/30">
                    <span class="material-symbols-outlined text-6xl text-gray-300 mb-4">inventory_2</span>
                    <h2 class="text-xl font-black text-gray-700 uppercase">Arraste sua planilha aqui</h2>
                    <p class="text-gray-400 text-sm font-medium mt-2">Suporta arquivos .csv, .xls e .xlsx</p>
                </div>

                <!-- CONTEÚDO PRINCIPAL (OCULTO ATÉ CARREGAR) -->
                <div id="main-content" class="hidden space-y-8">
                    
                    <!-- CARDS DE RESUMO -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-primary">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Total Itens</p>
                            <h3 id="cardTotalItens" class="text-3xl font-black">0</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Valor em Estoque</p>
                            <h3 id="cardValorEstoque" class="text-3xl font-black">R$ 0,00</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Total Sugestão Pedido</p>
                            <h3 id="cardTotalPedido" class="text-3xl font-black text-emerald-600">R$ 0,00</h3>
                        </div>
                    </div>

                    <!-- FILTROS -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap gap-4 items-end">
                        <div class="flex-1 min-w-[200px]">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Buscar Produto</label>
                            <input type="text" id="globalSearch" onkeyup="aplicarFiltros()" placeholder="Nome ou código..." class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                        </div>

                        <div class="filter-dropdown w-48">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Linha</label>
                            <div class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white flex justify-between items-center cursor-pointer">
                                <span id="labelLinha">Todas</span>
                                <span class="material-symbols-outlined text-sm">expand_more</span>
                            </div>
                            <div class="filter-content" id="checklistLinha"></div>
                        </div>

                        <div class="filter-dropdown w-48">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Subgrupo</label>
                            <div class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white flex justify-between items-center cursor-pointer">
                                <span id="labelSubgrupo">Todos</span>
                                <span class="material-symbols-outlined text-sm">expand_more</span>
                            </div>
                            <div class="filter-content" id="checklistSubgrupo"></div>
                        </div>

                        <button onclick="exportarExcel()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center gap-2 hover:bg-emerald-700 transition-all shadow-lg">
                            <span class="material-symbols-outlined text-sm">download</span> Exportar
                        </button>
                    </div>

                    <!-- TABELA -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="table-container no-scrollbar">
                            <table class="w-full text-left border-collapse" id="tabelaAlvos">
                                <thead class="sticky-header">
                                    <tr class="bg-gray-50 border-b text-[10px] font-black text-gray-400 uppercase" id="headerRow">
                                        <!-- Populado via JS -->
                                    </tr>
                                </thead>
                                <tbody id="tableBody" class="divide-y divide-gray-100 text-xs font-medium">
                                    <!-- Populado via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let state = {
            allData: [],
            originalHeaders: [],
            displayHeaders: [],
            filters: { linha: [], subgrupo: [] },
            columnIndices: {},
            productData: JSON.parse(localStorage.getItem('productData_Vilarejo') || '{}')
        };

        document.addEventListener('DOMContentLoaded', () => {
            inicializarCustomScroll();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('file-input').addEventListener('change', handleFileUpload);
            document.getElementById('reset-btn').addEventListener('click', () => {
                Swal.fire({
                    title: 'Limpar tudo?',
                    text: "Você perderá os dados carregados.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Sim, limpar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        localStorage.removeItem('productData_Vilarejo');
                        location.reload();
                    }
                });
            });
        }

        function normalizeText(t) { return String(t || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: null });
                    if (jsonData.length > 0) processarDados(jsonData);
                } catch (err) {
                    Swal.fire('Erro', 'Falha ao processar arquivo.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processarDados(data) {
            // 1. Localizar Cabeçalho
            let headerRowIndex = data.findIndex(row => Array.isArray(row) && row.some(cell => normalizeText(cell).includes('descri')));
            if (headerRowIndex === -1) {
                Swal.fire('Erro', 'Cabeçalho contendo "Descrição" não encontrado.', 'error');
                return;
            }

            // 2. Extrair Informações do Cabeçalho (Fornecedor, Período)
            const preHeaderRows = data.slice(0, headerRowIndex);
            document.getElementById('preHeaderInfo').innerHTML = preHeaderRows
                .map(row => Array.isArray(row) ? row.filter(c => String(c || '').trim()).join(' | ') : '')
                .filter(s => s).join('<br>');

            // 3. Mapear Colunas Originais
            state.originalHeaders = data[headerRowIndex].map(h => String(h || '').trim());
            const normHeaders = state.originalHeaders.map(h => normalizeText(h));

            state.columnIndices = {
                descri: normHeaders.findIndex(h => h.includes('descri')),
                codigo: normHeaders.indexOf('codigo'),
                estoque: normHeaders.indexOf('estoque'),
                pedido: normHeaders.indexOf('pedido'),
                inverter: normHeaders.indexOf('inverter'),
                custo: normHeaders.findIndex(h => h.includes('custo')),
                vendido: normHeaders.findIndex(h => h.includes('vendido'))
            };

            // 4. Definir Colunas de Exibição (Inserindo as novas colunas)
            state.displayHeaders = [...state.originalHeaders];
            
            // Inserir Linha, Subgrupo, Cor após Código
            const codIdx = state.displayHeaders.indexOf('Código');
            if (codIdx !== -1) state.displayHeaders.splice(codIdx + 1, 0, 'Linha', 'Subgrupo', 'Cor');

            // Inserir Estoque Futuro e Alvo após Inverter
            const invIdx = state.displayHeaders.indexOf('Inverter');
            if (invIdx !== -1) state.displayHeaders.splice(invIdx + 1, 0, 'Estoque Futuro', 'Alvo');

            // Inserir Comprar após Custo
            const custoIdx = state.displayHeaders.findIndex(h => normalizeText(h).includes('custo'));
            if (custoIdx !== -1) state.displayHeaders.splice(custoIdx + 1, 0, 'Comprar');

            // 5. Processar Linhas de Dados
            const dataRows = data.slice(headerRowIndex + 1);
            state.allData = dataRows.filter(row => Array.isArray(row) && row[0] && !String(row[0]).includes('Total')).map(row => {
                const item = {};
                state.originalHeaders.forEach((h, i) => item[h] = row[i]);
                
                // Cálculos Automáticos
                const estoque = parseFloat(row[state.columnIndices.estoque]) || 0;
                const pedido = parseFloat(row[state.columnIndices.pedido]) || 0;
                const inverter = parseFloat(row[state.columnIndices.inverter]) || 0;
                
                item['Estoque Futuro'] = estoque + pedido - inverter;
                
                // Recuperar dados salvos (Linha, Subgrupo, Cor, Alvo)
                const codigo = row[state.columnIndices.codigo] || `ref_${row[state.originalHeaders.indexOf('Referência')]}`;
                const saved = state.productData[codigo] || {};
                
                item['Linha'] = saved.linha || '';
                item['Subgrupo'] = saved.subgrupo || '';
                item['Cor'] = saved.cor || '';
                item['Alvo'] = saved.alvo || 0;
                item['Comprar'] = Math.max(0, (parseFloat(item['Alvo']) || 0) - item['Estoque Futuro']);
                item._codigo = codigo;

                return item;
            });

            // 6. Popular Filtros
            const linhas = [...new Set(state.allData.map(d => d['Linha'] || 'Sem Linha'))].sort();
            const subgrupos = [...new Set(state.allData.map(d => d['Subgrupo'] || 'Sem Subgrupo'))].sort();
            popularChecklist('checklistLinha', linhas, 'linha');
            popularChecklist('checklistSubgrupo', subgrupos, 'subgrupo');

            // 7. UI
            document.getElementById('upload-area').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            renderizarHeader();
            aplicarFiltros();
        }

        function popularChecklist(id, itens, filterKey) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            itens.forEach(item => {
                const label = document.createElement('label');
                label.className = 'filter-option';
                label.innerHTML = `<input type="checkbox" value="${item}" checked onchange="atualizarFiltro('${filterKey}')"> ${item}`;
                container.appendChild(label);
            });
        }

        function atualizarFiltro(key) {
            const checks = document.querySelectorAll(`#checklist${key.charAt(0).toUpperCase() + key.slice(1)} input:checked`);
            state.filters[key] = Array.from(checks).map(c => c.value);
            const total = document.querySelectorAll(`#checklist${key.charAt(0).toUpperCase() + key.slice(1)} input`).length;
            document.getElementById(`label${key.charAt(0).toUpperCase() + key.slice(1)}`).innerText = 
                state.filters[key].length === total ? "Todas" : `${state.filters[key].length} selecionados`;
            aplicarFiltros();
        }

        function renderizarHeader() {
            const header = document.getElementById('headerRow');
            header.innerHTML = '';
            state.displayHeaders.forEach((h, i) => {
                const th = document.createElement('th');
                const isDescri = (i === state.displayHeaders.indexOf(state.originalHeaders[state.columnIndices.descri]));
                th.className = `p-4 whitespace-nowrap ${isDescri ? 'sticky-col sticky-col-1' : ''}`;
                th.innerText = h;
                header.appendChild(th);
            });
        }

        function aplicarFiltros() {
            const busca = document.getElementById('globalSearch').value.toLowerCase();
            const filtrados = state.allData.filter(item => {
                const matchBusca = Object.values(item).some(v => String(v).toLowerCase().includes(busca));
                const matchLinha = state.filters.linha.length === 0 || state.filters.linha.includes(item['Linha'] || 'Sem Linha');
                const matchSubgrupo = state.filters.subgrupo.length === 0 || state.filters.subgrupo.includes(item['Subgrupo'] || 'Sem Subgrupo');
                return matchBusca && matchLinha && matchSubgrupo;
            });
            renderizarTabela(filtrados);
            atualizarCards(filtrados);
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const descriHeader = state.originalHeaders[state.columnIndices.descri];

            dados.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 border-b border-gray-100';
                
                state.displayHeaders.forEach((h, i) => {
                    const td = document.createElement('td');
                    const isDescri = (h === descriHeader);
                    td.className = `p-4 ${isDescri ? 'sticky-col sticky-col-1 font-bold text-gray-800' : ''}`;
                    
                    if (h === 'Linha' || h === 'Subgrupo' || h === 'Cor') {
                        const val = row[h] || '';
                        td.innerHTML = `<input type="text" value="${val}" onchange="salvarCampo('${row._codigo}', '${h.toLowerCase()}', this.value)" class="w-full p-1 border rounded text-[10px] font-bold outline-none focus:border-primary">`;
                    } else if (h === 'Alvo') {
                        td.innerHTML = `<input type="number" value="${row[h] || 0}" onchange="salvarCampo('${row._codigo}', 'alvo', this.value)" class="alvo-input">`;
                    } else if (h === 'Comprar') {
                        td.innerText = row[h];
                        td.classList.add('font-black', 'text-primary', 'text-center', 'text-sm');
                    } else if (h === 'Estoque Futuro') {
                        td.innerText = row[h];
                        td.classList.add('font-bold', 'text-center');
                    } else {
                        let val = row[h] || '';
                        if (typeof val === 'number' && (h.includes('R$') || h.includes('Custo') || h.includes('Preço'))) {
                            td.innerText = val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                            td.classList.add('text-right');
                        } else {
                            td.innerText = val;
                        }
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function salvarCampo(codigo, campo, valor) {
            if (!state.productData[codigo]) state.productData[codigo] = {};
            state.productData[codigo][campo] = valor;
            localStorage.setItem('productData_Vilarejo', JSON.stringify(state.productData));
            
            // Recalcular "Comprar" se o Alvo mudar
            const item = state.allData.find(d => d._codigo === codigo);
            if (item) {
                item[campo.charAt(0).toUpperCase() + campo.slice(1)] = valor;
                if (campo === 'alvo') {
                    item['Comprar'] = Math.max(0, (parseFloat(valor) || 0) - item['Estoque Futuro']);
                }
                aplicarFiltros();
            }
        }

        function atualizarCards(dados) {
            document.getElementById('cardTotalItens').innerText = dados.length;
            let totalEstoque = 0, totalPedido = 0;
            dados.forEach(item => {
                const custo = parseFloat(item['Custo(R$)']) || 0;
                totalEstoque += (custo * (parseFloat(item['Estoque']) || 0));
                totalPedido += (custo * (parseFloat(item['Comprar']) || 0));
            });
            document.getElementById('cardValorEstoque').innerText = totalEstoque.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('cardTotalPedido').innerText = totalPedido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function exportarExcel() {
            const table = document.getElementById('tabelaAlvos');
            const wb = XLSX.utils.table_to_book(table, { sheet: "Sugestão" });
            XLSX.writeFile(wb, `Sugestao_Compras_${new Date().toLocaleDateString()}.xlsx`);
        }

        function inicializarCustomScroll() {
            const thumb = document.getElementById('scrollThumb');
            const container = document.getElementById('main-scroll-container');
            container.addEventListener('scroll', () => {
                const scrolled = container.scrollTop;
                const height = container.scrollHeight - container.clientHeight;
                const percentage = (scrolled / height) * 80;
                thumb.style.top = percentage + '%';
            });
        }
        function rolarParaTopo() { document.getElementById('main-scroll-container').scrollTo({ top: 0, behavior: 'smooth' }); }
        function rolarParaFim() { 
            const container = document.getElementById('main-scroll-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' }); 
        }
    </script>
    <script src="menu.js"></script>
</body>
</html>
