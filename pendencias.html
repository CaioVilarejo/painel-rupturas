<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pendências CD - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .timeline-container { position: relative; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 10px; margin-top: 20px;}
        .timeline-line { position: absolute; top: 50%; left: 0; transform: translateY(-50%); height: 4px; background: #e2e8f0; width: 100%; z-index: 1; border-radius: 10px; }
        .timeline-progress { position: absolute; top: 50%; left: 0; transform: translateY(-50%); height: 4px; background: #E30613; width: 0%; z-index: 2; transition: width 0.8s ease; border-radius: 10px; }
        .timeline-step { position: relative; z-index: 3; background: #fff; border: 3px solid #e2e8f0; width: 16px; height: 16px; border-radius: 50%; transition: all 0.4s; }
        .timeline-step.active { border-color: #E30613; background: #E30613; box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.2); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto">
                
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-xl font-black uppercase tracking-widest text-gray-800">Controle de Ocorrências</h1>
                    <button onclick="abrirDashboard()" class="bg-gray-800 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center gap-2 hover:bg-black transition-all shadow-lg">
                        <span class="material-symbols-outlined text-sm">analytics</span> Dashboard
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-orange-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Análise</p>
                        <h3 id="cardAnalise" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Em Andamento</p>
                        <h3 id="cardAndamento" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Atrasados</p>
                        <h3 id="cardAtraso" class="text-3xl font-black">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Concluídos</p>
                        <h3 id="cardResolvido" class="text-3xl font-black">0</h3>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Buscar ID</label>
                            <input type="text" id="inputBuscaID" onkeyup="filtrarGeral()" placeholder="TKT-..." class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:border-primary">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Status</label>
                            <select id="selectStatus" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos os Status</option>
                                <option value="Em Análise">Em Análise</option>
                                <option value="Em andamento">Em Andamento</option>
                                <option value="Atrasado">Atrasado</option>
                                <option value="Resolvido">Resolvido</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Motivo</label>
                            <select id="selectMotivoFiltro" onchange="filtrarGeral()" class="w-full border border-gray-200 rounded-xl px-4 py-2 text-xs font-bold bg-white outline-none">
                                <option value="todos">Todos os Motivos</option>
                                <option value="Quebra fábrica">Quebra fábrica</option>
                                <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                                <option value="Quebra de produto na embalagem(Externa)">Quebra produto embalagem</option>
                                <option value="Divergência de Estoque">Divergência de Estoque</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="abrirModal()" class="w-full bg-primary text-white px-4 py-2.5 rounded-xl font-bold uppercase text-[10px] shadow-lg hover:bg-red-700 transition-all flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined text-sm">add_circle</span> Novo Ticket
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-[10px] font-black text-gray-400 uppercase">
                                    <th class="p-4">ID Ticket</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Produto / Fornecedor</th>
                                    <th class="p-4 text-center">Abertura</th>
                                    <th class="p-4 text-center">Responsável</th>
                                    <th class="p-4 text-center">Previsão</th>
                                    <th class="p-4 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaChamados" class="divide-y divide-gray-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalChamado" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[95vh]">
            <div class="p-6 border-b bg-gray-50 flex justify-between items-center rounded-t-3xl">
                <h2 class="text-xl font-black text-primary uppercase">Registrar Pendência</h2>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="overflow-y-auto modal-scroll p-6 pb-20"> <form id="formTicket" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" name="cod_seac" placeholder="Cód Produto Seac" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <input type="text" name="fornecedor" placeholder="Fornecedor" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <input type="text" name="referencia" placeholder="Referência" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <input type="text" name="cod_cliente" placeholder="Cód Cliente" class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    <input type="number" name="quantidade" step="0.01" lang="pt-BR" placeholder="Quantidade" required class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    
                    <select name="um" required class="p-3 border rounded-xl outline-none bg-white text-sm font-bold focus:border-primary">
                        <option value="" disabled selected>Unidade</option>
                        <option value="UN">UN</option>
                        <option value="M2">M²</option>
                        <option value="SC">SC</option>
                    </select>

                    <input type="text" name="lote" placeholder="Tonalidade / Lote" class="p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold">
                    
                    <select name="tipo_solicitacao" required class="p-3 border rounded-xl outline-none bg-white text-sm font-bold focus:border-primary">
                        <option value="" disabled selected>Tipo de Solicitação</option>
                        <option value="Complemento">Complemento</option>
                        <option value="Compra Nova">Compra Nova</option>
                    </select>

                    <div class="col-span-full">
                        <select name="motivo" onchange="toggleOutros(this.value)" class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold">
                            <option value="Quebra fábrica">Quebra fábrica</option>
                            <option value="Quebra depósito/Loja">Quebra depósito/Loja</option>
                            <option value="Quebra de produto na embalagem(Externa)">Quebra produto embalagem</option>
                            <option value="Divergência de Estoque">Divergência de Estoque</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div id="divOutros" class="col-span-full hidden">
                        <input type="text" id="inputOutros" placeholder="Especifique o motivo..." class="w-full p-3 border border-primary rounded-xl outline-none text-sm font-bold">
                    </div>

                    <div class="col-span-full border-t pt-4">
                        <label class="text-[10px] font-black text-gray-400 uppercase block mb-2">Foi comunicado à loja?</label>
                        <select name="comunicado_loja" id="selectComunicado" onchange="toggleAcordo(this.value, true)" required class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Sim">Sim</option>
                            <option value="Não">Não</option>
                        </select>
                    </div>

                    <div id="divAcordo" class="col-span-full hidden">
                        <textarea name="resumo_acordo" placeholder="Resumo do acordo feito com a loja..." rows="2" class="w-full p-3 border border-emerald-500 rounded-xl outline-none text-sm font-bold"></textarea>
                    </div>

                    <textarea name="observacao" placeholder="Informações iniciais/Observações..." rows="3" class="col-span-full p-3 border rounded-xl outline-none focus:border-primary text-sm font-bold"></textarea>
                    
                    <div class="col-span-full flex gap-3 pt-6">
                        <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold uppercase text-[10px]">Cancelar</button>
                        <button type="submit" id="btnSalvar" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold uppercase text-[10px] shadow-lg">Salvar Ticket</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="modalDetalhes" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[95vh]">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-3xl">
                <div>
                    <h2 id="detalheID" class="text-3xl font-black text-gray-800 tracking-tighter"></h2>
                    <span id="detalheStatusBadge" class="text-[10px] font-black uppercase px-2 py-0.5 rounded"></span>
                </div>
                <button onclick="fecharModalDetalhes()" class="text-gray-400 hover:text-primary"><span class="material-symbols-outlined text-3xl">close</span></button>
            </div>
            
            <div class="p-8 overflow-y-auto modal-scroll space-y-8">
                <div class="bg-gray-50 p-8 rounded-3xl border border-gray-100">
                    <div class="timeline-container mb-6">
                        <div class="timeline-line"></div>
                        <div id="timelineProgress" class="timeline-progress"></div>
                        <div class="timeline-step active"></div>
                        <div id="stepTriagem" class="timeline-step"></div>
                        <div id="stepPrevisao" class="timeline-step"></div>
                        <div id="stepConclusao" class="timeline-step"></div>
                    </div>
                    <div class="flex justify-between text-[9px] font-black uppercase text-gray-400">
                        <div class="text-center w-1/4">Abertura<p id="timeAbertura" class="text-gray-800 font-bold mt-1">--/--</p></div>
                        <div class="text-center w-1/4">Triagem<p id="timeTriagem" class="text-gray-800 font-bold mt-1">---</p></div>
                        <div class="text-center w-1/4">Previsão<p id="timePrevisaoModal" class="text-gray-800 font-bold mt-1">---</p></div>
                        <div class="text-center w-1/4">Conclusão<p id="timeConclusao" class="text-gray-800 font-bold mt-1">---</p></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-6 text-sm">
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Cód. Prod SEAC</label><p id="detalheSeac" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Fornecedor</label><p id="detalheForn" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest text-red-500">Motivo</label><p id="detalheMotivo" class="font-bold text-red-600 uppercase"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Referência</label><p id="detalheRef" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Cód. Cliente</label><p id="detalheCodCli" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Tonalidade/Lote</label><p id="detalheLote" class="font-bold text-gray-800"></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Qtd / UM</label><p class="font-bold text-gray-800"><span id="detalheQtd"></span> <span id="detalheUM" class="text-primary"></span></p></div>
                    <div><label class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Tipo Solicitação</label><p id="detalheTipo" class="font-bold text-blue-700"></p></div>
                    <div class="col-span-full bg-blue-50 p-3 rounded-xl">
                        <label class="text-[9px] font-black text-blue-400 uppercase tracking-widest">Acordo com Loja</label>
                        <p id="detalheAcordo" class="font-bold text-blue-900 italic"></p>
                    </div>
                </div>

                <div class="p-4 bg-white rounded-2xl border-2 border-gray-100">
                    <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block tracking-widest">Responsável Atual</label>
                    <select id="selectResponsavelModal" class="w-full p-3 border rounded-xl outline-none bg-white text-sm font-bold focus:border-primary">
                        <option value="">Selecione um responsável...</option>
                    </select>
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Histórico de Tratativas</label>
                    <textarea id="detalheObs" rows="5" class="w-full border-2 border-gray-100 rounded-2xl p-4 text-sm outline-none focus:border-primary bg-gray-50 transition-all resize-none font-medium"></textarea>
                </div>
            </div>
            <div class="p-6 bg-white border-t rounded-b-3xl">
                <button id="btnSalvarObs" onclick="salvarAlteracoesNoModal()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-black transition-all">Salvar Alterações</button>
            </div>
        </div>

    <div id="modalDashboard" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden flex items-center justify-center z-[10000] p-4">
        <div class="bg-white w-full max-w-5xl h-full max-h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-black text-gray-800 uppercase flex items-center gap-2">Dashboard de Ocorrências</h2>
                <button onclick="fecharDashboard()" class="text-gray-400 hover:text-black"><span class="material-symbols-outlined text-3xl">close</span></button>
            </div>
            <div class="p-8 overflow-y-auto modal-scroll space-y-8">
                <div class="flex flex-col md:flex-row gap-6 items-end bg-gray-100 p-6 rounded-3xl">
                    <div class="flex-1">
                        <label class="text-[9px] font-bold text-gray-400">De:</label>
                        <input type="date" id="dashDataInicio" onchange="processarDadosDash()" class="w-full border-b-2 py-2 text-sm font-bold bg-transparent">
                    </div>
                    <div class="flex-1">
                        <label class="text-[9px] font-bold text-gray-400">Até:</label>
                        <input type="date" id="dashDataFim" onchange="processarDadosDash()" class="w-full border-b-2 py-2 text-sm font-bold bg-transparent">
                    </div>
                    <div class="bg-white px-8 py-3 rounded-2xl border min-w-[150px] text-center">
                        <p class="text-[9px] font-black text-gray-400 uppercase">Total Geral</p>
                        <p id="totalMesDash" class="text-2xl font-black">0</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-white p-4 h-80"><canvas id="graficoMotivos"></canvas></div>
                    <div id="listaLegendaDash" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbznCForFxpY6CAU6W3UgglusC8oqyfDz0dqM-l_95xtr9CK9TcFvbw_V7LJQk8jTZH-/exec'; 
        const LISTA_RESPONSAVEIS = ["Eduardo", "Edson", "Fábio", "Leandro", "Herialdo", "Bruna", "Renielle", "Caio"];
        
        let dadosGlobais = [];
        let ticketAbertoAtual = null;
        let chartMotivos = null;

        // --- FUNÇÕES DE INTERFACE ---
        function abrirModal() { document.getElementById('modalChamado').classList.remove('hidden'); }
        function fecharModal() { 
            document.getElementById('modalChamado').classList.add('hidden'); 
            document.getElementById('formTicket').reset(); 
            toggleAcordo('', false); 
        }
        function fecharModalDetalhes() { document.getElementById('modalDetalhes').classList.add('hidden'); }
        function toggleOutros(v) { document.getElementById('divOutros').classList.toggle('hidden', v !== 'Outros'); }
        
        function toggleAcordo(v, dispararAlerta) {
            const div = document.getElementById('divAcordo');
            if(v === 'Sim') {
                div.classList.remove('hidden');
            } else if(v === 'Não') {
                div.classList.add('hidden');
                if(dispararAlerta) alert("Atenção: É necessário comunicar a loja antes de prosseguir com a tratativa.");
            } else {
                div.classList.add('hidden');
            }
        }

        function formatarDataBR(dataStr) {
            if (!dataStr || dataStr === "" || dataStr === "---") return "---";
            try { 
                const data = new Date(dataStr);
                if (isNaN(data.getTime())) return dataStr;
                return `${String(data.getUTCDate()).padStart(2, '0')}/${String(data.getUTCMonth() + 1).padStart(2, '0')}/${data.getUTCFullYear()}`; 
            } catch (e) { return dataStr; }
        }

        // --- CARREGAMENTO E LOGICA ---
        async function carregarTickets() {
            try {
                const r = await fetch(`${WEB_APP_URL}?rota=pendencias`);
                dadosGlobais = await r.json();
                filtrarGeral();
            } catch (e) { console.error("Erro na conexão"); }
        }

        function calcularStatusReal(linha) {
            const statusBase = linha[9];
            const dataAbertura = new Date(linha[10]);
            const prevista = linha[12];
            const hoje = new Date();
            if (statusBase === 'Resolvido') return 'Resolvido';
            if (prevista && prevista !== "" && prevista !== "---") {
                let dPrevRaw = prevista;
                if(prevista.includes('/')) { const p = prevista.split('/'); dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`; }
                return (new Date(dPrevRaw).getTime() < hoje.setHours(0,0,0,0)) ? 'Atrasado' : 'Em andamento';
            }
            return (hoje.getTime() - dataAbertura.getTime() > 86400000) ? 'Em análise (Atrasado)' : 'Em Análise';
        }

        function filtrarGeral() {
            const busca = document.getElementById('inputBuscaID').value.toLowerCase();
            const statusF = document.getElementById('selectStatus').value;
            const motivoF = document.getElementById('selectMotivoFiltro').value;

            const filtrados = dadosGlobais.filter(linha => {
                const sReal = calcularStatusReal(linha);
                const matchID = linha[0].toLowerCase().includes(busca);
                let matchStatus = statusF === "todos" || sReal === statusF;
                if(statusF === "Em Análise" && sReal === "Em análise (Atrasado)") matchStatus = true;
                const matchMotivo = motivoF === "todos" || linha[7] === motivoF;
                return matchID && matchStatus && matchMotivo;
            });
            renderizarTabela(filtrados);
            atualizarCardsGerais(dadosGlobais);
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabelaChamados');
            tbody.innerHTML = '';
            dados.forEach(linha => {
                const idx = dadosGlobais.findIndex(dg => dg[0] === linha[0]);
                const row = idx + 2;
                const sReal = calcularStatusReal(linha);
                
                let color = 'bg-blue-100 text-blue-700';
                if(sReal === 'Resolvido') color = 'bg-emerald-100 text-emerald-700';
                else if(sReal.toLowerCase().includes('análise')) color = 'bg-orange-100 text-orange-700';
                else if(sReal === 'Atrasado') color = 'bg-red-100 text-red-700';

                let dPrevRaw = linha[12];
                if(dPrevRaw && dPrevRaw.includes('/')) { const p = dPrevRaw.split('/'); dPrevRaw = `${p[2]}-${p[1]}-${p[0]}`; }

                let acaoHTML = sReal === 'Resolvido' ? 
                    `<span class="text-[10px] font-black text-emerald-600 uppercase italic">${formatarDataBR(linha[11])}</span>` :
                    `<button onclick="finalizarTicket(${row})" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg hover:bg-emerald-600 hover:text-white transition-all"><span class="material-symbols-outlined text-sm">check</span></button>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="p-4 font-black text-primary"><button onclick="verDetalhes(${idx})" class="hover:underline">${linha[0]}</button></td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-[9px] font-black uppercase ${color}">${sReal}</span></td>
                        <td class="p-4"><b>${linha[1]}</b><br><small class="text-gray-400 uppercase font-black">${linha[2]}</small></td>
                        <td class="p-4 text-center text-xs font-bold">${formatarDataBR(linha[10])}</td>
                        <td class="p-4 text-center">
                            <select onchange="atualizarCampo(${row}, 'responsavel', this.value)" class="text-[10px] border rounded p-1 font-bold">
                                <option value="">---</option>
                                ${LISTA_RESPONSAVEIS.map(r => `<option value="${r}" ${linha[14] === r ? 'selected' : ''}>${r}</option>`).join('')}
                            </select>
                        </td>
                        <td class="p-4 text-center">
                            <input type="date" value="${dPrevRaw ? dPrevRaw.split('T')[0] : ''}" onchange="definirPrevisao(${row}, this.value)" class="text-[10px] border rounded p-1 font-bold">
                        </td>
                        <td class="p-4 text-center">${acaoHTML}</td>
                    </tr>`;
            });
        }

        // --- MODAL DE DETALHES ---
        function verDetalhes(idx) {
            const t = dadosGlobais[idx];
            ticketAbertoAtual = { index: idx, row: idx + 2 };
            
            // MAPA DE COLUNAS: A=0, B=1, C=2, D=3, E=4, F=5, G=6...
            document.getElementById('detalheID').innerText = t[0];
            document.getElementById('detalheSeac').innerText = t[1];      // B: Cód Prod
            document.getElementById('detalheForn').innerText = t[2];      // C: Fornecedor
            document.getElementById('detalheRef').innerText = t[3];       // D: Referência
            document.getElementById('detalheCodCli').innerText = t[4] || "---"; // E: Cód Cliente
            document.getElementById('detalheLote').innerText = t[6] || "---";   // G: Tonalidade/Lote
            document.getElementById('detalheQtd').innerText = String(t[5] || 0).replace('.', ','); // F: Qtd
            document.getElementById('detalheUM').innerText = t[16] || "";       // Q: UM
            document.getElementById('detalheMotivo').innerText = t[7] || "---"; // H: Motivo
            document.getElementById('detalheTipo').innerText = t[17] || "---";  // R: Tipo
            document.getElementById('detalheAcordo').innerText = t[19] || "Sem acordo registrado."; // T: Acordo
            document.getElementById('detalheObs').value = t[8] || "";           // I: Obs

            // Timeline
            const dA = formatarDataBR(t[10]), dT = formatarDataBR(t[15]), dP = formatarDataBR(t[12]), dC = t[11] ? formatarDataBR(t[11]) : "---";
            document.getElementById('timeAbertura').innerText = dA;
            document.getElementById('timeTriagem').innerText = dT;
            document.getElementById('timePrevisaoModal').innerText = dP;
            document.getElementById('timeConclusao').innerText = dC;

            const p = document.getElementById('timelineProgress'), sT = document.getElementById('stepTriagem'), sP = document.getElementById('stepPrevisao'), sC = document.getElementById('stepConclusao');
            [sT, sP, sC].forEach(s => s.classList.remove('active'));
            p.style.width = "5%";
            if (dT !== "---") { p.style.width = "33%"; sT.classList.add('active'); }
            if (dP !== "---") { p.style.width = "66%"; sP.classList.add('active'); }
            if (dC !== "---") { p.style.width = "100%"; sC.classList.add('active'); }

            const sel = document.getElementById('selectResponsavelModal');
            sel.innerHTML = '<option value="">Selecione...</option>';
            LISTA_RESPONSAVEIS.forEach(r => sel.innerHTML += `<option value="${r}" ${t[14] === r ? 'selected' : ''}>${r}</option>`);

            document.getElementById('modalDetalhes').classList.remove('hidden');
        }

        async function salvarAlteracoesNoModal() {
            if(!ticketAbertoAtual) return;
            const btn = document.getElementById('btnSalvarObs');
            const novaObs = document.getElementById('detalheObs').value;
            const novoResp = document.getElementById('selectResponsavelModal').value;
            btn.disabled = true; btn.innerText = "Gravando...";
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: ticketAbertoAtual.row, field: 'observacao', value: novaObs }) });
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: ticketAbertoAtual.row, field: 'responsavel', value: novoResp }) });
                alert("Salvo com sucesso!");
                fecharModalDetalhes();
                carregarTickets();
            } catch (e) { alert("Erro ao salvar."); }
            finally { btn.disabled = false; btn.innerText = "Salvar Alterações"; }
        }

        async function atualizarCampo(row, campo, valor) {
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update_field', row: row, field: campo, value: valor }) });
                setTimeout(carregarTickets, 800);
            } catch (e) {}
        }

        async function definirPrevisao(row, valor) {
            if(!valor) return;
            const hoje = new Date().toLocaleDateString('pt-BR');
            await atualizarCampo(row, 'previsao', valor);
            await atualizarCampo(row, 'status', 'Em andamento');
            await atualizarCampo(row, 'data_definicao', hoje);
        }

        async function finalizarTicket(row) {
            if(!confirm("Concluir chamado?")) return;
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rota: 'pendencias', action: 'update', row: row, status: 'Resolvido' }) });
            setTimeout(carregarTickets, 800);
        }

        // --- ENVIO FORMULARIO ---
        document.getElementById('formTicket').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar'); 
            btn.disabled = true; btn.innerText = "Salvando...";

            const payload = Object.fromEntries(new FormData(e.target));
            payload.criado_por = localStorage.getItem('vilarejo_user') || 'Sistema'; 
            if (payload.motivo === 'Outros') payload.motivo = document.getElementById('inputOutros').value;
            payload.rota = 'pendencias'; 
            payload.action = 'insert';

            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("Ticket registrado!");
                fecharModal();
                carregarTickets();
            } catch (e) { alert("Erro ao salvar."); }
            finally { btn.disabled = false; btn.innerText = "Salvar Ticket"; }
        });

        // --- DASHBOARD E CARDS ---
        function atualizarCardsGerais(dados) {
            let ana = 0, and = 0, atr = 0, res = 0;
            dados.forEach(d => {
                const s = calcularStatusReal(d);
                if(s === 'Resolvido') res++; else if(s.includes('Análise')) ana++; else if(s === 'Atrasado') atr++; else and++;
            });
            document.getElementById('cardAnalise').innerText = ana;
            document.getElementById('cardAndamento').innerText = and;
            document.getElementById('cardAtraso').innerText = atr;
            document.getElementById('cardResolvido').innerText = res;
        }

        function abrirDashboard() { 
            document.getElementById('modalDashboard').classList.remove('hidden'); 
            const hoje = new Date();
            document.getElementById('dashDataInicio').value = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split('T')[0];
            document.getElementById('dashDataFim').value = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).toISOString().split('T')[0];
            processarDadosDash();
        }
        function fecharDashboard() { document.getElementById('modalDashboard').classList.add('hidden'); }

        function processarDadosDash() {
            const ini = new Date(document.getElementById('dashDataInicio').value + "T00:00:00");
            const fim = new Date(document.getElementById('dashDataFim').value + "T23:59:59");
            let total = 0;
            const cont = { "Quebra fábrica": 0, "Quebra depósito/Loja": 0, "Quebra de produto na embalagem(Externa)": 0, "Divergência de Estoque": 0, "Outros": 0 };
            dadosGlobais.forEach(d => {
                const da = new Date(d[10]);
                if (da >= ini && da <= fim) {
                    total++;
                    const m = d[7] || "";
                    if (cont[m] !== undefined) cont[m]++; else cont["Outros"]++;
                }
            });
            document.getElementById('totalMesDash').innerText = total;
            renderizarGrafico(cont);
        }

        function renderizarGrafico(cont) {
            const ctx = document.getElementById('graficoMotivos').getContext('2d');
            if(chartMotivos) chartMotivos.destroy();
            chartMotivos = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(cont),
                    datasets: [{ data: Object.values(cont), backgroundColor: ['#E30613', '#111827', '#3b82f6', '#94a3b8'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
            const leg = document.getElementById('listaLegendaDash');
            leg.innerHTML = '';
            Object.keys(cont).forEach(m => {
                leg.innerHTML += `<div class="flex justify-between p-3 bg-gray-50 rounded-xl font-bold text-xs"><span>${m}</span><span>${cont[m]}</span></div>`;
            });
        }

        window.onload = carregarTickets;
    </script>
</body>
</html>
