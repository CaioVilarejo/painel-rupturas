<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard Atendimento - Vilarejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#E30613" } } }
        }
    </script>

    <style type="text/css">
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .chart-container { position: relative; height: 450px; width: 100%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto">
                
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-2xl font-black uppercase tracking-tight text-gray-800">Métricas de Atendimento</h1>
                        <p class="text-xs text-gray-500 font-bold uppercase tracking-widest">Extração de dados via Octadesk</p>
                    </div>
                    <button onclick="carregarDadosAtendimento()" class="bg-white border p-3 rounded-2xl hover:bg-gray-50 transition-all shadow-sm">
                        <span class="material-symbols-outlined text-gray-600">refresh</span>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Total de Atendimentos</p>
                        <h3 id="cardTotalAtendimentos" class="text-4xl font-black text-gray-800">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Colaboradores Diferentes</p>
                        <h3 id="cardColaboradoresUnicos" class="text-4xl font-black text-gray-800">0</h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-8 mb-8">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border">
                        <h4 class="text-xs font-black text-gray-400 uppercase mb-6">Atendimentos por Loja</h4>
                        <div class="chart-container">
                            <canvas id="chartLojas"></canvas>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-3xl shadow-sm border">
                        <h4 class="text-xs font-black text-gray-400 uppercase mb-6">Top 10 Vendedores Mais Atendidos</h4>
                        <div class="chart-container">
                            <canvas id="chartVendedores"></canvas>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-3xl shadow-sm border">
                        <h4 class="text-xs font-black text-gray-400 uppercase mb-6">Vendedor mais atendido (Líder por Loja)</h4>
                        <div class="chart-container">
                            <canvas id="chartVendedorPorLoja"></canvas>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-1 mb-8">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border">
                        <h4 class="text-xs font-black text-gray-400 uppercase mb-6">Atendimento por Responsável</h4>
                        <div class="h-[400px] flex items-center justify-center">
                            <canvas id="chartResponsaveis"></canvas>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbznCForFxpY6CAU6W3UgglusC8oqyfDz0dqM-l_95xtr9CK9TcFvbw_V7LJQk8jTZH-/exec';
        
        // Registrar o plugin de rótulos de dados globalmente
        Chart.register(ChartDataLabels);

        let charts = {};

        async function carregarDadosAtendimento() {
            try {
                const response = await fetch(`${WEB_APP_URL}?rota=atendimento`);
                const dados = await response.json();
                processarDashboard(dados);
            } catch (error) { console.error(error); }
        }

        function processarDashboard(dados) {
            const contagemLojas = {};
            const contagemVendedores = {};
            const contagemResponsaveis = {};
            const vendedorPorLoja = {};

            dados.forEach(d => {
                const vendedor = d[2] || "Desconhecido";
                const loja = d[3] || "Sem Loja";
                const responsavel = d[11] || "Sem Atendente";

                contagemLojas[loja] = (contagemLojas[loja] || 0) + 1;
                contagemVendedores[vendedor] = (contagemVendedores[vendedor] || 0) + 1;
                contagemResponsaveis[responsavel] = (contagemResponsaveis[responsavel] || 0) + 1;

                if (!vendedorPorLoja[loja]) vendedorPorLoja[loja] = {};
                vendedorPorLoja[loja][vendedor] = (vendedorPorLoja[loja][vendedor] || 0) + 1;
            });

            document.getElementById('cardTotalAtendimentos').innerText = dados.length;
            document.getElementById('cardColaboradoresUnicos').innerText = new Set(dados.map(d => d[2])).size;

            // Gráfico de Lojas
            renderHorizontalChart('chartLojas', Object.keys(contagemLojas), Object.values(contagemLojas), '#3b82f6');

            // Top 10 Vendedores
            const top10 = Object.entries(contagemVendedores).sort((a,b)=>b[1]-a[1]).slice(0,10);
            renderHorizontalChart('chartVendedores', top10.map(v=>v[0]), top10.map(v=>v[1]), '#E30613');

            // Líder por Loja
            const labelsLojas = [];
            const valoresLideres = [];
            Object.keys(vendedorPorLoja).forEach(loja => {
                const lider = Object.entries(vendedorPorLoja[loja]).sort((a,b)=>b[1]-a[1])[0];
                labelsLojas.push(`${loja}: ${lider[0]}`);
                valoresLideres.push(lider[1]);
            });
            renderHorizontalChart('chartVendedorPorLoja', labelsLojas, valoresLideres, '#111827');

            // Responsáveis (Pizza/Rosca)
            renderPieChart('chartResponsaveis', Object.keys(contagemResponsaveis), Object.values(contagemResponsaveis));
        }

        function renderHorizontalChart(id, labels, data, color) {
            if (charts[id]) charts[id].destroy();
            const ctx = document.getElementById(id).getContext('2d');
            charts[id] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: color,
                        borderRadius: 6,
                        barThickness: 20
                    }]
                },
                options: {
                    indexAxis: 'y', // TORNA O GRÁFICO HORIZONTAL
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { right: 40 } }, // Espaço para o número não sumir
                    plugins: {
                        legend: { display: false },
                        datalabels: { // CONFIGURAÇÃO DOS NÚMEROS FIXOS
                            anchor: 'end',
                            align: 'right',
                            color: '#444',
                            font: { weight: 'bold', size: 11 },
                            formatter: Math.round
                        }
                    },
                    scales: {
                        x: { display: false, grid: { display: false } },
                        y: { 
                            grid: { display: false },
                            ticks: { font: { size: 10, weight: 'bold' }, color: '#333' } 
                        }
                    }
                }
            });
        }

        function renderPieChart(id, labels, data) {
            if (charts[id]) charts[id].destroy();
            const ctx = document.getElementById(id).getContext('2d');
            charts[id] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#E30613', '#111827', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 11, weight: 'bold' }, padding: 20 } },
                        datalabels: {
                            color: '#fff',
                            font: { weight: 'bold', size: 12 },
                            formatter: (value) => value
                        }
                    }
                }
            });
        }

        window.onload = carregarDadosAtendimento;
    </script>
</body>
</html>
