<script>
        // CORREÇÃO: URL forçada para o GID 0 (primeira aba), garantindo a sincronização.
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFrtHpxDu4l00gW7WtoY_WnPHtBukuZwecJAI9UKo6ajc5BWKUT07vfqK5MDXHpWsWQ4T8UygDWcwG/pub?gid=0&single=true&output=csv';
        let rupturaChart;
        let todosItensRompidos = []; 

        const itemColors = {
            'H': '#E30613',
            'B': '#3B82F6',
            'TH': '#6B7280'
        };

        function isRompido(status) {
            if (!status) return false;
            return status.trim().toUpperCase() === 'ROMPIDO';
        }

        async function carregarDados() {
            document.getElementById('lastUpdate').innerText = "Sincronizando...";
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const dadosLimpos = results.data.filter(item => item['Descrição do produto'] && item['HBT']);
                    processarPlanilha(dadosLimpos);
                },
                error: function(error) {
                    console.error("Erro ao carregar dados:", error);
                    document.getElementById('lastUpdate').innerText = "Erro ao sincronizar. Verifique o link CSV ou a publicação da planilha.";
                }
            });
        }

        function popularFiltrosGrupo(dados) {
            const filter = document.getElementById('groupFilter');
            filter.innerHTML = '<option value="todos">Filtrar por Grupo (Todos)</option>'; 
            
            const gruposUnicos = [...new Set(dados.map(item => (item['Grupo'] || 'Sem Grupo').trim()))].sort();
            
            gruposUnicos.forEach(grupo => {
                const option = document.createElement('option');
                option.value = grupo.toLowerCase(); 
                option.textContent = grupo;
                filter.appendChild(option);
            });
        }

        function preencherTabela(dadosOrdenados) {
            const tbody = document.querySelector('#tabelaDados tbody');
            tbody.innerHTML = ''; 
            
            let htmlContent = '';

            dadosOrdenados.forEach(item => {
                const ehCritico = isRompido(item['Romp.Futuro']);
                const rowClass = ehCritico 
                    ? "bg-primary/5 hover:bg-primary/10 transition-colors border-l-4 border-primary shadow-sm"
                    : "hover:bg-gray-50 transition-colors";
                
                const pedidoValue = (item['Pedido'] === '0' || !item['Pedido']) ? 'N/A' : item['Pedido'];
                const grupoValue = (item['Grupo'] || 'Sem Grupo').trim();
                const hbt = (item['HBT'] || 'N/A').trim();
                const corHBT = itemColors[hbt] || '#ccc';

                htmlContent += `
                    <tr class="${rowClass}" 
                        data-grupo="${grupoValue.toLowerCase()}" 
                        data-status="${ehCritico ? 'futuro' : 'atual'}"
                        data-search="${item['Descrição do produto'].toUpperCase() + item['Código'].toUpperCase() + grupoValue.toUpperCase()}">
                        
                        <td class="px-6 py-4">
                            <div class="flex flex-col">
                                <span class="font-bold text-gray-800">${item['Descrição do produto'] || 'Desconhecida'}</span>
                                <span class="text-xs text-gray-500">${item['Fornecedor'] || 'Desconhecido'}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-gray-500 font-mono">${item['Código'] || 'N/A'}</td>
                        <td class="px-6 py-4 font-medium">
                            <span class="inline-block w-3 h-3 rounded-full mr-2" style="background-color: ${corHBT};"></span>
                            ${hbt}
                        </td>
                        <td class="px-6 py-4 text-gray-700 font-medium">${grupoValue}</td> 
                        <td class="px-6 py-4">${item['Estoque Total'] || '0'}</td>
                        <td class="px-6 py-4">${pedidoValue}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlContent;
        }

        // NOVO: Função para criar o gráfico
        function criarGraficoRuptura(contadores) {
            const ctx = document.getElementById('rupturaChart').getContext('2d');
            
            const labels = ['Item H', 'Item B', 'Item TH'];
            const dataAtual = [contadores.H.atual, contadores.B.atual, contadores.TH.atual];
            const dataFutura = [contadores.H.futuro, contadores.B.futuro, contadores.TH.futuro];
            const cores = [itemColors['H'], itemColors['B'], itemColors['TH']];

            if (rupturaChart) {
                rupturaChart.destroy();
            }

            rupturaChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Ruptura Atual',
                            data: dataAtual,
                            backgroundColor: cores.map(c => `${c}B0`), // Cor um pouco mais clara
                            borderColor: cores,
                            borderWidth: 1
                        },
                         {
                            label: 'Ruptura Futura (Crítico)',
                            data: dataFutura,
                            backgroundColor: cores.map(c => `${c}FF`), // Cor original mais escura/sólida
                            borderColor: cores,
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Total de Itens Rompidos'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            });
        }
        
        function processarPlanilha(dados) {
            
            const rompidos = dados.filter(item => isRompido(item['Romp.Atual']));
            todosItensRompidos = rompidos;

            const rompidosH = rompidos.filter(i => i['HBT'].trim() === 'H');
            const rompidosB = rompidos.filter(i => i['HBT'].trim() === 'B');
            const rompidosTH = rompidos.filter(i => i['HBT'].trim() === 'TH');

            const futurosH = rompidosH.filter(i => isRompido(i['Romp.Futuro'])).length;
            const futurosB = rompidosB.filter(i => isRompido(i['Romp.Futuro'])).length;
            const futurosTH = rompidosTH.filter(i => isRompido(i['Romp.Futuro'])).length;

            const contadores = {
                H: { atual: rompidosH.length, futuro: futurosH },
                B: { atual: rompidosB.length, futuro: futurosB },
                TH: { atual: rompidosTH.length, futuro: futurosTH }
            };

            atualizarCard('countH', contadores.H.atual, contadores.H.futuro);
            atualizarCard('countB', contadores.B.atual, contadores.B.futuro);
            atualizarCard('countTH', contadores.TH.atual, contadores.TH.futuro);
            
            // CHAMA A FUNÇÃO DO GRÁFICO AQUI
            criarGraficoRuptura(contadores);

            // Alerta Geral
            const totalFuturoGeral = futurosH + futurosB + futurosTH;
            const alertaDiv = document.getElementById('alertaRuptura');
            if (totalFuturoGeral > 0) {
                alertaDiv.style.display = 'flex';
                alertaDiv.querySelector('p.text-base').innerText = `Existem ${totalFuturoGeral} itens críticos que continuarão rompidos por falta de pedido.`;
            } else {
                alertaDiv.style.display = 'none';
            }

            // Tabela
            const dadosOrdenados = rompidos.sort((a, b) => {
                const aCritico = isRompido(a['Romp.Futuro']);
                const bCritico = isRompido(b['Romp.Futuro']);
                if (aCritico && !bCritico) return -1;
                if (!aCritico && bCritico) return 1;
                return 0;
            });
            
            popularFiltrosGrupo(dados);
            preencherTabela(dadosOrdenados);
            aplicarFiltros(); 
            
            document.getElementById('lastUpdate').innerText = `Sincronizado: ${new Date().toLocaleTimeString()} • Próxima: ${new Date(new Date().getTime() + 300000).toLocaleTimeString()}`;
        }

        function atualizarCard(id, total, futuro) {
            const elemento = document.getElementById(id);
            const mainColorClass = id === 'countH' ? 'text-primary' : id === 'countB' ? 'text-blue-custom' : 'text-gray-custom';

            elemento.innerHTML = `
                <div class="flex flex-col items-start pb-3 border-b-2 border-gray-100 mb-2">
                    <span class="text-xs font-bold text-primary uppercase mb-1 flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">warning</span> RUPTURA FUTURA
                    </span>
                    <div class="flex items-center gap-2">
                        <span class="text-4xl font-black ${futuro > 0 ? 'text-primary' : 'text-gray-400'}">
                            ${futuro}
                        </span>
                        ${futuro > 0 ? `<span class="material-symbols-outlined text-xl text-primary ping-animation">priority_high</span>` : ''}
                    </div>
                </div>
                
                <div class="flex flex-col items-start mt-2">
                    <span class="text-xs font-bold text-gray-400 uppercase mb-1">Ruptura Atual</span>
                    <span class="text-2xl font-bold ${mainColorClass}">${total}</span>
                </div>
            `;
        }

        function aplicarFiltros() {
            const searchInput = document.getElementById('searchInput').value.toUpperCase();
            const groupFilter = document.getElementById('groupFilter').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const trs = document.querySelectorAll('#tabelaDados tbody tr');
            let visibleCount = 0;

            trs.forEach(tr => {
                const grupoDaLinha = tr.getAttribute('data-grupo');
                const matchGrupo = (groupFilter === 'todos' || grupoDaLinha === groupFilter);

                const statusDaLinha = tr.getAttribute('data-status');
                const matchStatus = (statusFilter === 'todos' || statusDaLinha === statusFilter);

                const searchData = tr.getAttribute('data-search');
                const matchSearch = searchData.includes(searchInput);

                if (matchGrupo && matchStatus && matchSearch) {
                    tr.style.display = '';
                    visibleCount++;
                } else {
                    tr.style.display = 'none';
                }
            });

            document.getElementById('tableFooter').innerText = `Exibindo ${visibleCount} itens que atendem aos filtros. Total de itens com ruptura atual: ${todosItensRompidos.length}`;
        }

        carregarDados();
        setInterval(carregarDados, 300000);
    </script>
